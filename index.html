function hbars(rows, opt={}){
  const max = Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `<div class="hbar" data-tip="${esc(r.tip || `${r.l} : ${r.v}`)}"><span class="lbl" title="${esc(r.l)}">${esc(r.l)}</span>
    <span class="track"><span class="fill" style="width:${(opt.scale100 ? r.v : r.v / max * 100)}%;${r.hi ? 'background:var(--series-2)' : ''}"></span></span>
    <span class="val">${r.display ?? r.v}</span></div>`).join('') || '<div class="empty">Pas encore de données.</div>';
}
function viewStats(){
  const calls = periodCalls(ui.period);
  const touchedIds = new Set(calls.map(k => k.cabinetId));
  const touched = ui.period === 'all' ? state.cabinets : state.cabinets.filter(c => touchedIds.has(c.id));
  const dec = calls.filter(k => DECROCHE.has(k.resultat));
  const decid = calls.filter(k => DECIDEUR.has(k.resultat));
  const demos = calls.filter(k => k.resultat === 'demo');
  const interested = touched.filter(c => STATUT_RANK[c.statut] >= STATUT_RANK.interesse && c.statut !== 'perdu' || calls.some(k => k.cabinetId === c.id && ['argumente','demo'].includes(k.resultat)) && c.statut !== 'perdu');
  const props = touched.filter(c => ['proposition','signe'].includes(c.statut));
  const signed = touched.filter(c => c.statut === 'signe');
  const funnel = [['Appels', calls.length],['Décrochés', dec.length],['Décideurs atteints', decid.length],['Intéressés', interested.length],['Démos', demos.length],['Propositions', props.length],['Signés', signed.length]];
  const funnelRows = funnel.map(([l, v], i) => ({l, v, display: `${v}${i ? ` <small>${pct(v, funnel[i-1][1])} %</small>` : ''}`, tip: i ? `${l} : ${v} (${pct(v, funnel[i-1][1])} % de l’étape précédente)` : `${l} : ${v}`}));

  const resRows = RESULTATS.map(r => { const v = calls.filter(k => k.resultat === r.k).length; return {l:r.l, v, display:`${v} <small>${pct(v, calls.length)} %</small>`}; });

  const bySpe = SPECIALITES.map(s => {
    const ids = new Set(calls.filter(k => cab(k.cabinetId)?.specialite === s).map(k => k.cabinetId));
    const withDemo = [...ids].filter(id => calls.some(k => k.cabinetId === id && k.resultat === 'demo')).length;
    return {l: s === 'Maison de santé pluriprofessionnelle' ? 'Maisons de santé' : s, v: pct(withDemo, ids.size), n: ids.size, d: withDemo};
  }).filter(r => r.n).sort((a,b) => b.v - a.v).map(r => ({...r, display:`${r.v} %`, tip:`${r.l} : ${r.d} démo(s) sur ${r.n} cabinet(s) appelé(s)`}));

  const irrRows = IRRITANTS.map(i => ({l:i.l, v: touched.filter(c => c.qualif && c.qualif.irritant === i.k).length})).sort((a,b) => b.v - a.v);
  const useRows = USAGES.map(u => ({l:u.l, v: touched.filter(c => c.qualif && (c.qualif.usages || []).includes(u.k)).length})).sort((a,b) => b.v - a.v);

  const slots = [];
  for (let h = 8; h <= 19; h++){
    const cs = calls.filter(k => new Date(k.date).getHours() === h);
    const d = cs.filter(k => DECROCHE.has(k.resultat)).length;
    slots.push({l:`${h} h – ${h + 1} h`, v: pct(d, cs.length), n: cs.length, d});
  }
  const withCalls = slots.filter(s => s.n);
  const best = [...withCalls].filter(s => s.n >= 2).sort((a,b) => b.v - a.v).slice(0, 3).map(s => s.l);
  const slotRows = withCalls.map(s => ({...s, hi: best.includes(s.l), display:`${s.v} %`, tip:`${s.l} : ${s.d} décroché(s) sur ${s.n} appel(s)`}));

  const totalDur = calls.reduce((s, k) => s + (k.duree || 0), 0);
  return `<div class="page">
    <div class="page-head"><div><h1>Statistiques</h1><p>${calls.length} appels · ${touched.length} cabinets concernés · ${fmtNum(totalDur / 3600, 1)} h au téléphone</p></div>
      <div class="seg">${[['7','7 jours'],['30','30 jours'],['all','Tout']].map(([k,l]) => `<button class="${ui.period === k ? 'on' : ''}" data-act="period" data-k="${k}">${l}</button>`).join('')}</div></div>
    <div class="grid g-2" style="margin-bottom:16px">
      <div class="card funnel"><div class="card-head"><h2>Entonnoir</h2><span class="small faint">% par rapport à l’étape précédente</span></div>${hbars(funnelRows)}</div>
      <div class="card"><div class="card-head"><h2>Résultats des appels</h2></div>${hbars(resRows)}</div>
    </div>
    <div class="grid g-2" style="margin-bottom:16px">
      <div class="card"><div class="card-head"><h2>Taux de démo par spécialité</h2><span class="small faint">cabinets avec démo / appelés</span></div>${hbars(bySpe, {scale100:true})}</div>
      <div class="card"><div class="card-head"><h2>Meilleurs créneaux pour joindre les cabinets</h2><span class="small faint">taux de décroché</span></div>
        ${best.length ? `<p class="small muted" style="margin:-4px 0 10px">À privilégier : <b style="color:var(--text)">${best.join(', ')}</b></p>` : ''}${hbars(slotRows, {scale100:true})}</div>
    </div>
    <div class="grid g-2">
      <div class="card"><div class="card-head"><h2>Irritants les plus fréquents</h2></div>${hbars(irrRows)}</div>
      <div class="card"><div class="card-head"><h2>Cas d’usage les plus demandés</h2></div>${hbars(useRows)}</div>
    </div>
  </div>`;
}

/* CSV */
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const sep = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep){ row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return {sep, rows: rows.filter(r => r.some(x => x.trim()))};
}
const CSV_ALIASES = {
  nom:['nom','nom du cabinet','cabinet','raison sociale','name'], specialite:['specialite','specialty'], praticiens:['praticiens','nombre de praticiens','nb praticiens','medecins'],
  secretaires:['secretaires','nombre de secretaires','nb secretaires'], adresse:['adresse','address','rue'], cp:['cp','code postal','code_postal'], ville:['ville','city','commune'],
  tel:['telephone','tel','téléphone','phone','numero'], email:['email','mail','e-mail','courriel'], interlocuteur:['interlocuteur','contact'], role:['role','fonction'],
  decideur:['decideur','décideur'], logiciel:['logiciel','logiciel metier','logiciel métier'], externalise:['externalise','secretariat externalise','externalisé'],
  priorite:['priorite','priority'], statut:['statut','status'], notes:['notes','note','commentaire','commentaires'],
};
function importCSV(text){
  const {sep, rows} = parseCSV(text);
  if (rows.length < 2){ toast('Fichier vide ou illisible'); return; }
  const head = rows[0].map(h => norm(h));
  const idx = {};
  for (const [k, al] of Object.entries(CSV_ALIASES)){ const i = head.findIndex(h => al.map(norm).includes(h)); if (i >= 0) idx[k] = i; }
  if (idx.nom == null){ toast('Colonne « nom » introuvable'); return; }
  let n = 0;
  for (const r of rows.slice(1)){
    const g = k => idx[k] != null ? (r[idx[k]] || '').trim() : '';
    if (!g('nom')) continue;
    const c = newCabinet();
    c.nom = g('nom');
    const spe = SPECIALITES.find(s => norm(s) === norm(g('specialite'))) || SPECIALITES.find(s => g('specialite') && norm(s).startsWith(norm(g('specialite')).slice(0, 5)));
    if (spe) c.specialite = spe;
    c.praticiens = Math.max(1, parseInt(g('praticiens')) || 1);
    c.secretaires = Math.max(0, parseInt(g('secretaires')) || 0);
    ['adresse','cp','ville','tel','email','interlocuteur','decideur','notes'].forEach(k => { if (g(k)) c[k] = g(k); });
    const role = ROLES.find(x => norm(x) === norm(g('role'))); if (role) c.role = role;
    const log = LOGICIELS.find(x => norm(x) === norm(g('logiciel'))); if (log) c.logiciel = log; else if (g('logiciel')) c.logiciel = 'Autre';
    c.externalise = /^(oui|o|yes|y|1|true|vrai)$/i.test(g('externalise'));
    const p = parseInt(g('priorite')); if (p >= 1 && p <= 3) c.priorite = p;
    const st = STATUTS.find(s => norm(s.l) === norm(g('statut')) || s.k === norm(g('statut'))); if (st) c.statut = st.k;
    state.cabinets.push(c); n++;
  }
  save(); toast(`${n} cabinet${n > 1 ? 's' : ''} importé${n > 1 ? 's' : ''} (séparateur « ${sep} »)`); render();
}
function exportCSV(){
  const cols = [['nom','Nom'],['specialite','Spécialité'],['praticiens','Praticiens'],['secretaires','Secrétaires'],['adresse','Adresse'],['cp','Code postal'],['ville','Ville'],['tel','Téléphone'],['email','Email'],['interlocuteur','Interlocuteur'],['role','Rôle'],['decideur','Décideur'],['logiciel','Logiciel'],['externalise','Externalisé'],['priorite','Priorité'],['statut','Statut'],['notes','Notes']];
  const qcols = [['appelsJour','Appels par jour'],['partManques','Appels manqués (%)'],['heuresSecretariat','Heures secrétariat / sem.'],['heuresAdmin','Heures admin / sem.'],['irritant','Irritant'],['usages','Cas d’usage'],['decideurIdentifie','Décideur identifié'],['budget','Budget'],['echeance','Échéance'],['ouverture','Ouverture IA']];
  const cell = v => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [[...cols.map(c => c[1]), ...qcols.map(c => c[1]), 'Gain mensuel estimé', 'Dernier appel', 'Prochaine action', 'Date prochaine action'].map(cell).join(';')];
  for (const c of state.cabinets){
    const q = c.qualif || {};
    lines.push([
      ...cols.map(([k]) => k === 'externalise' ? (c[k] ? 'oui' : 'non') : k === 'statut' ? statutLabel(c[k]) : c[k]),
      ...qcols.map(([k]) => k === 'irritant' ? (q[k] ? irrLabel(q[k]) : '') : k === 'usages' ? (q[k] || []).map(usageLabel).join(', ') : k === 'decideurIdentifie' ? (q[k] ? 'oui' : 'non') : k === 'ouverture' ? ((OUVERTURES.find(o => o.k === q[k]) || {}).l || '') : q[k]),
      c.calc && c.calc.result ? Math.round(c.calc.result.gainMois) : '',
      c.lastCall ? ymd(new Date(c.lastCall)) : '',
      c.next ? typeLabel(c.next.type) : '', c.next ? `${c.next.date} ${c.next.time || ''}`.trim() : '',
    ].map(cell).join(';'));
  }
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `cabinets-${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Export CSV téléchargé');
}

/* ==========================================================================
   Modale, toast, infobulle, thème
   ========================================================================== */
function openModal(html, size=''){
  $('#modal').innerHTML = `<div class="overlay" data-overlay><div class="modal ${size}" role="dialog" aria-modal="true">${html}</div></div>`;
}
function closeModal(){ $('#modal').innerHTML = ''; }
const isModalOpen = () => !!$('#modal .overlay');
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
function confirmBox(title, text, okLabel, onOk){
  openModal(`<div class="modal-head"><div><h2>${esc(title)}</h2><p>${esc(text)}</p></div></div>
    <div class="modal-foot"><button class="btn" data-act="closeModal">Annuler</button><button class="btn primary" id="confirmOk">${esc(okLabel)}</button></div>`);
  $('#confirmOk').onclick = () => { closeModal(); onOk(); };
  $('#confirmOk').focus();
}
function showTip(el, e){ const t = $('#tooltip'); t.textContent = el.dataset.tip; t.classList.add('show'); moveTip(e); }
function moveTip(e){ const t = $('#tooltip'); const w = t.offsetWidth; t.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, e.clientX - w / 2)) + 'px'; t.style.top = (e.clientY - 40) + 'px'; }
function hideTip(){ const t = $('#tooltip'); if (t) t.classList.remove('show'); }
function applyTheme(t){
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
function toggleTheme(){
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  renderShell();
}
</script>
<script>
/* ==========================================================================
   Événements
   ========================================================================== */
const currentCab = () => { const r = route(); return r.name === 'cabinet' ? cab(r.arg) : null; };

const actions = {
  drawer(){
    const d = $('#drawer');
    if (d.innerHTML){ d.innerHTML = ''; return; }
    d.innerHTML = `<div class="drawer" data-drawer><aside class="sidebar">${$('#sidebar').innerHTML}</aside></div>`;
  },
  theme(){ toggleTheme(); },
  newCabinet(){ cabinetForm(newCabinet(), true); },
  editCabinet(el){ const c = cab(el.dataset.id); if (c) cabinetForm(c, false); },
  deleteCabinet(el){
    const c = cab(el.dataset.id);
    confirmBox('Supprimer ce cabinet ?', `${c.nom} et son historique d’appels seront supprimés définitivement.`, 'Supprimer', () => {
      state.cabinets = state.cabinets.filter(x => x.id !== c.id);
      state.calls = state.calls.filter(k => k.cabinetId !== c.id);
      save(); toast('Cabinet supprimé'); location.hash = '#/cabinets'; render();
    });
  },
  closeModal(){ closeModal(); },
  clearFilters(){ ui.filters = {q:'', statut:'', specialite:'', ville:'', priorite:''}; render(); },
  sort(el){ const k = el.dataset.k; ui.sort = {key:k, dir: ui.sort.key === k ? -ui.sort.dir : 1}; $('#cabTable').innerHTML = cabTable(); },
  open(el){ location.hash = '#/cabinet/' + el.dataset.id; },
  dial(){ startTimer(); return true; },
  timer(){ ui.timer.start ? stopTimer() : startTimer(); },
  result(el){ const c = currentCab(); if (c) openResult(c, el.dataset.res); },
  saveResult(){ commitResult(false); },
  tab(el){ ui.tab = el.dataset.tab; $$('.tabs button').forEach(b => b.classList.toggle('on', b === el)); refreshRight(); },
  irritant(el){ const c = currentCab(); c.qualif.irritant = c.qualif.irritant === el.dataset.k ? '' : el.dataset.k; markChips(el, 'single'); save(); refreshRight(); },
  usage(el){ const c = currentCab(); const u = c.qualif.usages; const k = el.dataset.k; c.qualif.usages = u.includes(k) ? u.filter(x => x !== k) : [...u, k]; el.classList.toggle('on'); save(); },
  decId(el){ const c = currentCab(); c.qualif.decideurIdentifie = el.dataset.k === '1'; segOn(el); save(); },
  ouverture(el){ const c = currentCab(); c.qualif.ouverture = c.qualif.ouverture === el.dataset.k ? '' : el.dataset.k; el.classList.contains('on') ? el.classList.remove('on') : segOn(el); save(); },
  segPick(el){ segOn(el); },
  editScript(){ ui.editScript = !ui.editScript; refreshRight(); },
  resetScript(){ confirmBox('Restaurer le script par défaut ?', 'Vos modifications du script seront perdues.', 'Restaurer', () => { state.script = {steps: structuredClone(DEFAULT_SCRIPT), valueProps: structuredClone(DEFAULT_VALUE_PROPS)}; save(); refreshRight(); }); },
  step(el){ ui.activeStep = +el.dataset.i; refreshRight(); },
  editObj(){ ui.editObj = !ui.editObj; refreshRight(); },
  resetObj(){ confirmBox('Restaurer les objections par défaut ?', 'Vos modifications des objections seront perdues.', 'Restaurer', () => { state.objections = structuredClone(DEFAULT_OBJECTIONS); save(); refreshRight(); }); },
  addObj(){ state.objections.unshift({id:uid(), q:'Nouvelle objection', a:''}); save(); refreshRight(); },
  delObj(el){ state.objections.splice(+el.dataset.i, 1); save(); refreshRight(); },
  calcSave(){
    const c = currentCab(); const inputs = calcInputs(c);
    c.calc = {inputs:{...inputs}, result: calcGains(inputs), savedAt: new Date().toISOString()};
    delete ui.calcDraft[c.id]; save(); toast(`Gain enregistré : ${fmtEur(c.calc.result.gainMois)} / mois`); refreshRight();
  },
  calcReset(){ const c = currentCab(); delete ui.calcDraft[c.id]; ui.calcDraft[c.id] = calcDefaults(c); refreshRight(); },
  delCall(el){
    const c = currentCab();
    state.calls = state.calls.filter(k => k.id !== el.dataset.id);
    const last = callsOf(c.id)[0]; c.lastCall = last ? last.date : null;
    save(); refreshRight();
  },
  quickNext(el){ $('#n_date').value = ymd(addDays(new Date(), +el.dataset.d)); $('#n_time').value = el.dataset.t; },
  clearNext(){ const c = currentCab(); c.next = null; save(); toast('Action marquée comme faite'); render(); },
  agendaDone(el){ const c = cab(el.dataset.id); c.next = null; save(); toast('Action marquée comme faite'); render(); },
  period(el){ ui.period = el.dataset.k; render(); },
  exportCsv(){ exportCSV(); },
  deleteSample(){
    confirmBox('Supprimer les données d’exemple ?', 'Les cabinets fictifs et leur historique seront supprimés. Vos propres cabinets sont conservés.', 'Supprimer', () => {
      const ids = new Set(state.cabinets.filter(c => c.sample).map(c => c.id));
      state.cabinets = state.cabinets.filter(c => !ids.has(c.id));
      state.calls = state.calls.filter(k => !ids.has(k.cabinetId));
      save(); toast('Données d’exemple supprimées'); render();
    });
  },
  resetAll(){
    confirmBox('Réinitialiser l’application ?', 'Toutes vos données seront effacées et remplacées par les données d’exemple.', 'Réinitialiser', () => {
      state = freshState(); persist(); toast('Application réinitialisée'); location.hash = '#/'; render();
    });
  },
};
function segOn(el){ $$('button', el.parentElement).forEach(b => b.classList.toggle('on', b === el)); }
function markChips(el){ const on = !el.classList.contains('on'); $$('.chip', el.parentElement).forEach(b => b.classList.remove('on')); if (on) el.classList.add('on'); }

document.addEventListener('click', e => {
  if (e.target.matches('[data-overlay]')){ closeModal(); return; }
  if (e.target.matches('[data-drawer]')){ $('#drawer').innerHTML = ''; return; }
  if (e.target.closest('#drawer a')){ $('#drawer').innerHTML = ''; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  const keepDefault = fn(el, e);
  if (!keepDefault && el.tagName !== 'A') e.preventDefault();
});

function onField(e){
  const el = e.target;
  const isInput = e.type === 'input';
  const val = el.value;
  // Filtres de la base cabinets
  if (el.dataset.filter){
    ui.filters[el.dataset.filter] = val;
    if (el.dataset.filter === 'q'){ if (isInput) $('#cabTable').innerHTML = cabTable(); }
    else if (!isInput) render();
    return;
  }
  // Champs du cabinet (mode appel)
  if (el.dataset.cf){
    const c = currentCab(); if (!c) return;
    const k = el.dataset.cf;
    if (el.tagName === 'SELECT' && isInput) return;
    c[k] = k === 'externalise' ? val === '1' : ['praticiens','secretaires','priorite'].includes(k) ? (+val || 0) : val;
    save();
    if (['decideur','ville','email','specialite'].includes(k)) refreshRight();
    if (!isInput && ['statut','priorite','specialite'].includes(k)){
      const h = $('.call-id h1'); if (h) h.innerHTML = `${esc(c.nom)} ${pill(c.statut)} ${prio(c.priorite)}`;
    }
    return;
  }
  // Qualification
  if (el.dataset.qf){
    const c = currentCab(); if (!c) return;
    const k = el.dataset.qf;
    c.qualif[k] = el.type === 'number' ? (val === '' ? '' : +val) : val;
    save();
    if (!c.calc && !ui.calcDraft[c.id] && (ui.tab === 'calc' || ui.tab === 'script') && el.type === 'number') refreshRight();
    return;
  }
  // Calculateur
  if (el.dataset.calc){
    const c = currentCab(); if (!c) return;
    ui.calcDraft[c.id] = {...calcInputs(c), [el.dataset.calc]: val === '' ? '' : +val};
    $('#calcOut').innerHTML = calcOutput(c);
    return;
  }
  if (el.dataset.hyp){
    state.settings.hyp[el.dataset.hyp] = Math.max(0, Math.min(100, +val || 0));
    save(); const c = currentCab(); if (c && $('#calcOut')) $('#calcOut').innerHTML = calcOutput(c);
    return;
  }
  // Paramètres
  if (el.dataset.set){
    const k = el.dataset.set;
    state.settings[k] = ['prix','objAppels','objDemos'].includes(k) ? Math.max(0, +val || 0) : val;
    save(); const c = currentCab(); if (c && $('#calcOut')) $('#calcOut').innerHTML = calcOutput(c);
    return;
  }
  // Édition du script et des objections
  if (el.dataset.sf){ state.script.steps[+el.dataset.step][el.dataset.sf] = val; save(); return; }
  if (el.dataset.vp != null){ state.script.valueProps[el.dataset.vp] = val; save(); return; }
  if (el.dataset.of){ state.objections[+el.dataset.obj][el.dataset.of] = val; save(); return; }
  if (el.id === 'objSearch'){ ui.objQ = val; $('#objList').innerHTML = objList(scriptVars(currentCab())); return; }
  // Pipeline sur mobile
  if (el.dataset.move && !isInput){ const c = cab(el.dataset.move); c.statut = val; save(); toast(`${c.nom} → ${statutLabel(val)}`); render(); return; }
  if (el.id === 'csvFile' && !isInput && el.files[0]){
    const reader = new FileReader();
    reader.onload = () => importCSV(String(reader.result));
    reader.readAsText(el.files[0], 'utf-8');
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

document.addEventListener('submit', e => {
  if (e.target.id === 'nextForm'){
    e.preventDefault();
    const c = currentCab();
    c.next = {type: $('#nextType .on').dataset.k, date: $('#n_date').value, time: $('#n_time').value, note: $('#n_note').value.trim()};
    save(); toast('Prochaine action enregistrée'); render();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (isModalOpen()) closeModal();
    else if ($('#drawer').innerHTML) $('#drawer').innerHTML = '';
    return;
  }
  if (isModalOpen()){
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && $('#resForm')){ e.preventDefault(); commitResult(true); }
    return;
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input','textarea','select'].includes(tag) || e.ctrlKey || e.metaKey || e.altKey) return;
  const c = currentCab(); if (!c) return;
  const r = RESULTATS.find(x => x.key === e.key);
  if (r){ e.preventDefault(); openResult(c, r.k); return; }
  if (e.key === 'd' || e.key === 'D'){ e.preventDefault(); actions.timer(); }
});

document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el, e); });
document.addEventListener('mousemove', e => { if (e.target.closest('[data-tip]')) moveTip(e); });
document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hideTip(); });

window.addEventListener('hashchange', () => { closeModal(); render(); });
window.addEventListener('storage', e => { if (e.key === STORE_KEY && e.newValue){ load(); render(); } });

/* ==========================================================================
   Démarrage
   ========================================================================== */
try { applyTheme(localStorage.getItem(THEME_KEY)); } catch (e) {}
load();
render();
</script>
</body>
</html>
