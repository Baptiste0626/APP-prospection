<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prospection cabinet</title>
<meta name="description" content="Outil interne du cabinet médical : agenda, patients, secrétariat IA, demandes, comptes rendus, documents et activité. L’IA prépare, l’humain valide.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a6fc9'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --bg:#f7f7f5; --surface:#ffffff; --surface-2:#f2f2ef; --surface-3:#e9e9e5;
  --border:#e4e3df; --border-strong:#d2d1cb;
  --text:#18181b; --text-2:#52514e; --text-3:#8a8984;
  --accent:#2a6fc9; --accent-hover:#225db0; --accent-soft:#e8f0fb; --accent-text:#1d5aa8;
  --series-1:#2a78d6; --series-2:#eb6834;
  --danger:#c2410c; --danger-soft:#fdf0e9; --ok:#15803d; --ok-soft:#eaf6ee; --warn:#a16207; --warn-soft:#fbf4e2;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 4px 16px rgba(20,20,20,.05);
  --shadow-lg:0 10px 40px rgba(20,20,20,.16);
  --radius:10px; --radius-sm:7px;
  /* couleurs de statut */
  --c-gray:#8a8984; --c-gray-bg:#f0f0ed;
  --c-amber:#b45309; --c-amber-bg:#fbf3e4;
  --c-blue:#2563b8; --c-blue-bg:#eaf1fb;
  --c-violet:#7c3aed; --c-violet-bg:#f3eefd;
  --c-teal:#0f7d76; --c-teal-bg:#e6f5f3;
  --c-indigo:#4338ca; --c-indigo-bg:#eeeefb;
  --c-green:#15803d; --c-green-bg:#e9f6ed;
  --c-red:#b4383f; --c-red-bg:#fbeced;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121212; --surface:#1a1a19; --surface-2:#222221; --surface-3:#2b2b29;
    --border:#2c2c2a; --border-strong:#3a3a37;
    --text:#f0efec; --text-2:#c3c2b7; --text-3:#8d8c85;
    --accent:#4a8fe6; --accent-hover:#6aa3ec; --accent-soft:#1c2a3d; --accent-text:#8bb8f2;
    --series-1:#3987e5; --series-2:#d95926;
    --danger:#f08a5d; --danger-soft:#33221a; --ok:#5fc27e; --ok-soft:#18291e; --warn:#e0b04a; --warn-soft:#2e2715;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --shadow-lg:0 10px 40px rgba(0,0,0,.5);
    --c-gray:#a3a29c; --c-gray-bg:#262624;
    --c-amber:#e5a54b; --c-amber-bg:#2f2617;
    --c-blue:#6ea4ec; --c-blue-bg:#1b2738;
    --c-violet:#ad8cf5; --c-violet-bg:#272038;
    --c-teal:#4cc0b4; --c-teal-bg:#152c2a;
    --c-indigo:#8f8cf0; --c-indigo-bg:#212038;
    --c-green:#5fc27e; --c-green-bg:#18291e;
    --c-red:#ec7d84; --c-red-bg:#331c1e;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121212; --surface:#1a1a19; --surface-2:#222221; --surface-3:#2b2b29;
  --border:#2c2c2a; --border-strong:#3a3a37;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8d8c85;
  --accent:#4a8fe6; --accent-hover:#6aa3ec; --accent-soft:#1c2a3d; --accent-text:#8bb8f2;
  --series-1:#3987e5; --series-2:#d95926;
  --danger:#f08a5d; --danger-soft:#33221a; --ok:#5fc27e; --ok-soft:#18291e; --warn:#e0b04a; --warn-soft:#2e2715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  --c-gray:#a3a29c; --c-gray-bg:#262624;
  --c-amber:#e5a54b; --c-amber-bg:#2f2617;
  --c-blue:#6ea4ec; --c-blue-bg:#1b2738;
  --c-violet:#ad8cf5; --c-violet-bg:#272038;
  --c-teal:#4cc0b4; --c-teal-bg:#152c2a;
  --c-indigo:#8f8cf0; --c-indigo-bg:#212038;
  --c-green:#5fc27e; --c-green-bg:#18291e;
  --c-red:#ec7d84; --c-red-bg:#331c1e;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv11","ss01","tnum" 0;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:16px} h3{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.small{font-size:12.5px}
.hidden{display:none!important}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{
  width:232px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-title{font-weight:600;font-size:13.5px;line-height:1.2}
.brand-sub{font-size:11.5px;color:var(--text-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{
  display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--radius-sm);
  color:var(--text-2);font-weight:500;text-decoration:none;
}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--accent-soft);color:var(--accent-text)}
.nav svg{width:17px;height:17px;flex:none}
.nav .count{margin-left:auto;font-size:11.5px;background:var(--danger-soft);color:var(--danger);padding:0 7px;border-radius:20px;font-weight:600}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.save-state{font-size:11.5px;color:var(--text-3);padding:0 6px;display:flex;align-items:center;gap:6px}
.save-state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.main{flex:1;min-width:0}
.page{max-width:1240px;margin:0 auto;padding:28px 32px 64px}
.page.wide{max-width:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--text-2)}
.mobile-top,.bottom-nav{display:none}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h2{font-size:14px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-dash{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.kpi-label{font-size:12px;color:var(--text-2);font-weight:500}
.kpi-value{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi-value small{font-size:14px;color:var(--text-3);font-weight:500;letter-spacing:0}
.kpi-sub{font-size:12px;color:var(--text-3);margin-top:4px}
.progress{height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden;margin-top:10px}
.progress > span{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:34px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .12s,border-color .12s;text-decoration:none!important;
}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.input:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--danger)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.lg{height:42px;padding:0 18px;font-size:15px}
.btn svg{width:15px;height:15px}
.btn.icon{width:34px;padding:0}
.btn.sm.icon{width:28px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Forms */
.input,select.input,textarea.input{
  width:100%;height:34px;padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);outline:none;transition:border-color .12s,box-shadow .12s;
}
textarea.input{height:auto;padding:8px 10px;resize:vertical;min-height:72px;line-height:1.5}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label,.label{font-size:12px;color:var(--text-2);font-weight:500}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.inline-input{
  width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 7px;margin:0 -7px;
  height:30px;outline:none;
}
.inline-input:hover{border-color:var(--border)}
.inline-input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
select.inline-input{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--border-strong);background:var(--surface);border-radius:20px;padding:4px 11px;
  font-size:12.5px;cursor:pointer;color:var(--text-2);user-select:none;
}
.chip:hover{border-color:var(--text-3)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:500}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--surface-2);border-radius:var(--radius-sm);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:5px;cursor:pointer;color:var(--text-2);font-weight:500;font-size:13px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;
  background:var(--pbg,var(--surface-2));color:var(--pc,var(--text-2))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.prio{display:inline-flex;gap:2px;align-items:center}
.prio i{width:5px;height:12px;border-radius:2px;background:var(--surface-3)}
.prio.p1 i{background:var(--danger)} .prio.p2 i:nth-child(-n+2){background:var(--warn)} .prio.p3 i:first-child{background:var(--text-3)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--text-2);font-size:11.5px;font-weight:500}
.tag.late{background:var(--danger-soft);color:var(--danger)}
.tag.today{background:var(--accent-soft);color:var(--accent-text)}

/* Lists */
.list{display:flex;flex-direction:column}
.row-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
.row-item:first-child{border-top:0;padding-top:2px}
.row-main{flex:1;min-width:0}
.row-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-title a{color:var(--text)}
.row-sub{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--text-3);padding:18px 0;text-align:center;font-size:13px}

/* Table */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar .search{flex:1 1 240px;max-width:340px;position:relative}
.toolbar .search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--text-3)}
.toolbar .search input{padding-left:32px}
.toolbar select.input{width:auto;min-width:130px}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:12px;font-weight:500;color:var(--text-2);background:var(--surface);position:sticky;top:0;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
th .arrow{opacity:.6;margin-left:3px;font-size:10px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td .cab-name{font-weight:500}
td .cab-sub{font-size:12px;color:var(--text-3)}

/* Call mode */
.call-head{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;
  display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;
}
.call-id{flex:1 1 280px;min-width:0}
.call-id h1{font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.call-meta{color:var(--text-2);margin-top:3px;font-size:13px}
.phone-big{font-size:22px;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--text)!important;display:inline-flex;align-items:center;gap:8px}
.phone-big svg{width:18px;height:18px;color:var(--accent)}
.timer{display:flex;align-items:center;gap:10px}
.timer-val{font-size:22px;font-variant-numeric:tabular-nums;font-weight:600;min-width:66px;color:var(--text-3)}
.timer.running .timer-val{color:var(--accent-text)}
.rec-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);display:none;animation:pulse 1.2s infinite}
.timer.running .rec-dot{display:block}
@keyframes pulse{50%{opacity:.25}}
.results{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:16px}
.res-btn{
  border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);padding:10px 8px;cursor:pointer;
  text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .12s,background .12s;min-height:58px;
}
.res-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.res-btn b{font-weight:500;font-size:13px;line-height:1.25}
.res-btn kbd{font-family:inherit;font-size:11px;color:var(--text-3)}
.res-btn.pos b{color:var(--ok)} .res-btn.neg b{color:var(--c-red)}
.call-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:600;margin:0 0 10px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:2px 10px;align-items:center}
.kv > label{font-size:12.5px;color:var(--text-2)}
.divider{height:1px;background:var(--border);margin:18px 0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:-4px -18px 18px;padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--text-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.sticky-col{position:sticky;top:16px}

/* Script */
.step{border-left:2px solid var(--border);padding:2px 0 18px 18px;position:relative}
.step:last-child{padding-bottom:4px}
.step::before{content:attr(data-n);position:absolute;left:-12px;top:0;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--border-strong);font-size:11.5px;font-weight:600;display:grid;place-items:center;color:var(--text-2)}
.step.on{border-left-color:var(--accent)}
.step.on::before{background:var(--accent);border-color:var(--accent);color:#fff}
.step h3{margin-bottom:6px;cursor:pointer}
.step-text{white-space:pre-wrap;color:var(--text);font-size:14.5px;line-height:1.65}
.step-text .v{background:var(--accent-soft);color:var(--accent-text);border-radius:4px;padding:0 3px;font-weight:500}
.step-text .ph{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px}
.step-hint{font-size:12.5px;color:var(--text-3);margin-top:6px;white-space:pre-wrap}

/* Objections */
.obj{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface)}
.obj summary{list-style:none;padding:11px 14px;cursor:pointer;font-weight:500;display:flex;gap:10px;align-items:center}
.obj summary::-webkit-details-marker{display:none}
.obj summary::after{content:"+";margin-left:auto;color:var(--text-3);font-weight:400;font-size:16px}
.obj[open] summary::after{content:"–"}
.obj .obj-body{padding:0 14px 14px;white-space:pre-wrap;line-height:1.65;font-size:14px}

/* Calculator */
.calc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px}
.hero{background:var(--accent-soft);border-radius:var(--radius);padding:22px;text-align:left}
.hero-label{font-size:12.5px;color:var(--accent-text);font-weight:500}
.hero-value{font-size:44px;font-weight:650;letter-spacing:-.03em;line-height:1.05;margin:4px 0 2px;color:var(--text);font-variant-numeric:tabular-nums}
.hero-sub{color:var(--text-2);font-size:13.5px}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px}
.stat .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .l{font-size:12px;color:var(--text-2)}
details.hyp summary{cursor:pointer;color:var(--text-2);font-size:12.5px;margin-top:12px}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.kcol{background:var(--surface-2);border-radius:var(--radius);padding:10px;min-height:200px;transition:background .12s}
.kcol.over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}
.kcol-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px;font-weight:600;font-size:13px}
.kcol-head .n{color:var(--text-3);font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.kcard:hover{border-color:var(--border-strong)}
.kcard.dragging{opacity:.4}
.kcard .t{font-weight:500;font-size:13px;line-height:1.3}
.kcard .s{font-size:12px;color:var(--text-3);margin-top:2px}
.kcard .f{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px}
.kcard select{display:none}

/* Agenda */
.agenda-group{margin-bottom:22px}
.agenda-group h2{font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.agenda-group h2 .n{color:var(--text-3);font-weight:500}
.ag-item{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px}
.ag-when{width:92px;flex:none;font-variant-numeric:tabular-nums}
.ag-when b{display:block;font-weight:600}
.ag-when span{font-size:12px;color:var(--text-3)}
.type-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--text-2)}
.type-ic svg{width:15px;height:15px}
.type-ic.demo{background:var(--c-teal-bg);color:var(--c-teal)}
.type-ic.email{background:var(--c-violet-bg);color:var(--c-violet)}

/* Charts */
.chart{width:100%;display:block}
.chart text{fill:var(--text-3);font-size:11px;font-family:inherit}
.chart .grid-l{stroke:var(--border);stroke-width:1}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hbar{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 64px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.hbar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.hbar .track{display:block;height:18px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .fill{display:block;height:100%;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--text);font-weight:500}
.hbar .val small{color:var(--text-3);font-weight:400}
.funnel .hbar .fill{background:var(--accent)}
.tooltip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;z-index:100;box-shadow:var(--shadow);white-space:nowrap;opacity:0;transition:opacity .1s}
.tooltip.show{opacity:1}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.38);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:8vh 16px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);width:100%;max-width:540px;border:1px solid var(--border)}
.modal.lg{max-width:760px}
.modal-head{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-head p{margin:3px 0 0;color:var(--text-2);font-size:13px}
.modal-body{padding:16px 20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.modal-foot .hint{margin-right:auto;font-size:12px;color:var(--text-3)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


/* Rôle */
.role-box{padding:0 6px 16px;display:flex;flex-direction:column;gap:6px}
.role-box .seg{width:100%;display:flex}
.role-box .seg button{flex:1;padding:5px 4px;font-size:12px}
.role-box select.input{height:30px;font-size:12.5px}
.mobile-role{display:none}
/* Interrupteur */
.switch{position:relative;width:36px;height:20px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--surface-3);border-radius:20px;cursor:pointer;transition:background .15s}
.switch span::before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::before{transform:translateX(16px)}
.switch input:disabled + span{opacity:.6;cursor:not-allowed}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
/* Journal */
.log-item{display:flex;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;align-items:flex-start}
.log-item:hover{background:var(--surface-2)}
.log-item.sel{background:var(--accent-soft);border-color:var(--accent)}
.log-item.urgent{box-shadow:inset 3px 0 0 var(--c-red)}
.log-time{width:44px;flex:none;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;padding-top:1px}
.log-list{max-height:calc(100vh - 290px);overflow:auto;margin:0 -8px;padding:0 8px}
.urgent-banner{display:flex;gap:10px;align-items:flex-start;background:var(--c-red-bg);color:var(--c-red);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;font-weight:500;margin-bottom:14px}
.urgent-banner svg{width:16px;height:16px;flex:none;margin-top:2px}
.note-ia{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-3);margin-top:10px}
.note-ia svg{width:14px;height:14px}
.alert-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}
.alert-item:first-child{border-top:0;padding-top:2px}
.alert-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.auto-card{display:flex;gap:16px;align-items:flex-start}
.auto-ic{width:36px;height:36px;border-radius:9px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.auto-ic svg{width:18px;height:18px}
.tpl-text{white-space:pre-wrap;line-height:1.65;font-size:14px}
.tpl-text .v{background:var(--accent-soft);color:var(--accent-text);border-radius:4px;padding:0 3px;font-weight:500}
.tpl-text .ph{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px}
.slot-row{display:flex;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.slot-row:first-child{border-top:0}
.slot-row .t{width:48px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.slot-row.past{opacity:.6}
.slot-row.now{background:var(--accent-soft);margin:0 -10px;padding:10px;border-radius:var(--radius-sm);border-top-color:transparent}
.call-grid.sec{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.cr-text{white-space:pre-wrap;font-size:14px;line-height:1.65}

/* Responsive */
@media (max-width:1100px){
  .g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}
  .call-grid,.call-grid.sec{grid-template-columns:minmax(0,1fr)}
  .sticky-col{position:static}
  .results{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:860px){
  .sidebar{display:none}
  .mobile-role{display:block;width:auto;height:30px;font-size:12.5px;max-width:150px}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
  .bottom-nav a,.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;color:var(--text-3);text-decoration:none!important;border:0;background:none;cursor:pointer}
  .bottom-nav a.active{color:var(--accent-text)}
  .bottom-nav svg{width:20px;height:20px}
  .page{padding:18px 16px 96px}
  .g-dash,.g-2,.calc-grid{grid-template-columns:minmax(0,1fr)}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .results{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .hero-value{font-size:36px}
  .kanban{grid-auto-columns:minmax(220px,82vw)}
  .kcard select{display:block;width:100%;margin-top:8px;height:30px;font-size:12.5px}
  .toolbar select.input{flex:1 1 40%}
  .toolbar .search{max-width:none}
  .ag-when{width:70px}
  .hbar{grid-template-columns:minmax(90px,120px) minmax(0,1fr) 56px}
  .hide-sm{display:none}
  .log-list{max-height:none}
  .row-item .lbl,.ag-item .lbl{display:none}
  .ag-item{gap:10px;padding:10px 12px}
  .row-item .btn.sm{width:32px;padding:0}
  .chart text{font-size:19px}
  .row-item{gap:9px}
  .drawer{position:fixed;inset:0;z-index:60;background:rgba(10,10,10,.38)}
  .drawer .sidebar{display:flex;position:absolute;left:0;top:0;bottom:0;height:auto;box-shadow:var(--shadow-lg)}
}
@media (max-width:420px){
  .kv{grid-template-columns:100px minmax(0,1fr)}
  .phone-big{font-size:19px}
}

<script>
/* ==========================================================================
   Données d’exemple (entièrement fictives)
   Téléphones fixes et mobiles dans les plages réservées à la fiction par l’ARCEP (02 61 91, 06 39 98).
   Aucune donnée médicale détaillée.
   ========================================================================== */
const SAMPLE_TEAM = [
  {id:'m1', nom:'Dr Claire Besson', role:'medecin', specialite:'Médecine générale', actif:true},
  {id:'m2', nom:'Dr Antoine Lefèvre', role:'medecin', specialite:'Médecine générale', actif:true},
  {id:'m3', nom:'Dr Hélène Garnier', role:'medecin', specialite:'Pédiatrie', actif:true},
  {id:'s1', nom:'Sophie Martin', role:'secretaire', specialite:'', actif:true},

  {id:'a1', nom:'Karim Benali', role:'assistant', specialite:'Assistant médical', actif:true},
  {id:'g1', nom:'Nathalie Morel', role:'gerant', specialite:'Gérante', actif:true},
];
const PRENOMS = ['Marie','Jean','Lucie','Pierre','Camille','Thomas','Chloé','Nicolas','Emma','Julien','Léa','Antoine','Manon','Hugo','Sarah','Louis','Inès','Paul','Alice','Mathis','Jeanne','Gabriel','Claire','Arthur','Zoé','Bernard','Monique','Gérard','Françoise','Michel','Yasmine','Karim','Nadia','Rémi','Élise','Victor','Anaïs','Bruno','Sylvie','Noah'];
const NOMS = ['Durand','Lefebvre','Moreau','Girard','Roux','Fournier','Bonnet','Dupont','Lambert','Fontaine','Rousseau','Vincent','Muller','Faure','André','Mercier','Blanc','Guérin','Boyer','Garnier','Chevalier','François','Legrand','Gauthier','Perrin','Robin','Clément','Morin','Nicolas','Henry','Roussel','Mathieu','Gautier','Masson','Marchand','Duval','Denis','Dumont','Marie','Lemaire'];
const VILLES = ['Tours','Tours','Tours','Joué-lès-Tours','Saint-Cyr-sur-Loire','Chambray-lès-Tours','La Riche','Saint-Avertin'];
const NOTES_ADMIN = ['','','','Préfère être appelé le matin.','Joignable uniquement par SMS.','Vient souvent accompagné de sa fille.','Mutuelle à mettre à jour.','Demande des créneaux après 17 h.','Patient malentendant : privilégier les SMS.',''];

function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* Créneaux de 20 minutes : 8 h 30 – 12 h 10 et 14 h 00 – 17 h 40 */
const SLOTS = (() => { const out = []; for (let m = 8*60+30; m <= 12*60+10; m += 20) out.push(m); for (let m = 14*60; m <= 17*60+40; m += 20) out.push(m); return out; })();
const hm = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const minutesOf = t => { const [h, m] = t.split(':').map(Number); return h*60 + m; };

function buildSample(){
  const R = rng(20261019);
  const pick = a => a[Math.floor(R()*a.length)];
  const wpick = (pairs) => { let x = R() * pairs.reduce((s, p) => s + p[1], 0); for (const [v, w] of pairs){ if ((x -= w) < 0) return v; } return pairs[0][0]; };
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const nowMin = now.getHours()*60 + now.getMinutes();
  const isWeekday = d => d.getDay() !== 0 && d.getDay() !== 6;
  const iso = (d, min) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(min/60), min%60, Math.floor(R()*60)).toISOString();

  /* Patients */
  const patients = [];
  const used = new Set();
  for (let i = 0; i < 84; i++){
    let prenom, nom;
    do { prenom = pick(PRENOMS); nom = pick(NOMS); } while (used.has(prenom + nom));
    used.add(prenom + nom);
    const medecinId = i % 7 === 0 || i % 7 === 3 ? 'm3' : i % 2 ? 'm1' : 'm2';
    const naissance = medecinId === 'm3' ? 2010 + Math.floor(R()*15) : 1938 + Math.floor(R()*68);
    patients.push({
      id:'p' + (i+1), sample:true, prenom, nom, naissance,
      tel:`06 39 98 ${pad(Math.floor(R()*100))} ${pad(Math.floor(R()*100))}`,
      email: R() < .8 ? `${norm(prenom)}.${norm(nom)}@patient.example`.replace(/[^a-z.@]/g,'') : '',
      ville: pick(VILLES), medecinId, notes: pick(NOTES_ADMIN), createdAt: addDays(today, -400).toISOString(),
    });
  }
  const patientsOf = m => patients.filter(p => p.medecinId === m);

  /* Rendez-vous : 30 jours passés, 14 jours à venir */
  const rdv = [];
  for (let d = -30; d <= 14; d++){
    const day = addDays(today, d);
    if (!isWeekday(day)) continue;
    const date = ymd(day);
    for (const m of ['m1','m2','m3']){
      const fill = d < 0 ? .82 + R()*.12 : d === 0 ? .92 : Math.max(.3, .9 - d*.045);
      for (const s of SLOTS){
        if (R() > fill) continue;
        const own = patientsOf(m);
        const p = R() < .85 ? pick(own) : pick(patients);
        let statut = 'prevu';
        const past = d < 0 || (d === 0 && s + 20 <= nowMin);
        if (past){
          const absRate = d < -15 ? .072 : .034;
          const x = R();
          statut = x < absRate ? 'absent' : x < absRate + .03 ? 'annule' : 'honore';
        } else if (R() < .02) statut = 'annule';
        const motif = m === 'm3' ? wpick([['Consultation',4],['Suivi',3],['Vaccination',2],['Certificat',1]]) : wpick([['Consultation',5],['Suivi',3],['Renouvellement',3],['Certificat',1],['Bilan',1],['Première consultation',1]]);
        rdv.push({id:'r' + rdv.length, patientId:p.id, medecinId:m, date, time:hm(s), motif, statut,
          source: wpick([['ia',35],['en_ligne',40],['secretariat',25]]), rappel: d >= -15 && d <= 1});
      }
    }
  }

  /* Journal du secrétariat IA : 10 jours ouvrés + aujourd’hui */
  const appels = [];
  const days = [];
  for (let k = 0; days.length < 11; k++){ const x = addDays(today, -k); if (isWeekday(x) || k === 0) days.push(x); }
  const callMinute = () => wpick([[[8*60, 8*60+30],3],[[8*60+30, 10*60],10],[[10*60, 12*60],7],[[12*60, 14*60],5],[[14*60, 17*60],7],[[17*60, 19*60],5],[[19*60, 20*60+30],2]]);
  const docName = m => SAMPLE_TEAM.find(t => t.id === m).nom;
  const resumeFor = (motif, action, p, m) => {
    const who = p ? `${p.prenom} ${p.nom}` : 'Un nouveau patient';
    const jour = pick(['lundi','mardi','mercredi','jeudi','vendredi']), h = pick(['9 h 10','10 h 30','11 h 50','14 h 20','16 h 40','17 h 20']);
    switch (motif){
      case 'rdv': return action === 'rdv_pris' ? `${who} souhaite un rendez-vous avec ${docName(m)}. Créneau proposé et accepté : ${jour} à ${h}. SMS de confirmation envoyé.` : `${who} souhaite un rendez-vous rapide avec ${docName(m)}. Aucun créneau adapté dans les 48 h : rappel demandé par le secrétariat.`;
      case 'deplacement': return `${who} ne peut pas venir à son rendez-vous. Rendez-vous déplacé à ${jour} ${h} avec ${docName(m)}. Ancien créneau libéré.`;
      case 'annulation': return `${who} annule son rendez-vous de demain. Créneau libéré et proposé à la liste d’attente.`;
      case 'info': return pick([`${who} demande les horaires d’ouverture du samedi. Information donnée.`, `${who} demande les documents à apporter pour une première consultation. Consignes données et envoyées par SMS.`, `${who} demande si le cabinet est accessible en fauteuil roulant. Information donnée.`]);
      case 'ordonnance': return action === 'info' ? `${who} demande un renouvellement d’ordonnance. Demande enregistrée et transmise à ${docName(m)} pour décision.` : `${who} demande un renouvellement d’ordonnance et souhaite parler au secrétariat. À rappeler.`;
      case 'resultats': return action === 'transfere' ? `${who} appelle au sujet d’un courrier reçu. Aucune information médicale donnée par l’IA. Appel transféré au secrétariat.` : `${who} demande si ses résultats sont arrivés. Aucune information donnée par téléphone : à rappeler par l’équipe.`;
      case 'urgence': return `L’appelant décrit une situation qui pourrait être urgente. Consigne donnée d’appeler le 15 en cas d’aggravation. Appel transféré immédiatement au cabinet et signalé à l’équipe.`;
      default: return `${who} souhaite parler à une personne du cabinet pour une question administrative (facturation, mutuelle). À rappeler.`;
    }
  };
  days.forEach((day, di) => {
    const n = di === 0 ? Math.round(46 * Math.min(1, Math.max(0, (nowMin - 8*60) / (11*60)))) : 36 + Math.floor(R()*16);
    for (let k = 0; k < n; k++){
      const [a, b] = callMinute();
      let t = a + Math.floor(R()*(b - a));
      if (di === 0 && t > nowMin - 2) t = Math.max(8*60, nowMin - 2 - Math.floor(R()*Math.max(1, nowMin - 8*60)));
      const motif = wpick([['rdv',38],['deplacement',12],['annulation',7],['info',18],['ordonnance',10],['resultats',7],['urgence',1.6],['autre',5]]);
      const p = R() < .88 ? pick(patients) : null;
      const m = p ? p.medecinId : pick(['m1','m2','m3']);
      let action;
      switch (motif){
        case 'rdv': action = R() < .86 ? 'rdv_pris' : 'a_rappeler'; break;
        case 'deplacement': action = 'deplace'; break;
        case 'annulation': action = 'annule'; break;
        case 'info': action = 'info'; break;
        case 'ordonnance': action = R() < .7 ? 'info' : 'a_rappeler'; break;
        case 'resultats': action = R() < .5 ? 'transfere' : 'a_rappeler'; break;
        case 'urgence': action = 'transfere'; break;
        default: action = 'a_rappeler';
      }
      const urgent = motif === 'urgence';
      const c = {id:'a' + appels.length, date: iso(day, t), patientId: p ? p.id : null,
        appelant: p ? '' : `${pick(PRENOMS)} ${pick(NOMS)}`, tel: p ? p.tel : `06 39 98 ${pad(Math.floor(R()*100))} ${pad(Math.floor(R()*100))}`,
        medecinId:m, motif, action, urgent, duree: 40 + Math.floor(R()*170), resume: resumeFor(motif, action, p, m), traitement:null};
      const needsHuman = action === 'a_rappeler' || urgent;
      if (needsHuman && (di > 0 || urgent || R() < .4)){
        const res = urgent ? 'transfere' : wpick([['rappele',5],['rdv_pris',3],['messagerie',1],['cloture',2]]);
        c.traitement = {resultat: res, par: pick(['s1','s2','a1']), date: iso(day, Math.min(19*60+30, t + 10 + Math.floor(R()*90))), note: res === 'messagerie' ? 'Message laissé.' : ''};
      }
      appels.push(c);
    }
  });
  // un appel urgent ce matin, non encore pris en charge
  const urgentToday = appels.find(a => ymd(new Date(a.date)) === ymd(today) && a.motif === 'rdv' && !a.traitement);
  if (urgentToday){ Object.assign(urgentToday, {motif:'urgence', action:'transfere', urgent:true}); urgentToday.resume = resumeFor('urgence'); }
  appels.sort((x, y) => x.date.localeCompare(y.date));

  /* Demandes patients triées par l’IA */
  const DEM_RESUMES = {
    ordonnance:['Demande le renouvellement de son traitement habituel. Dernière consultation il y a 3 mois.','Demande le renouvellement d’une ordonnance arrivée à échéance.'],
    rdv:['Souhaite un rendez-vous rapide pour son enfant, de préférence en fin de journée.','Souhaite un rendez-vous de suivi le mois prochain.'],
    document:['Demande un certificat de sport pour la rentrée.','Demande une copie de son dernier courrier de spécialiste.'],
    resultats:['Signale avoir fait un examen la semaine dernière et demande si le cabinet a reçu les résultats.'],
    administratif:['Signale un changement de mutuelle et d’adresse.','Demande une facture pour sa mutuelle.'],
    question:['Question sur la préparation à un examen prévu la semaine prochaine.','Demande si un rendez-vous est nécessaire avant un voyage.'],
  };
  const demandes = [];
  for (let i = 0; i < 30; i++){
    const age = Math.floor(R()*10);
    const day = addDays(today, -age);
    const type = wpick([['ordonnance',8],['rdv',5],['document',5],['resultats',3],['administratif',4],['question',4]]);
    const p = pick(patients);
    const statut = age > 5 ? 'traitee' : age > 2 ? wpick([['traitee',4],['en_cours',2],['attente',1]]) : wpick([['nouvelle',4],['a_valider',3],['en_cours',2],['attente',1]]);
    const priorite = type === 'rdv' && R() < .5 ? 'urgent' : type === 'administratif' ? 'faible' : 'normal';
    let statutF = statut;
    if ((type === 'ordonnance' || type === 'question' || type === 'resultats') && statut === 'nouvelle') statutF = 'a_valider';
    demandes.push({id:'d' + i, date: iso(day, 7*60 + Math.floor(R()*12*60)), patientId:p.id, medecinId:p.medecinId,
      canal: wpick([['email',4],['formulaire',3],['telephone',3],['sms',1]]), type, priorite, statut: statutF,
      resume: pick(DEM_RESUMES[type]), note:''});
  }
  demandes.sort((x, y) => y.date.localeCompare(x.date));

  /* Documents reçus */
  const DOC_TITLES = {
    'Courrier de confrère':['Courrier du Dr Roux (cardiologie)','Courrier du Dr Vidal (dermatologie)','Courrier du service ORL du CHU'],
    'Résultats de laboratoire':['Résultats Biolab Tours Centre','Résultats laboratoire Loire Analyses'],
    'Compte rendu d’imagerie':['Compte rendu Imagerie des Halles','Compte rendu Centre d’imagerie Saint-Gatien'],
    'Compte rendu hospitalier':['Compte rendu de sortie, clinique de l’Alliance'],
    'Ordonnance externe':['Ordonnance de kinésithérapie (copie)'],
    'Administratif':['Attestation de mutuelle','Formulaire de déclaration de médecin traitant'],
  };
  const documents = [];
  for (let i = 0; i < 26; i++){
    const age = Math.floor(R()*9);
    const type = pick(DOC_TYPES);
    const p = pick(patients);
    const aClasser = age <= 1 ? R() < .8 : age <= 3 ? R() < .3 : false;
    documents.push({id:'f' + i, date: iso(addDays(today, -age), 7*60 + Math.floor(R()*11*60)), titre: pick(DOC_TITLES[type]),
      source: pick(DOC_SOURCES).k, patientId:p.id, type, medecinId:p.medecinId,
      statut: aClasser ? 'a_classer' : 'classe', confiance: 72 + Math.floor(R()*27)});
  }
  documents.sort((x, y) => y.date.localeCompare(x.date));

  /* Comptes rendus préparés à partir des transcriptions */
  const crs = [];
  for (const r of rdv){
    if (r.statut !== 'honore') continue;
    const age = dayDiff(ymd(today), r.date);
    if (age > 6 || R() > .45) continue;
    crs.push({id:'cr' + crs.length, rdvId:r.id, patientId:r.patientId, medecinId:r.medecinId, date:r.date, time:r.time, motif:r.motif,
      duree: 8 + Math.floor(R()*14), statut: age <= 1 && R() < .7 ? 'a_valider' : 'valide', texte: crTemplate(r.motif)});
  }
  return {team: structuredClone(SAMPLE_TEAM), patients, rdv, appels, demandes, documents, crs};
}
function crTemplate(motif){
  return `Projet de compte rendu préparé à partir de la transcription de la consultation.

Motif : ${motif.toLowerCase()}.
Éléments abordés : [à compléter ou corriger par le médecin]
Examen et conclusions : [à rédiger ou valider par le médecin]
Conduite à tenir : [à valider par le médecin]
Prochain rendez-vous : [à confirmer]`;
}

/* ==========================================================================
   État et persistance
   ========================================================================== */
let state;
function freshState(){
  return Object.assign({
    version:2, settings: structuredClone(DEFAULT_SETTINGS),
    templates: structuredClone(DEFAULT_TEMPLATES), automations: structuredClone(DEFAULT_AUTOMATIONS),
  }, buildSample());
}
function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      s.settings = Object.assign(structuredClone(DEFAULT_SETTINGS), s.settings || {});
      s.settings.minutes = Object.assign(structuredClone(DEFAULT_SETTINGS.minutes), s.settings.minutes || {});
      for (const k of ['team','patients','rdv','appels','demandes','documents','crs']) s[k] = s[k] || [];
      s.templates = s.templates || structuredClone(DEFAULT_TEMPLATES);
      s.automations = s.automations || structuredClone(DEFAULT_AUTOMATIONS);
      state = s; return;
    }
  } catch (e) { console.warn('Lecture impossible, données réinitialisées', e); }
  state = freshState(); persist();
}
let saveTimer = null;
function persist(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); setSaveState('Enregistré'); }
  catch (e) { setSaveState('Non enregistré'); console.warn(e); }
}
function save(){ clearTimeout(saveTimer); setSaveState('Enregistrement…'); saveTimer = setTimeout(persist, 300); }
function setSaveState(t){ const el = $('#saveState'); if (el) el.textContent = t; }

/* ==========================================================================
   Accès aux données
   ========================================================================== */
const member = id => state.team.find(t => t.id === id);
const memberName = id => (member(id) || {nom:'—'}).nom;
const medecins = () => state.team.filter(t => t.role === 'medecin' && t.actif !== false);
const patient = id => state.patients.find(p => p.id === id);
const pName = p => p ? `${p.prenom} ${p.nom}` : '—';
const callerName = a => a.patientId ? pName(patient(a.patientId)) : (a.appelant || 'Appelant inconnu');
const role = () => state.settings.role;
const myMedecin = () => role() === 'medecin' ? state.settings.medecinId : null;
const autoOn = id => (state.automations.find(a => a.id === id) || {}).actif;

const appelsATraiter = () => state.appels.filter(a => !a.traitement && (a.action === 'a_rappeler' || a.urgent)).sort((a, b) => (b.urgent - a.urgent) || a.date.localeCompare(b.date));
const demandesOuvertes = (m) => state.demandes.filter(d => d.statut !== 'traitee' && (!m || d.medecinId === m));
const docsAClasser = () => state.documents.filter(d => d.statut === 'a_classer');
const crAValider = (m) => state.crs.filter(c => c.statut === 'a_valider' && (!m || c.medecinId === m));
const rdvDay = (date, m) => state.rdv.filter(r => r.date === date && (!m || r.medecinId === m)).sort((a, b) => a.time.localeCompare(b.time) || a.medecinId.localeCompare(b.medecinId));
const rdvOfPatient = id => state.rdv.filter(r => r.patientId === id).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
function nextRdv(id){ const t = todayStr(), n = new Date(); const hmNow = `${pad(n.getHours())}:${pad(n.getMinutes())}`; return rdvOfPatient(id).find(r => r.statut === 'prevu' && (r.date > t || (r.date === t && r.time >= hmNow))); }
function lastRdv(id){ return rdvOfPatient(id).filter(r => r.statut === 'honore').pop(); }
const callDay = a => ymd(new Date(a.date));

function workdaysBetween(from, to){ let n = 0; for (let d = parseYmd(from); ymd(d) <= to; d = addDays(d, 1)) if (d.getDay() !== 0 && d.getDay() !== 6) n++; return n; }
function remplissage(from, to, m){
  const booked = state.rdv.filter(r => r.date >= from && r.date <= to && r.statut !== 'annule' && (!m || r.medecinId === m)).length;
  const cap = workdaysBetween(from, to) * (+state.settings.creneauxJour || 24) * (m ? 1 : medecins().length);
  return cap ? Math.round(booked / cap * 100) : 0;
}
function absenceRate(from, to){
  const past = state.rdv.filter(r => r.date >= from && r.date <= to && (r.statut === 'honore' || r.statut === 'absent'));
  return past.length ? past.filter(r => r.statut === 'absent').length / past.length * 100 : 0;
}

/* Temps et revenus gagnés grâce à l’IA, calculés sur les données réelles de la période */
function gainsIA(from, to){
  const s = state.settings, mn = s.minutes;
  const inP = d => d >= from && d <= to;
  const appels = state.appels.filter(a => inP(callDay(a)));
  const resolus = appels.filter(a => RESOLU_IA.has(a.action) && !a.urgent);
  const horsHoraires = appels.filter(a => a.action === 'rdv_pris' && (() => { const d = new Date(a.date), m = d.getHours()*60 + d.getMinutes(); return m < 8*60+30 || (m >= 12*60+30 && m < 14*60) || m >= 19*60; })());
  const rappels = state.rdv.filter(r => inP(r.date) && r.rappel).length;
  const demandes = state.demandes.filter(d => inP(ymd(new Date(d.date)))).length;
  const crs = state.crs.filter(c => inP(c.date)).length;
  const docs = state.documents.filter(d => inP(ymd(new Date(d.date)))).length;
  const parts = [
    {l:'Appels résolus par le secrétariat IA', n: resolus.length, min: resolus.length * mn.appel},
    {l:'Rappels de rendez-vous envoyés', n: rappels, min: rappels * mn.rappel},
    {l:'Demandes triées et résumées', n: demandes, min: demandes * mn.demande},
    {l:'Comptes rendus préparés', n: crs, min: crs * mn.cr},
    {l:'Documents classés', n: docs, min: docs * mn.document},
  ];
  const heures = parts.reduce((x, p) => x + p.min, 0) / 60;
  const passes = state.rdv.filter(r => inP(r.date) && (r.statut === 'honore' || r.statut === 'absent')).length;
  const tauxActuel = absenceRate(from, to);
  const absencesEvitees = Math.max(0, passes * (s.tauxAbsenceAvant - tauxActuel) / 100);
  const consultsRecup = absencesEvitees + horsHoraires.length;
  const valTemps = heures * s.coutHoraire;
  const valConsults = consultsRecup * s.valeurConsult;
  const jours = dayDiff(to, from) + 1;
  const prix = s.prixIA * jours / 30.4;
  const total = valTemps + valConsults;
  return {parts, heures, valTemps, absencesEvitees, horsHoraires: horsHoraires.length, consultsRecup, valConsults, total, tauxActuel, prix, multiple: prix ? total / prix : 0, appels: appels.length, resolus: resolus.length};
}

/* Variables des modèles de réponses */
function tplVars(ctx={}){
  const s = state.settings;
  return {cabinet:s.cabinet, adresse:s.adresse, telephone:s.telephone, horaires:s.horaires, email:s.email,
    patient: ctx.patient || '[patient]', medecin: ctx.medecin || '[médecin]', date: ctx.date || '[date]', heure: ctx.heure || '[heure]'};
}
function fillVars(text, vars){
  let t = esc(text);
  t = t.replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? `<span class="v">${esc(vars[k])}</span>` : m);
  return t.replace(/\[([^\]]+)\]/g, '<span class="ph">[$1]</span>');
}

/* Alertes pour le gérant */
function alertes(){
  const out = [], t = todayStr();
  const urg = appelsATraiter().filter(a => a.urgent);
  if (urg.length) out.push({c:'red', t:`${urg.length} appel${urg.length > 1 ? 's' : ''} urgent${urg.length > 1 ? 's' : ''} à prendre en charge`, href:'#/secretariat'});
  const old = appelsATraiter().filter(a => !a.urgent && (Date.now() - new Date(a.date)) > 3*3600e3);
  if (old.length) out.push({c:'amber', t:`${old.length} rappel${old.length > 1 ? 's' : ''} patient en attente depuis plus de 3 h`, href:'#/secretariat'});
  const demUrg = state.demandes.filter(d => d.priorite === 'urgent' && d.statut !== 'traitee');
  if (demUrg.length) out.push({c:'red', t:`${demUrg.length} demande${demUrg.length > 1 ? 's' : ''} urgente${demUrg.length > 1 ? 's' : ''} non traitée${demUrg.length > 1 ? 's' : ''}`, href:'#/demandes'});
  const crOld = state.crs.filter(c => c.statut === 'a_valider' && dayDiff(t, c.date) >= 1);
  if (crOld.length) out.push({c:'amber', t:`${crOld.length} compte${crOld.length > 1 ? 's' : ''} rendu${crOld.length > 1 ? 's' : ''} en attente de validation depuis la veille`, href:'#/equipe'});
  const docs = docsAClasser();
  if (docs.length >= 5) out.push({c:'amber', t:`${docs.length} documents reçus à classer`, href:'#/documents'});
  const ms = ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
  const abs = absenceRate(ms, t);
  if (abs > 5) out.push({c:'amber', t:`Taux de rendez-vous non honorés à ${fmtNum(abs, 1)} % ce mois`, href:'#/activite'});
  state.automations.filter(a => !a.actif).forEach(a => out.push({c:'gray', t:`Automatisation désactivée : ${a.nom}`, href:'#/automatisations'}));
  return out;
}

/* Composants */
const pill = (label, c) => `<span class="pill" style="--pc:var(--c-${c});--pbg:var(--c-${c}-bg)">${esc(label)}</span>`;
const tagc = (label, c) => `<span class="tag" style="background:var(--c-${c}-bg);color:var(--c-${c})">${esc(label)}</span>`;
const opts = (list, val, ph) => (ph != null ? `<option value="">${esc(ph)}</option>` : '') + list.map(o => {
  const k = typeof o === 'object' ? o.k : o, l = typeof o === 'object' ? o.l : o;
  return `<option value="${esc(k)}" ${String(k) === String(val) ? 'selected' : ''}>${esc(l)}</option>`;
}).join('');
const medOpts = (val, ph) => opts(medecins().map(m => ({k:m.id, l:m.nom})), val, ph);
const rdvPill = r => pill(lab(RDV_STATUTS, r.statut), col(RDV_STATUTS, r.statut));
const hFmt = t => (t || '').replace(':', 'h');
const kpi = (label, value, sub, progress) => `<div class="card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div>${progress != null ? `<div class="progress"><span style="width:${Math.min(100, progress)}%"></span></div>` : ''}<div class="kpi-sub">${sub}</div></div>`;
const plural = (n, w, ws) => `${n} ${n > 1 ? (ws || w + 's') : w}`;
const nowHM = () => { const n = new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; };
const shortDoc = id => memberName(id).replace(/^Dr\s+\S+\s+/, 'Dr ');

  const head = `<div class="page-head">
      <div><h1>${h < 18 ? 'Bonjour' : 'Bonsoir'}${who ? ' ' + esc(who) : ''}</h1><p>${fmtDate(t).replace(/^\w/, c => c.toUpperCase())} · ${esc(s.cabinet)} · profil ${esc(roleLabel(role()).toLowerCase())}</p></div>
      <div class="btn-row">${role() !== 'medecin' ? `<button class="btn" data-act="newPatient">${icon('plus')} Nouveau patient</button>` : ''}<button class="btn primary" data-act="newRdv">${icon('cal')} Nouveau rendez-vous</button></div>
    </div>`;
  if (role() === 'medecin') return `<div class="page">${head}${dashMedecin()}</div>`;
  if (role() === 'gerant') return `<div class="page">${head}${dashGerant()}</div>`;
  return `<div class="page">${head}${dashSecretaire()}</div>`;
}

function todoItems(m){

  for (const a of appelsATraiter()) items.push({ic:'phone', c: a.urgent ? 'red' : 'amber', title: callerName(a), sub: (a.urgent ? 'Urgent · ' : 'À rappeler · ') + lab(MOTIFS_APPEL, a.motif), when: fmtTimeAgo(a.date), href:`#/secretariat/${a.id}`, btn:'Traiter'});
  for (const d of demandesOuvertes(m).filter(d => d.statut === 'nouvelle' || d.priorite === 'urgent' || (m && d.statut === 'a_valider')))

}
function todoList(items, limit=9){
  return `<div class="list">${items.slice(0, limit).map(x => `<div class="row-item">
      <span class="type-ic" style="background:var(--c-${x.c}-bg);color:var(--c-${x.c})">${icon(x.ic)}</span>

      <a class="btn sm" href="${x.href}">${esc(x.btn)}</a></div>`).join('') || '<div class="empty">Rien à traiter pour le moment.</div>'}</div>
    ${items.length > limit ? `<div class="small faint" style="margin-top:10px">+ ${items.length - limit} autres éléments</div>` : ''}`;
}
function fmtTimeAgo(isoDate){
  const d = new Date(isoDate), t = todayStr();
  if (ymd(d) === t) return `${pad(d.getHours())}h${pad(d.getMinutes())}`;
  return relDay(ymd(d));
}
function upcomingList(m, limit=8){
  const t = todayStr(), n = nowHM();
  const list = state.rdv.filter(r => r.statut === 'prevu' && (r.date > t || (r.date === t && r.time >= n)) && (!m || r.medecinId === m))

      <div class="row-main"><div class="row-title"><a href="#/patient/${r.patientId}">${esc(pName(patient(r.patientId)))}</a></div><div class="row-sub">${esc(r.motif)} · ${esc(shortDoc(r.medecinId))}</div></div>
      ${r.source === 'ia' ? tagc('Pris par l’IA', 'teal') : ''}</div>`).join('') || '<div class="empty">Aucun rendez-vous à venir.</div>'}</div>`;
}

function dashSecretaire(){
  const t = todayStr();
  const today = state.appels.filter(a => callDay(a) === t);
  const resolus = today.filter(a => RESOLU_IA.has(a.action) && !a.urgent).length;
  const todo = appelsATraiter();
  const urg = todo.filter(a => a.urgent).length;
  const dem = demandesOuvertes();
  const docs = docsAClasser();
  const rdvT = rdvDay(t).filter(r => r.statut !== 'annule');
  const next = rdvT.find(r => r.statut === 'prevu' && r.time >= nowHM());
  return `<div class="grid g-kpi" style="margin-bottom:16px">
      ${kpi('Appels traités par l’IA', today.length, `${resolus} résolus sans intervention`)}

}

function dashMedecin(){
  const m = state.settings.medecinId, t = todayStr(), n = nowHM();
  const rdvT = rdvDay(t, m).filter(r => r.statut !== 'annule');
  const vus = rdvT.filter(r => r.statut === 'honore').length;
  const next = rdvT.find(r => r.statut === 'prevu' && r.time >= n);
  const crs = crAValider(m);
  const dem = demandesOuvertes(m);
  return `<div class="grid g-kpi" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px">
      ${kpi('Patients du jour', rdvT.length, `${vus} vus · ${rdvT.length - vus - rdvT.filter(r => r.statut === 'absent').length} restants`, pct(vus, rdvT.length))}

/* Graphique : consultations et appels sur 7 jours */
function chartCard(){
  return `<div class="card">
      <div class="card-head"><h2>Consultations et appels sur 7 jours</h2>
        <div class="legend"><span><i style="background:var(--series-1)"></i>Consultations</span><span><i style="background:var(--series-2)"></i>Appels traités par l’IA</span></div></div>
      ${chart7days()}
    </div>`;
}
function chart7days(){
  const days = [];
  for (let i = 6; i >= 0; i--) days.push(ymd(addDays(new Date(), -i)));
  const data = days.map(d => ({d,
    a: state.rdv.filter(r => r.date === d && (r.statut === 'honore' || r.statut === 'prevu')).length,
    b: state.appels.filter(k => callDay(k) === d).length}));
  const max = Math.max(4, ...data.map(x => Math.max(x.a, x.b)));
  const step = max <= 10 ? 2 : max <= 25 ? 5 : max <= 60 ? 10 : 20;
  const top = Math.ceil(max / step) * step;
  const W = 720, H = 220, L = 30, B = 26, T = 10;
  const cw = (W - L) / 7, bw = Math.min(26, cw * .28);
  const y = v => T + (H - T - B) * (1 - v / top);
  let svg = '';
  for (let v = 0; v <= top; v += step) svg += `<line class="grid-l" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const bar = (x, v, color) => {
    if (!v) return '';
    const y0 = y(0), y1 = y(v), r = Math.min(4, (y0 - y1) / 2, bw / 2);
    return `<path d="M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 + r} V${y0} Z" fill="${color}"/>`;
  };
  data.forEach((p, i) => {
    const cx = L + cw * i + cw / 2;
    const dd = parseYmd(p.d);
    svg += `<g data-tip="${esc(`${fmtDate(p.d)} · ${plural(p.a, 'consultation')} · ${plural(p.b, 'appel')} traités par l’IA`)}">
      <rect x="${L + cw * i}" y="${T}" width="${cw}" height="${H - T - B}" fill="transparent"/>
      ${bar(cx - bw - 1, p.a, 'var(--series-1)')}${bar(cx + 1, p.b, 'var(--series-2)')}
      <text x="${cx}" y="${H - 8}" text-anchor="middle" style="${i === 6 ? 'fill:var(--text);font-weight:600' : ''}">${JOURS[dd.getDay()]} ${dd.getDate()}</text></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Consultations et appels sur 7 jours">${svg}</svg>`;
}

/* Barres horizontales (statistiques, remplissage) */
function hbars(rows, opt={}){
  const max = Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `<div class="hbar" data-tip="${esc(r.tip || `${r.l} : ${r.v}`)}"><span class="lbl" title="${esc(r.l)}">${esc(r.l)}</span>
    <span class="track"><span class="fill" style="width:${Math.min(100, opt.scale100 ? r.v : r.v / max * 100)}%;${r.hi ? 'background:var(--series-2)' : ''}"></span></span>
    <span class="val">${r.display ?? r.v}</span></div>`).join('') || '<div class="empty">Pas encore de données.</div>';
}

function patientIndex(){
  const t = todayStr(), n = nowHM();
  const idx = {};
  for (const p of state.patients) idx[p.id] = {last:null, next:null, ech:0};
  for (const r of state.rdv){
    const x = idx[r.patientId]; if (!x) continue;
    if (r.statut === 'honore' && (!x.last || r.date + r.time > x.last.date + x.last.time)) x.last = r;
    if (r.statut === 'prevu' && (r.date > t || (r.date === t && r.time >= n)) && (!x.next || r.date + r.time < x.next.date + x.next.time)) x.next = r;
  }
  for (const a of state.appels) if (idx[a.patientId]) idx[a.patientId].ech++;
  for (const d of state.demandes) if (idx[d.patientId]) idx[d.patientId].ech++;
  for (const d of state.documents) if (idx[d.patientId]) idx[d.patientId].ech++;
  return idx;
}
function filteredPatients(idx){
  const f = ui.pf, q = norm(f.q);
  const sixMonths = ymd(addDays(new Date(), -182));
  let list = state.patients.filter(p =>
    (!q || norm([p.prenom, p.nom, p.tel, p.email, p.ville].join(' ')).includes(q)) &&
    (!f.medecin || p.medecinId === f.medecin) && (!f.ville || p.ville === f.ville) &&
    (!f.rdv || (f.rdv === 'avec' ? idx[p.id].next : !idx[p.id].next && (!idx[p.id].last || idx[p.id].last.date < sixMonths))));
  const {key, dir} = ui.sort;
  const val = p => key === 'medecin' ? memberName(p.medecinId) : key === 'last' ? (idx[p.id].last ? idx[p.id].last.date : '') :
    key === 'next' ? (idx[p.id].next ? idx[p.id].next.date + idx[p.id].next.time : '9999') : key === 'ech' ? idx[p.id].ech :
    key === 'naissance' ? +p.naissance : norm(p.nom + ' ' + p.prenom);
  list.sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
  return list;
}

      <div class="field"><label for="rf_d">Date</label><input class="input" type="date" id="rf_d" value="${date}" min="${todayStr()}"></div>
      <div class="field"><label for="rf_t">Créneau libre</label><select class="input" id="rf_t"></select></div>
    </div></div>
    <div class="modal-foot"><button type="button" class="btn" data-act="closeModal">Annuler</button><button type="submit" class="btn primary">Enregistrer le rendez-vous</button></div></form>`);
  const fill = () => {
    const sl = freeSlots($('#rf_d').value, $('#rf_m').value);
    $('#rf_t').innerHTML = sl.length ? sl.map(s => `<option value="${s}" ${s === pre.time ? 'selected' : ''}>${hFmt(s)}</option>`).join('') : '<option value="">Aucun créneau libre</option>';
  };
  $('#rf_d').onchange = fill; $('#rf_m').onchange = fill; fill();
  (pre.patientId ? $('#rf_m') : $('#rf_p')).focus();
  $('#rdvForm').onsubmit = e => {
    e.preventDefault();
    if (!$('#rf_p').value || !$('#rf_t').value){ toast('Choisissez un patient et un créneau'); return; }
    const r = {id:uid(), patientId:$('#rf_p').value, medecinId:$('#rf_m').value, date:$('#rf_d').value, time:$('#rf_t').value, motif:$('#rf_motif').value, statut:'prevu', source:'secretariat', rappel:false};
    state.rdv.push(r);
    if (pre.onSave) pre.onSave(r);
    save(); closeModal(); toast(`Rendez-vous enregistré : ${fmtDate(r.date)} à ${hFmt(r.time)}`); if (!pre.onSave) render();
  };
}
function demandeForm(pre={}){
  const pats = [...state.patients].sort((a, b) => norm(a.nom).localeCompare(norm(b.nom)));
  openModal(`<form id="demForm">
    <div class="modal-head"><div><h2>Nouvelle demande</h2><p>Saisie manuelle d’une demande reçue au comptoir ou par téléphone.</p></div>
      <button type="button" class="btn ghost icon" data-act="closeModal" aria-label="Fermer">${icon('x')}</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="field full"><label for="df_p">Patient *</label><select class="input" id="df_p" required>${opts(pats.map(p => ({k:p.id, l:`${p.nom.toUpperCase()} ${p.prenom} · ${p.naissance}`})), pre.patientId, 'Choisir un patient')}</select></div>
      <div class="field"><label>Type</label><select class="input" id="df_type">${opts(DEM_TYPES, 'ordonnance')}</select></div>
      <div class="field"><label>Canal</label><select class="input" id="df_canal">${opts(CANAUX, 'telephone')}</select></div>
      <div class="field"><label>Priorité</label><select class="input" id="df_prio">${opts(PRIORITES, 'normal')}</select></div>
      <div class="field"><label>Médecin concerné</label><select class="input" id="df_m">${medOpts(pre.patientId && patient(pre.patientId) ? patient(pre.patientId).medecinId : '')}</select></div>
      <div class="field full"><label for="df_r">Demande</label><textarea class="input" id="df_r" rows="3" placeholder="Résumé de la demande, sans détail médical"></textarea></div>
    </div></div>
    <div class="modal-foot"><button type="button" class="btn" data-act="closeModal">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form>`);
  $('#demForm').onsubmit = e => {
    e.preventDefault();
    if (!$('#df_p').value) return;
    const type = $('#df_type').value;
    state.demandes.unshift({id:uid(), date:new Date().toISOString(), patientId:$('#df_p').value, medecinId:$('#df_m').value, canal:$('#df_canal').value, type,
      priorite:$('#df_prio').value, statut: ['ordonnance','question','resultats'].includes(type) ? 'a_valider' : 'nouvelle', resume:$('#df_r').value.trim() || lab(DEM_TYPES, type), note:''});
    save(); closeModal(); toast('Demande enregistrée'); render();
  };
}
