<script>
/* ==========================================================================
   Agenda
   ========================================================================== */
function viewAgenda(){
  const date = ui.agendaDate || todayStr();
  const t = todayStr(), n = nowHM();
  if (ui.agendaMed == null) ui.agendaMed = role() === 'medecin' ? state.settings.medecinId : '';
  const shown = medecins().filter(m => !ui.agendaMed || m.id === ui.agendaMed);
  const all = rdvDay(date).filter(r => shown.some(m => m.id === r.medecinId));
  const booked = all.filter(r => r.statut !== 'annule').length;
  const isWE = [0, 6].includes(parseYmd(date).getDay());
  const col = m => {
    const list = rdvDay(date, m.id);
    const byTime = {};
    list.forEach(r => { if (r.statut !== 'annule' || !byTime[r.time]) byTime[r.time] = r; });
    return `<div class="card"><div class="card-head"><h2>${esc(m.nom)}</h2><span class="small faint">${list.filter(r => r.statut !== 'annule').length} / ${state.settings.creneauxJour}</span></div>
      ${isWE ? '<div class="empty">Cabinet fermé.</div>' : SLOTS.map(hm).map(s => {
        const r = byTime[s];
        const pastSlot = date < t || (date === t && s < n);
        if (!r || r.statut === 'annule') return `<div class="slot-row ${pastSlot ? 'past' : ''}"><span class="t">${hFmt(s)}</span><div class="row-main faint">${r ? 'Libéré (annulation)' : 'Libre'}</div>
          ${pastSlot ? '' : `<button class="btn sm ghost" data-act="bookSlot" data-m="${m.id}" data-t="${s}">${icon('plus')} Réserver</button>`}</div>`;
        const p = patient(r.patientId);
        return `<div class="slot-row"><span class="t">${hFmt(s)}</span>
          <div class="row-main"><div class="row-title"><a href="#/patient/${r.patientId}">${esc(pName(p))}</a></div>
            <div class="row-sub">${esc(r.motif)}${r.source === 'ia' ? ' · pris par l’IA' : r.source === 'en_ligne' ? ' · en ligne' : ''}${r.rappel ? ' · rappel envoyé' : ''}</div></div>
          ${r.statut === 'prevu' && pastSlot ? `<div class="btn-row" style="gap:4px"><button class="btn sm" data-act="rdvStatus" data-id="${r.id}" data-s="honore" title="Honoré">${icon('check')}</button><button class="btn sm" data-act="rdvStatus" data-id="${r.id}" data-s="absent" title="Non honoré">${icon('x')}</button></div>`
            : r.statut === 'prevu' ? `<button class="btn sm ghost" data-act="rdvStatus" data-id="${r.id}" data-s="annule" title="Annuler le rendez-vous">Annuler</button>` : rdvPill(r)}</div>`;
      }).join('')}</div>`;
  };
  return `<div class="page wide" style="max-width:1400px">
    <div class="page-head"><div><h1>Agenda</h1><p>${fmtDate(date).replace(/^\w/, c => c.toUpperCase())}${date === t ? ' · aujourd’hui' : ''} · ${plural(booked, 'rendez-vous', 'rendez-vous')}</p></div>
      <div class="btn-row">
        <div class="btn-row" style="gap:4px"><button class="btn icon" data-act="agendaDay" data-d="-1" aria-label="Jour précédent">${icon('arrowL')}</button>
          <button class="btn" data-act="agendaDay" data-d="0">Aujourd’hui</button>
          <button class="btn icon" data-act="agendaDay" data-d="1" aria-label="Jour suivant">${icon('arrowR')}</button></div>
        <input class="input" type="date" id="agendaPick" value="${date}" style="width:auto">
        <button class="btn primary" data-act="newRdv">${icon('plus')} Nouveau rendez-vous</button>
      </div></div>
    <div class="toolbar"><div class="seg">${[{id:'', nom:'Tous les médecins'}, ...medecins()].map(m => `<button class="${ui.agendaMed === m.id ? 'on' : ''}" data-act="agendaMed" data-k="${m.id}">${esc(m.id ? shortDoc(m.id) : m.nom)}</button>`).join('')}</div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${shown.map(col).join('')}</div>
  </div>`;
}

/* ==========================================================================
   Secrétariat IA : journal des appels et traitement humain des rappels
   ========================================================================== */
function secList(){
  const t = todayStr(), q = norm(ui.secQ);
  let list;
  if (ui.secFilter === 'todo') list = appelsATraiter();
  else {
    const from = ui.secFilter === 'today' ? t : ymd(addDays(new Date(), -6));
    list = state.appels.filter(a => callDay(a) >= from).sort((a, b) => b.date.localeCompare(a.date));
  }
  if (q) list = list.filter(a => norm([callerName(a), a.tel, a.resume, lab(MOTIFS_APPEL, a.motif)].join(' ')).includes(q));
  return list;
}
function viewSecretariat(){
  const {arg} = route();
  if (arg && state.appels.some(a => a.id === arg)) ui.selCall = arg;
  const t = todayStr();
  const today = state.appels.filter(a => callDay(a) === t);
  const todo = appelsATraiter();
  const list = secList();
  if (!ui.selCall || !state.appels.some(a => a.id === ui.selCall)) ui.selCall = (list[0] || {}).id || null;
  const on = autoOn('secretariat');
  return `<div class="page wide" style="max-width:1400px">
    <div class="call-head">
      <div class="call-id"><h1>Secrétariat IA ${on ? pill('Actif · décroche 24 h/24', 'green') : pill('Désactivé', 'gray')}</h1>
        <div class="call-meta">L’IA répond, prend les rendez-vous simples et prépare un résumé. Les rappels et les urgences sont traités par l’équipe.</div></div>
      <div class="btn-row" style="gap:22px">
        <div><div class="kpi-label">Appels aujourd’hui</div><div class="kpi-value" style="font-size:22px;margin:0">${today.length}</div></div>
        <div><div class="kpi-label">Résolus par l’IA</div><div class="kpi-value" style="font-size:22px;margin:0">${pct(today.filter(a => RESOLU_IA.has(a.action) && !a.urgent).length, today.length)}<small> %</small></div></div>
        <div><div class="kpi-label">À traiter</div><div class="kpi-value" style="font-size:22px;margin:0">${todo.length}</div></div>
        <div><div class="kpi-label">Urgents</div><div class="kpi-value" style="font-size:22px;margin:0;${todo.some(a => a.urgent) ? 'color:var(--c-red)' : ''}">${todo.filter(a => a.urgent).length}</div></div>
      </div>
    </div>
    <div class="call-grid sec">
      <div class="card">
        <div class="toolbar" style="margin-bottom:10px">
          <div class="seg">${[['todo',`À traiter (${todo.length})`],['today','Aujourd’hui'],['week','7 jours']].map(([k, l]) => `<button class="${ui.secFilter === k ? 'on' : ''}" data-act="secFilter" data-k="${k}">${l}</button>`).join('')}</div>
          <div class="search" style="flex:1 1 160px">${icon('search')}<input class="input" id="secSearch" placeholder="Patient, motif, numéro…" value="${esc(ui.secQ)}"></div>
        </div>
        <div class="log-list" id="secList">${secListHtml(list)}</div>
      </div>
      <div class="card sticky-col" id="secDetail">${secDetail()}</div>
    </div>
    <div class="small faint" style="margin-top:14px">Raccourcis : 1 à 5 pour traiter l’appel sélectionné, Ctrl + Entrée pour enregistrer et passer au suivant.</div>
  </div>`;
}
function secListHtml(list){
  return list.map(a => `<div class="log-item ${a.id === ui.selCall ? 'sel' : ''} ${a.urgent ? 'urgent' : ''}" data-act="selCall" data-id="${a.id}">
      <div class="log-time">${fmtTimeAgo(a.date).replace(/^(\d\dh\d\d)$/, '$1')}</div>
      <div class="row-main">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b style="font-weight:500">${esc(callerName(a))}</b>${a.urgent ? tagc('Urgent', 'red') : ''}${tagc(lab(ACTIONS_IA, a.action), col(ACTIONS_IA, a.action))}${a.traitement ? tagc('Traité', 'green') : ''}</div>
        <div class="row-sub">${esc(lab(MOTIFS_APPEL, a.motif))} · ${fmtDur(a.duree)}</div>
      </div></div>`).join('') || '<div class="empty">Aucun appel à afficher.</div>';
}
function secDetail(){
  const a = state.appels.find(x => x.id === ui.selCall);
  if (!a) return '<div class="empty">Sélectionnez un appel dans le journal.</div>';
  const p = patient(a.patientId);
  const tr = a.traitement;
  return `${a.urgent ? `<div class="urgent-banner">${icon('alert')}<div>Appel signalé comme potentiellement urgent. L’IA a donné la consigne d’appeler le 15 si besoin et a transféré l’appel. Une personne de l’équipe doit confirmer la prise en charge.</div></div>` : ''}
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <div><h2 style="font-size:17px">${p ? `<a href="#/patient/${p.id}" style="color:var(--text)">${esc(pName(p))}</a>` : esc(callerName(a)) + ' <span class="tag">Non identifié</span>'}</h2>
        <div class="muted small" style="margin-top:2px">${fmtDateTime(a.date)} · durée ${fmtDur(a.duree)}${p ? ` · ${esc(memberName(p.medecinId))}` : ''}</div></div>
      <a class="phone-big" style="font-size:18px" href="tel:${a.tel.replace(/\s/g, '')}">${icon('phone')}${esc(a.tel)}</a>
    </div>
    <div class="kv" style="margin-top:16px;row-gap:8px">
      <label>Motif détecté</label><div>${esc(lab(MOTIFS_APPEL, a.motif))}</div>
      <label>Action de l’IA</label><div>${tagc(lab(ACTIONS_IA, a.action), col(ACTIONS_IA, a.action))}</div>
    </div>
    <div class="divider"></div>
    <p class="section-title">Résumé de l’appel</p>
    <div class="tpl-text">${esc(a.resume)}</div>
    <div class="note-ia">${icon('bot')} Résumé rédigé par l’IA. À vérifier avant toute action.</div>
    <div class="divider"></div>
    ${tr ? `<p class="section-title">Traitement</p>
      <div class="row-item" style="padding-top:0"><span class="type-ic" style="background:var(--ok-soft);color:var(--ok)">${icon('check')}</span>
        <div class="row-main"><div class="row-title">${esc(lab(TRAITEMENTS, tr.resultat))}</div><div class="row-sub">${esc(memberName(tr.par))} · ${fmtDateTime(tr.date)}${tr.note ? ' · ' + esc(tr.note) : ''}</div></div>
        <button class="btn sm ghost" data-act="reopenCall" data-id="${a.id}">Rouvrir</button></div>`
    : `<p class="section-title">Traitement par l’équipe</p>
      <div class="results" style="grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:0">${TRAITEMENTS.map(r => `<button class="res-btn ${r.cls || ''}" data-act="treat" data-res="${r.k}"><b>${r.l}</b><kbd>Touche ${r.key}</kbd></button>`).join('')}</div>`}`;
}
function openTreat(a, res){
  const p = patient(a.patientId);
  const needRdv = res === 'rdv_pris';
  const m = p ? p.medecinId : a.medecinId;
  let date = todayStr();
  for (let i = 0; i < 10 && !freeSlots(date, m).length; i++){ let d = addDays(parseYmd(date), 1); while ([0, 6].includes(d.getDay())) d = addDays(d, 1); date = ymd(d); }
  openModal(`<form id="treatForm">
    <div class="modal-head"><div><h2>${esc(lab(TRAITEMENTS, res))}</h2><p>${esc(callerName(a))} · ${esc(lab(MOTIFS_APPEL, a.motif))}</p></div>
      <button type="button" class="btn ghost icon" data-act="closeModal" aria-label="Fermer">${icon('x')}</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="field full"><label for="tr_note">Note</label><textarea class="input" id="tr_note" rows="3" placeholder="Ce qui a été fait ou convenu (facultatif)"></textarea></div>
      <div class="field full"><label for="tr_par">Traité par</label><select class="input" id="tr_par">${opts(state.team.filter(x => x.actif !== false).map(x => ({k:x.id, l:x.nom})), state.settings.lastAgent || 's1')}</select></div>
      ${needRdv ? `
      <div class="field"><label for="tr_m">Médecin</label><select class="input" id="tr_m">${medOpts(m)}</select></div>
      <div class="field"><label for="tr_motif">Motif</label><select class="input" id="tr_motif">${opts(MOTIFS_RDV, 'Consultation')}</select></div>
      <div class="field"><label for="tr_d">Date</label><input class="input" type="date" id="tr_d" value="${date}" min="${todayStr()}"></div>
      <div class="field"><label for="tr_t">Créneau libre</label><select class="input" id="tr_t"></select></div>
      ${p ? '' : '<p class="small faint full" style="margin:0">Appelant non identifié : le rendez-vous sera créé avec une fiche patient à compléter.</p>'}` : ''}
    </div></div>
    <div class="modal-foot"><span class="hint">Ctrl + Entrée : enregistrer et suivant</span>
      <button type="button" class="btn" data-act="saveTreat">Enregistrer</button>
      <button type="submit" class="btn primary">Enregistrer et passer au suivant ${icon('arrowR')}</button></div></form>`);
  if (needRdv){
    const fill = () => { const sl = freeSlots($('#tr_d').value, $('#tr_m').value); $('#tr_t').innerHTML = sl.length ? sl.map(s => `<option value="${s}">${hFmt(s)}</option>`).join('') : '<option value="">Aucun créneau libre</option>'; };
    $('#tr_d').onchange = fill; $('#tr_m').onchange = fill; fill();
  }
  const f = $('#treatForm'); f.dataset.id = a.id; f.dataset.res = res;
  f.onsubmit = e => { e.preventDefault(); commitTreat(true); };
  $('#tr_note').focus();
}
function commitTreat(goNext){
  const f = $('#treatForm'); if (!f) return;
  const a = state.appels.find(x => x.id === f.dataset.id), res = f.dataset.res;
  const todoBefore = appelsATraiter().map(x => x.id);
  if (res === 'rdv_pris'){
    if (!$('#tr_t').value){ toast('Choisissez un créneau'); return; }
    let pid = a.patientId;
    if (!pid){
      const [prenom, ...rest] = (a.appelant || 'Patient Nouveau').split(' ');
      const np = Object.assign(newPatientObj(), {prenom, nom: rest.join(' ') || 'À compléter', tel:a.tel, medecinId:$('#tr_m').value, notes:'Fiche créée depuis le secrétariat IA, à compléter.'});
      state.patients.push(np); pid = np.id; a.patientId = pid;
    }
    state.rdv.push({id:uid(), patientId:pid, medecinId:$('#tr_m').value, date:$('#tr_d').value, time:$('#tr_t').value, motif:$('#tr_motif').value, statut:'prevu', source:'secretariat', rappel:false});
  }
  state.settings.lastAgent = $('#tr_par').value;
  a.traitement = {resultat:res, par:$('#tr_par').value, date:new Date().toISOString(), note:$('#tr_note').value.trim()};
  save(); closeModal();
  if (goNext){
    const i = todoBefore.indexOf(a.id);
    const remaining = appelsATraiter();
    const nxt = remaining.find(x => todoBefore.indexOf(x.id) > i) || remaining[0];
    ui.secFilter = 'todo';
    ui.selCall = nxt ? nxt.id : null;
    toast(nxt ? `Enregistré · suivant : ${callerName(nxt)}` : 'Enregistré · plus aucun appel à traiter');
  } else toast('Traitement enregistré');
  if (route().arg) location.hash = '#/secretariat'; else render();
}

/* ==========================================================================
   Demandes patients (kanban)
   ========================================================================== */
function viewDemandes(){
  const {arg} = route();
  const m = myMedecin();
  const list = state.demandes.filter(d => !(m && ui.demMine) || d.medecinId === m);
  if (arg){ const d = state.demandes.find(x => x.id === arg); if (d) setTimeout(() => demandeDetail(d), 0); }
  return `<div class="page wide">
    <div class="page-head"><div><h1>Demandes patients</h1><p>Triées et résumées par l’IA. Glissez une carte pour changer son statut ; cliquez pour corriger le tri ou répondre.</p></div>
      <div class="btn-row">${m ? `<div class="seg"><button class="${ui.demMine ? 'on' : ''}" data-act="demMine" data-k="1">Me concernent</button><button class="${!ui.demMine ? 'on' : ''}" data-act="demMine" data-k="0">Toutes</button></div>` : ''}
        <button class="btn" data-act="newDemande">${icon('plus')} Nouvelle demande</button></div></div>
    <div class="kanban">${DEM_STATUTS.map(s => {
      const items = list.filter(d => d.statut === s.k).sort((a, b) => (a.priorite === 'urgent' ? 0 : 1) - (b.priorite === 'urgent' ? 0 : 1) || b.date.localeCompare(a.date));
      const shown = s.k === 'traitee' ? items.slice(0, 8) : items;
      return `<div class="kcol" data-col="${s.k}">
        <div class="kcol-head"><span style="display:flex;align-items:center;gap:7px"><span style="width:8px;height:8px;border-radius:50%;background:var(--c-${s.c})"></span>${s.l}</span><span class="n">${items.length}</span></div>
        ${shown.map(d => `<div class="kcard" draggable="true" data-id="${d.id}">
          <div class="t">${esc(pName(patient(d.patientId)))}</div>
          <div class="s">${esc(lab(DEM_TYPES, d.type))} · ${esc(lab(CANAUX, d.canal))}</div>
          <div class="s" style="color:var(--text-2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(d.resume)}</div>
          <div class="f">${d.priorite !== 'normal' ? tagc(lab(PRIORITES, d.priorite), col(PRIORITES, d.priorite)) : '<span></span>'}<span class="small faint">${esc(shortDoc(d.medecinId))} · ${fmtTimeAgo(d.date)}</span></div>
          <select class="input" data-move="${d.id}" aria-label="Changer le statut">${opts(DEM_STATUTS, d.statut)}</select>
        </div>`).join('')}
        ${items.length > shown.length ? `<div class="small faint" style="padding:4px">+ ${items.length - shown.length} plus anciennes</div>` : ''}
      </div>`;
    }).join('')}</div></div>`;
}
function bindKanban(){
  let dragId = null, moved = false;
  $$('.kcard').forEach(card => {
    card.addEventListener('dragstart', e => { dragId = card.dataset.id; moved = true; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
    card.addEventListener('dragend', () => { card.classList.remove('dragging'); setTimeout(() => moved = false, 50); });
    card.addEventListener('click', e => { if (moved || e.target.closest('select')) return; const d = state.demandes.find(x => x.id === card.dataset.id); if (d) demandeDetail(d); });
  });
  $$('.kcol').forEach(colEl => {
    colEl.addEventListener('dragover', e => { e.preventDefault(); colEl.classList.add('over'); });
    colEl.addEventListener('dragleave', e => { if (!colEl.contains(e.relatedTarget)) colEl.classList.remove('over'); });
    colEl.addEventListener('drop', e => {
      e.preventDefault(); colEl.classList.remove('over');
      const d = state.demandes.find(x => x.id === (e.dataTransfer.getData('text/plain') || dragId));
      if (d && d.statut !== colEl.dataset.col){ d.statut = colEl.dataset.col; save(); toast(`Demande → ${lab(DEM_STATUTS, d.statut)}`); render(); }
    });
  });
}
function demandeDetail(d){

      ${['ordonnance','question','resultats'].includes(d.type) ? `<div class="note-ia">${icon('shield')} Cette demande relève d’une décision médicale : seul le médecin peut y répondre.</div>` : ''}
      <div class="divider"></div>

        <div class="field full"><label for="dd_note">Note interne</label><textarea class="input" id="dd_note" rows="2" placeholder="Décision, réponse apportée…">${esc(d.note || '')}</textarea></div>
      </div>
      ${tpl ? `<details class="obj" style="margin-top:14px"><summary>Modèle de réponse suggéré : ${esc(tpl.titre)}</summary><div class="obj-body">${fillVars(tpl.texte, tplVars({patient:pName(p), medecin:memberName(d.medecinId)}))}</div></details>` : ''}
    </div>
    <div class="modal-foot">
      <button type="button" class="btn ghost danger" data-act="delDemande" data-id="${d.id}" style="margin-right:auto">Supprimer</button>
      <button type="button" class="btn" data-act="closeModal">Annuler</button>
      ${d.statut !== 'traitee' ? `<button type="button" class="btn" data-act="demDone">Marquer comme traitée</button>` : ''}
      <button type="submit" class="btn primary">Enregistrer</button></div></form>`, 'lg');
  const f = $('#demDetail'); f.dataset.id = d.id;
  f.onsubmit = e => { e.preventDefault(); saveDemande(); };
}
function saveDemande(statut){
  const d = state.demandes.find(x => x.id === $('#demDetail').dataset.id);
  Object.assign(d, {type:$('#dd_type').value, priorite:$('#dd_prio').value, medecinId:$('#dd_m').value, statut: statut || $('#dd_s').value, note:$('#dd_note').value.trim()});
  save(); closeModal(); toast('Demande enregistrée');
  if (route().arg) location.hash = '#/demandes'; else render();
}

/* ==========================================================================
   Comptes rendus (médecin) : l’IA prépare, le médecin valide
   ========================================================================== */
function viewCR(){
  const m = state.settings.medecinId;
  const {arg} = route();
  const list = state.crs.filter(c => c.medecinId === m).sort((a, b) => (a.statut === 'a_valider' ? 0 : 1) - (b.statut === 'a_valider' ? 0 : 1) || (b.date + b.time).localeCompare(a.date + a.time));
  if (arg && list.some(c => c.id === arg)) ui.selCr = arg;
  if (!ui.selCr || !list.some(c => c.id === ui.selCr)) ui.selCr = (list[0] || {}).id;
  const c = list.find(x => x.id === ui.selCr);
  const todo = list.filter(x => x.statut === 'a_valider').length;
  return `<div class="page wide" style="max-width:1300px">
    <div class="page-head"><div><h1>Comptes rendus</h1><p>${plural(todo, 'compte rendu', 'comptes rendus')} à valider · préparés à partir de la transcription de vos consultations</p></div></div>
    <div class="call-grid">
      <div class="card"><div class="log-list">${list.slice(0, 40).map(x => `<div class="log-item ${x.id === ui.selCr ? 'sel' : ''}" data-act="selCr" data-id="${x.id}">
        <div class="log-time">${hFmt(x.time)}</div>
        <div class="row-main"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b style="font-weight:500">${esc(pName(patient(x.patientId)))}</b>${x.statut === 'a_valider' ? tagc('À valider', 'amber') : tagc('Validé', 'green')}</div>
          <div class="row-sub">${relDay(x.date)} · ${esc(x.motif)}</div></div></div>`).join('') || '<div class="empty">Aucun compte rendu.</div>'}</div></div>
      <div class="card sticky-col">${c ? `
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <div><h2 style="font-size:17px"><a href="#/patient/${c.patientId}" style="color:var(--text)">${esc(pName(patient(c.patientId)))}</a></h2>
            <div class="muted small">${fmtDate(c.date)} à ${hFmt(c.time)} · ${esc(c.motif)} · transcription de ${c.duree} min</div></div>
          ${c.statut === 'a_valider' ? pill('À valider', 'amber') : pill('Validé', 'green')}</div>
        <div class="urgent-banner" style="background:var(--warn-soft);color:var(--warn);margin-top:14px">${icon('shield')}<div>Projet préparé par l’IA. Rien n’est enregistré au dossier sans votre relecture et votre validation. Complétez les zones entre crochets.</div></div>
        <textarea class="input cr-text" id="crText" rows="14" ${c.statut === 'valide' ? 'readonly' : ''}>${esc(c.texte)}</textarea>
        <div class="btn-row" style="justify-content:flex-end;margin-top:14px">
          ${c.statut === 'a_valider' ? `<button class="btn" data-act="crSave">Enregistrer le brouillon</button><button class="btn primary" data-act="crValidate">${icon('check')} Valider le compte rendu</button>` : `<button class="btn" data-act="crReopen">Modifier</button>`}
        </div>` : '<div class="empty">Sélectionnez un compte rendu.</div>'}</div>
    </div></div>`;
}

/* ==========================================================================
   Documents reçus : classement proposé par l’IA, validé par l’équipe

function viewDocuments(){

  let list = state.documents.filter(d => (!m || d.medecinId === m));
  if (ui.docFilter === 'a_classer') list = list.filter(d => d.statut === 'a_classer');
  const pats = [...state.patients].sort((a, b) => norm(a.nom).localeCompare(norm(b.nom)));
  const nTodo = state.documents.filter(d => d.statut === 'a_classer' && (!m || d.medecinId === m)).length;
  return `<div class="page">
    <div class="page-head"><div><h1>Documents</h1><p>${plural(nTodo, 'document')} à classer · patient et type identifiés par l’IA, à valider</p></div>
      <div class="seg">${[['a_classer',`À classer (${nTodo})`],['tous','Tous']].map(([k, l]) => `<button class="${ui.docFilter === k ? 'on' : ''}" data-act="docFilter" data-k="${k}">${l}</button>`).join('')}</div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Reçu</th><th>Document</th><th>Patient</th><th>Type</th><th>Confiance IA</th><th></th></tr></thead>

        <td class="small muted">${fmtTimeAgo(d.date)}</td>

        : `<tr style="cursor:default"><td class="small muted">${fmtTimeAgo(d.date)}</td>
        <td><div class="cab-name">${esc(d.titre)}</div><div class="cab-sub">${esc(lab(DOC_SOURCES, d.source))}</div></td>
        <td><a href="#/patient/${d.patientId}">${esc(pName(patient(d.patientId)))}</a></td><td>${esc(d.type)}</td><td>${tagc('Classé', 'green')}</td><td></td></tr>`).join('')
        || '<tr><td colspan="6"><div class="empty">Aucun document à classer. Les nouveaux documents reçus apparaîtront ici.</div></td></tr>'}</tbody>
    </table></div>
    <p class="small faint" style="margin-top:12px">Les documents ne sont rattachés au dossier qu’après validation. En cas de doute sur le patient, corrigez la proposition avant de valider.</p>

    return `<div class="page" style="max-width:920px">

}

/* ==========================================================================
   Activité (gérant) : indicateurs et gains calculés sur les données réelles
   ========================================================================== */
function periodRange(){
  const t = todayStr(), n = new Date();
  if (ui.period === 'mois') return [ymd(new Date(n.getFullYear(), n.getMonth(), 1)), t];
  return [ymd(addDays(n, -(+ui.period - 1))), t];
}
function viewActivite(){
  const [from, to] = periodRange();
  const s = state.settings, g = gainsIA(from, to);
  const appels = state.appels.filter(a => callDay(a) >= from && callDay(a) <= to);
  const funnel = [
    ['Appels reçus', appels.length],
    ['Résolus par l’IA', g.resolus],
    ['RDV pris ou déplacés par l’IA', appels.filter(a => a.action === 'rdv_pris' || a.action === 'deplace').length],
    ['Transférés à l’équipe', appels.filter(a => a.action === 'transfere').length],
    ['À rappeler par l’équipe', appels.filter(a => a.action === 'a_rappeler').length],
    ['Urgences signalées', appels.filter(a => a.urgent).length],
  ].map(([l, v], i) => ({l, v, display: i ? `${v} <small>${pct(v, appels.length)} %</small>` : String(v), hi: l === 'Urgences signalées'}));
  const motifs = MOTIFS_APPEL.map(m => { const v = appels.filter(a => a.motif === m.k).length; return {l:m.l, v, display:`${v} <small>${pct(v, appels.length)} %</small>`}; }).sort((a, b) => b.v - a.v);
  const fill = medecins().map(m => { const v = remplissage(from, to, m.id); return {l:m.nom, v, display:`${v} %`}; });
  const weeks = [];
  for (let k = 5; k >= 0; k--){
    const ws = addDays(startOfWeek(), -7*k), we = addDays(ws, 6);
    const wTo = ymd(we) > todayStr() ? todayStr() : ymd(we);
    if (!state.rdv.some(r => r.date >= ymd(ws) && r.date <= wTo && r.statut !== 'prevu')) continue;
    const v = absenceRate(ymd(ws), wTo);
    weeks.push({l:`Semaine du ${ws.getDate()} ${MOIS[ws.getMonth()]}`, v: Math.round(v*10)/10, display:`${fmtNum(v, 1)} %`, tip:`${fmtNum(v, 1)} % de rendez-vous non honorés`});
  }
  const maxW = Math.max(10, ...weeks.map(w => w.v));
  const rdvP = state.rdv.filter(r => r.date >= from && r.date <= to && r.statut !== 'annule');
  const sources = RDV_SOURCES.map(x => { const v = rdvP.filter(r => r.source === x.k).length; return {l:x.l, v, display:`${v} <small>${pct(v, rdvP.length)} %</small>`}; });
  const hours = [];
  for (let h = 7; h <= 20; h++){ const v = appels.filter(a => new Date(a.date).getHours() === h).length; if (v) hours.push({l:`${h} h – ${h + 1} h`, v, hi: h < 8 || h === 12 || h === 13 || h >= 19, tip:`${v} appels${h < 8 || h === 12 || h === 13 || h >= 19 ? ' · hors horaires du secrétariat' : ''}`}); }
  const mn = s.minutes;
  return `<div class="page">
    <div class="page-head"><div><h1>Activité</h1><p>${fmtDate(from)} → ${fmtDate(to)} · ${plural(rdvP.length, 'rendez-vous', 'rendez-vous')} · ${plural(appels.length, 'appel')}</p></div>
      <div class="seg">${[['7','7 jours'],['30','30 jours'],['mois','Mois en cours']].map(([k, l]) => `<button class="${ui.period === k ? 'on' : ''}" data-act="period" data-k="${k}">${l}</button>`).join('')}</div></div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-head"><h2>Temps et revenus gagnés grâce à l’IA</h2><span class="small faint">calculé sur les données réelles de la période</span></div>
      <div class="calc-grid">
        <div>
          <div class="hero">
            <div class="hero-label">Valeur estimée générée par l’IA</div>
            <div class="hero-value">${fmtEur(g.total)}</div>
            <div class="hero-sub"><b style="color:var(--text)">${fmtNum(g.heures)} h</b> de travail administratif économisées · coût des automatisations ${fmtEur(g.prix)}</div>
          </div>
          <div class="stat-grid">
            <div class="stat"><div class="v">${fmtNum(g.heures)} h</div><div class="l">temps gagné (≈ ${fmtEur(g.valTemps)})</div></div>
            <div class="stat"><div class="v">${fmtNum(g.consultsRecup)}</div><div class="l">consultations récupérées (≈ ${fmtEur(g.valConsults)})</div></div>
            <div class="stat"><div class="v">${fmtNum(g.absencesEvitees)}</div><div class="l">absences évitées (taux ${fmtNum(g.tauxActuel, 1)} % contre ${fmtNum(s.tauxAbsenceAvant, 1)} % avant)</div></div>
            <div class="stat"><div class="v">${g.prix ? '×' + fmtNum(g.multiple, 1) : '—'}</div><div class="l">valeur générée / coût des automatisations</div></div>
          </div>
          <p class="small muted" style="margin:12px 0 0">Dont ${plural(g.horsHoraires, 'rendez-vous', 'rendez-vous')} pris par l’IA en dehors des horaires du secrétariat (midi, soir, avant l’ouverture).</p>
        </div>
        <div>
          <p class="section-title">Détail du temps gagné</p>
          ${hbars(g.parts.map(p => ({l:p.l, v:p.min, display:`${fmtNum(p.min / 60, 1)} h`, tip:`${p.l} : ${p.n} × ${fmtNum(p.min / Math.max(1, p.n), 1)} min`})))}
          <details class="hyp"><summary>Hypothèses de calcul</summary>
            <div class="form-grid" style="margin-top:10px;gap:10px">
              ${[['appel','Minutes par appel résolu'],['rappel','Minutes par rappel envoyé'],['demande','Minutes par demande triée'],['cr','Minutes par compte rendu'],['document','Minutes par document classé']].map(([k, l]) =>
                `<div class="field"><label>${l}</label><input class="input num" type="number" min="0" step="0.5" data-min="${k}" value="${mn[k]}"></div>`).join('')}
              <div class="field"><label>Coût horaire du secrétariat (€)</label><input class="input num" type="number" min="0" data-set="coutHoraire" value="${s.coutHoraire}"></div>
              <div class="field"><label>Valeur moyenne d’une consultation (€)</label><input class="input num" type="number" min="0" data-set="valeurConsult" value="${s.valeurConsult}"></div>
              <div class="field"><label>Taux d’absence avant l’IA (%)</label><input class="input num" type="number" min="0" step="0.1" data-set="tauxAbsenceAvant" value="${s.tauxAbsenceAvant}"></div>
              <div class="field"><label>Coût mensuel des automatisations (€)</label><input class="input num" type="number" min="0" data-set="prixIA" value="${s.prixIA}"></div>
            </div>
            <p class="small faint">Estimation indicative, recalculée à chaque modification.</p>
          </details>
        </div>
      </div>
    </div>

    <div class="grid g-2" style="margin-bottom:16px">
      <div class="card funnel"><div class="card-head"><h2>Parcours des appels</h2><span class="small faint">% des appels reçus</span></div>${hbars(funnel)}</div>
      <div class="card"><div class="card-head"><h2>Motifs d’appel</h2></div>${hbars(motifs)}</div>
    </div>
    <div class="grid g-2" style="margin-bottom:16px">
      <div class="card"><div class="card-head"><h2>Taux de remplissage par médecin</h2><span class="small faint">${s.creneauxJour} créneaux par jour</span></div>${hbars(fill, {scale100:true})}</div>
      <div class="card"><div class="card-head"><h2>Rendez-vous non honorés</h2><span class="small faint">par semaine</span></div>${hbars(weeks.map(w => ({...w, v: w.v / maxW * 100})), {scale100:true})}</div>
    </div>
    <div class="grid g-2">
      <div class="card"><div class="card-head"><h2>Origine des rendez-vous</h2></div>${hbars(sources)}</div>
      <div class="card"><div class="card-head"><h2>Heures d’appel</h2><span class="small faint">en orange : hors horaires du secrétariat</span></div>${hbars(hours)}</div>
    </div>
  </div>`;
}

/* ==========================================================================
   Automatisations (gérant)
   ========================================================================== */
function autoStat(id){
  const t = todayStr(), n = new Date(), ms = ymd(new Date(n.getFullYear(), n.getMonth(), 1));
  const inM = d => d >= ms && d <= t;
  switch (id){
    case 'secretariat': { const a = state.appels.filter(x => inM(callDay(x))); return `${plural(a.length, 'appel')} ce mois · ${pct(a.filter(x => RESOLU_IA.has(x.action) && !x.urgent).length, a.length)} % résolus sans intervention · ${plural(a.filter(x => x.urgent).length, 'urgence')} signalée${a.filter(x => x.urgent).length > 1 ? 's' : ''}`; }
    case 'rappels': return `${plural(state.rdv.filter(r => inM(r.date) && r.rappel).length, 'rappel')} envoyés ce mois`;
    case 'attente': return 'Inactif';
    case 'tri': return `${plural(state.demandes.filter(d => inM(ymd(new Date(d.date)))).length, 'demande')} triées ce mois`;
    case 'transcription': { const c = state.crs.filter(x => inM(x.date)); return `${plural(c.length, 'compte rendu', 'comptes rendus')} préparés ce mois · ${c.filter(x => x.statut === 'a_valider').length} en attente de validation`; }
    case 'documents': return `${plural(state.documents.filter(d => inM(ymd(new Date(d.date)))).length, 'document')} classés ce mois · ${docsAClasser().length} à valider`;
  }
  return '';
}
function viewAutomations(){
  return `<div class="page" style="max-width:920px">
    <div class="page-head"><div><h1>Automatisations</h1><p>L’IA prépare, l’humain valide. Activez ou suspendez chaque automatisation à tout moment.</p></div></div>
    <div class="grid" style="gap:10px;margin-bottom:22px">${state.automations.map(a => `<div class="card auto-card">

/* CSV */
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const sep = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep){ row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return {sep, rows: rows.filter(r => r.some(x => x.trim()))};
}
const CSV_ALIASES = {
  prenom:['prenom','first name','firstname'], nom:['nom','last name','lastname','nom de famille'], naissance:['naissance','annee de naissance','date de naissance','ne en'],
  tel:['telephone','tel','phone','portable','mobile'], email:['email','mail','e-mail','courriel'], ville:['ville','city','commune'],
  medecin:['medecin','medecin traitant','docteur'], notes:['notes','note','commentaire'],
};
function importCSV(text){
  const {sep, rows} = parseCSV(text);
  if (rows.length < 2){ toast('Fichier vide ou illisible'); return; }
  const head = rows[0].map(h => norm(h));
  const idx = {};
  for (const [k, al] of Object.entries(CSV_ALIASES)){ const i = head.findIndex(h => al.includes(h)); if (i >= 0) idx[k] = i; }
  if (idx.nom == null){ toast('Colonne « nom » introuvable'); return; }
  let n = 0;
  for (const r of rows.slice(1)){
    const g = k => idx[k] != null ? (r[idx[k]] || '').trim() : '';
    if (!g('nom')) continue;
    const p = newPatientObj();
    Object.assign(p, {prenom:g('prenom'), nom:g('nom'), tel:g('tel'), email:g('email'), ville:g('ville'), notes:g('notes')});
    const y = (g('naissance').match(/(19|20)\d\d/) || [''])[0]; p.naissance = y;
    const med = medecins().find(m => g('medecin') && norm(m.nom).includes(norm(g('medecin')).replace(/^dr\.?\s*/, '')));
    if (med) p.medecinId = med.id;
    state.patients.push(p); n++;
  }
  save(); toast(`${plural(n, 'patient')} importé${n > 1 ? 's' : ''} (séparateur « ${sep} »)`); render();
}
function exportCSV(){
  const cell = v => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [['Prénom','Nom','Année de naissance','Téléphone','Email','Ville','Médecin traitant','Dernier RDV','Prochain RDV','Notes'].join(';')];
  const idx = patientIndex();
  for (const p of state.patients){
    const x = idx[p.id];
    lines.push([p.prenom, p.nom, p.naissance, p.tel, p.email, p.ville, memberName(p.medecinId), x.last ? x.last.date : '', x.next ? `${x.next.date} ${x.next.time}` : '', p.notes].map(cell).join(';'));
  }
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `patients-${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Export CSV téléchargé');
}

function confirmBox(title, text, okLabel, onOk){

    <div class="modal-foot"><button class="btn" data-act="closeModal">Annuler</button><button class="btn primary" id="confirmOk">${esc(okLabel)}</button></div>`);

function moveTip(e){ const t = $('#tooltip'); const w = t.offsetWidth; t.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, e.clientX - w / 2)) + 'px'; t.style.top = (e.clientY - 40) + 'px'; }
function hideTip(){ const t = $('#tooltip'); if (t) t.classList.remove('show'); }
function applyTheme(t){ if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
function toggleTheme(){
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);

}

  const isInput = e.type === 'input';
  const val = el.value;
  if (el.id === 'mobileRole' && !isInput){ const [r, m] = val.split(':'); setRole(r, m); return; }
  if (el.matches('[data-medsel]') && !isInput){ setRole('medecin', val); return; }
  // Filtres patients
  if (el.dataset.pfilter){
    ui.pf[el.dataset.pfilter] = val;
    if (el.dataset.pfilter === 'q'){ if (isInput) $('#patTable').innerHTML = patTable(); }
    else if (!isInput) render();
    return;
  }
  // Fiche patient
  if (el.dataset.pf){
    const p = patient(route().arg); if (!p) return;
    if (el.tagName === 'SELECT' && isInput) return;
    p[el.dataset.pf] = val; save();
    if (!isInput && el.dataset.pf === 'medecinId') render();
    return;
  }
  if (el.id === 'agendaPick' && !isInput && val){ ui.agendaDate = val; render(); return; }
  if (el.id === 'secSearch'){ ui.secQ = val; $('#secList').innerHTML = secListHtml(secList()); return; }
  if (el.id === 'tplSearch'){ ui.tplQ = val; $('#tplList').innerHTML = tplList(tplVars()); return; }
  // Kanban sur mobile
  if (el.dataset.move && !isInput){ const d = state.demandes.find(x => x.id === el.dataset.move); d.statut = val; save(); toast(`Demande → ${lab(DEM_STATUTS, val)}`); render(); return; }
  // Documents : correction de la proposition de l’IA
  if (el.dataset.docf && !isInput){ const d = state.documents.find(x => x.id === el.dataset.id); d[el.dataset.docf] = val; save(); return; }
  // Modèles
  if (el.dataset.tf){ state.templates[+el.dataset.tpl][el.dataset.tf] = val; save(); return; }
  // Automatisations
  if (el.dataset.auto && !isInput){
    const a = state.automations.find(x => x.id === el.dataset.auto); a.actif = el.checked; save();
    toast(`${a.nom} : ${a.actif ? 'activée' : 'suspendue'}`); render(); return;
  }
  // Hypothèses et paramètres
  if (el.dataset.min){ state.settings.minutes[el.dataset.min] = Math.max(0, +val || 0); save(); if (!isInput) render(); return; }
  if (el.dataset.set){
    const k = el.dataset.set;
    const numeric = ['creneauxJour','valeurConsult','coutHoraire','prixIA','tauxAbsenceAvant'].includes(k);
    state.settings[k] = numeric ? Math.max(0, +val || 0) : val;
    save();
    if (k === 'appName' || k === 'cabinet') renderShell();
    if (numeric && !isInput && route().name === 'activite') render();
    return;
  }
  if (el.id === 'csvFile' && !isInput && el.files[0]){
    const reader = new FileReader();
    reader.onload = () => importCSV(String(reader.result));
    reader.readAsText(el.files[0], 'utf-8');
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (isModalOpen()) closeModal();
    else if ($('#drawer').innerHTML) $('#drawer').innerHTML = '';
    return;
  }
  if (isModalOpen()){
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && $('#treatForm')){ e.preventDefault(); commitTreat(true); }
    return;
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input','textarea','select'].includes(tag) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (route().name !== 'secretariat') return;
  const a = curCall(); if (!a || a.traitement) return;
  const r = TRAITEMENTS.find(x => x.key === e.key);
  if (r){ e.preventDefault(); openTreat(a, r.k); }
});

document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el, e); });
document.addEventListener('mousemove', e => { if (e.target.closest('[data-tip]')) moveTip(e); });
document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hideTip(); });

window.addEventListener('hashchange', () => { $('#modal').innerHTML = ''; render(); });
window.addEventListener('storage', e => { if (e.key === STORE_KEY && e.newValue){ load(); render(); } });

/* ==========================================================================
   Démarrage
   ========================================================================== */
try { applyTheme(localStorage.getItem(THEME_KEY)); } catch (e) {}
load();
render();
</script>
</body>
</html>
