<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prospection cabinet</title>
<meta name="description" content="Outil interne du cabinet médical : agenda, patients, secrétariat IA, demandes, comptes rendus, documents et activité. L’IA prépare, l’humain valide.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a6fc9'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light;
  --bg:#f7f7f5; --surface:#ffffff; --surface-2:#f2f2ef; --surface-3:#e9e9e5;
  --border:#e4e3df; --border-strong:#d2d1cb;
  --text:#18181b; --text-2:#52514e; --text-3:#8a8984;
  --accent:#2a6fc9; --accent-hover:#225db0; --accent-soft:#e8f0fb; --accent-text:#1d5aa8;
  --series-1:#2a78d6; --series-2:#eb6834;
  --danger:#c2410c; --danger-soft:#fdf0e9; --ok:#15803d; --ok-soft:#eaf6ee; --warn:#a16207; --warn-soft:#fbf4e2;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 4px 16px rgba(20,20,20,.05);
  --shadow-lg:0 10px 40px rgba(20,20,20,.16);
  --radius:10px; --radius-sm:7px;
  /* couleurs de statut */
  --c-gray:#8a8984; --c-gray-bg:#f0f0ed;
  --c-amber:#b45309; --c-amber-bg:#fbf3e4;
  --c-blue:#2563b8; --c-blue-bg:#eaf1fb;
  --c-violet:#7c3aed; --c-violet-bg:#f3eefd;
  --c-teal:#0f7d76; --c-teal-bg:#e6f5f3;
  --c-indigo:#4338ca; --c-indigo-bg:#eeeefb;
  --c-green:#15803d; --c-green-bg:#e9f6ed;
  --c-red:#b4383f; --c-red-bg:#fbeced;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121212; --surface:#1a1a19; --surface-2:#222221; --surface-3:#2b2b29;
    --border:#2c2c2a; --border-strong:#3a3a37;
    --text:#f0efec; --text-2:#c3c2b7; --text-3:#8d8c85;
    --accent:#4a8fe6; --accent-hover:#6aa3ec; --accent-soft:#1c2a3d; --accent-text:#8bb8f2;
    --series-1:#3987e5; --series-2:#d95926;
    --danger:#f08a5d; --danger-soft:#33221a; --ok:#5fc27e; --ok-soft:#18291e; --warn:#e0b04a; --warn-soft:#2e2715;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --shadow-lg:0 10px 40px rgba(0,0,0,.5);
    --c-gray:#a3a29c; --c-gray-bg:#262624;
    --c-amber:#e5a54b; --c-amber-bg:#2f2617;
    --c-blue:#6ea4ec; --c-blue-bg:#1b2738;
    --c-violet:#ad8cf5; --c-violet-bg:#272038;
    --c-teal:#4cc0b4; --c-teal-bg:#152c2a;
    --c-indigo:#8f8cf0; --c-indigo-bg:#212038;
    --c-green:#5fc27e; --c-green-bg:#18291e;
    --c-red:#ec7d84; --c-red-bg:#331c1e;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121212; --surface:#1a1a19; --surface-2:#222221; --surface-3:#2b2b29;
  --border:#2c2c2a; --border-strong:#3a3a37;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8d8c85;
  --accent:#4a8fe6; --accent-hover:#6aa3ec; --accent-soft:#1c2a3d; --accent-text:#8bb8f2;
  --series-1:#3987e5; --series-2:#d95926;
  --danger:#f08a5d; --danger-soft:#33221a; --ok:#5fc27e; --ok-soft:#18291e; --warn:#e0b04a; --warn-soft:#2e2715;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  --c-gray:#a3a29c; --c-gray-bg:#262624;
  --c-amber:#e5a54b; --c-amber-bg:#2f2617;
  --c-blue:#6ea4ec; --c-blue-bg:#1b2738;
  --c-violet:#ad8cf5; --c-violet-bg:#272038;
  --c-teal:#4cc0b4; --c-teal-bg:#152c2a;
  --c-indigo:#8f8cf0; --c-indigo-bg:#212038;
  --c-green:#5fc27e; --c-green-bg:#18291e;
  --c-red:#ec7d84; --c-red-bg:#331c1e;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv11","ss01","tnum" 0;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:16px} h3{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.small{font-size:12.5px}
.hidden{display:none!important}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{
  width:232px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-title{font-weight:600;font-size:13.5px;line-height:1.2}
.brand-sub{font-size:11.5px;color:var(--text-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{
  display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--radius-sm);
  color:var(--text-2);font-weight:500;text-decoration:none;
}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--accent-soft);color:var(--accent-text)}
.nav svg{width:17px;height:17px;flex:none}
.nav .count{margin-left:auto;font-size:11.5px;background:var(--danger-soft);color:var(--danger);padding:0 7px;border-radius:20px;font-weight:600}
.sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.save-state{font-size:11.5px;color:var(--text-3);padding:0 6px;display:flex;align-items:center;gap:6px}
.save-state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.main{flex:1;min-width:0}
.page{max-width:1240px;margin:0 auto;padding:28px 32px 64px}
.page.wide{max-width:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--text-2)}
.mobile-top,.bottom-nav{display:none}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h2{font-size:14px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-dash{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.kpi-label{font-size:12px;color:var(--text-2);font-weight:500}
.kpi-value{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi-value small{font-size:14px;color:var(--text-3);font-weight:500;letter-spacing:0}
.kpi-sub{font-size:12px;color:var(--text-3);margin-top:4px}
.progress{height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden;margin-top:10px}
.progress > span{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:34px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .12s,border-color .12s;text-decoration:none!important;
}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.input:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--danger)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.lg{height:42px;padding:0 18px;font-size:15px}
.btn svg{width:15px;height:15px}
.btn.icon{width:34px;padding:0}
.btn.sm.icon{width:28px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Forms */
.input,select.input,textarea.input{
  width:100%;height:34px;padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:var(--surface);outline:none;transition:border-color .12s,box-shadow .12s;
}
textarea.input{height:auto;padding:8px 10px;resize:vertical;min-height:72px;line-height:1.5}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label,.label{font-size:12px;color:var(--text-2);font-weight:500}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.inline-input{
  width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 7px;margin:0 -7px;
  height:30px;outline:none;
}
.inline-input:hover{border-color:var(--border)}
.inline-input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
select.inline-input{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--border-strong);background:var(--surface);border-radius:20px;padding:4px 11px;
  font-size:12.5px;cursor:pointer;color:var(--text-2);user-select:none;
}
.chip:hover{border-color:var(--text-3)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:500}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--surface-2);border-radius:var(--radius-sm);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:5px;cursor:pointer;color:var(--text-2);font-weight:500;font-size:13px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;
  background:var(--pbg,var(--surface-2));color:var(--pc,var(--text-2))}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.prio{display:inline-flex;gap:2px;align-items:center}
.prio i{width:5px;height:12px;border-radius:2px;background:var(--surface-3)}
.prio.p1 i{background:var(--danger)} .prio.p2 i:nth-child(-n+2){background:var(--warn)} .prio.p3 i:first-child{background:var(--text-3)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--text-2);font-size:11.5px;font-weight:500}
.tag.late{background:var(--danger-soft);color:var(--danger)}
.tag.today{background:var(--accent-soft);color:var(--accent-text)}

/* Lists */
.list{display:flex;flex-direction:column}
.row-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
.row-item:first-child{border-top:0;padding-top:2px}
.row-main{flex:1;min-width:0}
.row-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-title a{color:var(--text)}
.row-sub{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--text-3);padding:18px 0;text-align:center;font-size:13px}

/* Table */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar .search{flex:1 1 240px;max-width:340px;position:relative}
.toolbar .search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--text-3)}
.toolbar .search input{padding-left:32px}
.toolbar select.input{width:auto;min-width:130px}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:12px;font-weight:500;color:var(--text-2);background:var(--surface);position:sticky;top:0;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
th .arrow{opacity:.6;margin-left:3px;font-size:10px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td .cab-name{font-weight:500}
td .cab-sub{font-size:12px;color:var(--text-3)}

/* Call mode */
.call-head{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;
  display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;
}
.call-id{flex:1 1 280px;min-width:0}
.call-id h1{font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.call-meta{color:var(--text-2);margin-top:3px;font-size:13px}
.phone-big{font-size:22px;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--text)!important;display:inline-flex;align-items:center;gap:8px}
.phone-big svg{width:18px;height:18px;color:var(--accent)}
.timer{display:flex;align-items:center;gap:10px}
.timer-val{font-size:22px;font-variant-numeric:tabular-nums;font-weight:600;min-width:66px;color:var(--text-3)}
.timer.running .timer-val{color:var(--accent-text)}
.rec-dot{width:8px;height:8px;border-radius:50%;background:var(--danger);display:none;animation:pulse 1.2s infinite}
.timer.running .rec-dot{display:block}
@keyframes pulse{50%{opacity:.25}}
.results{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:16px}
.res-btn{
  border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);padding:10px 8px;cursor:pointer;
  text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .12s,background .12s;min-height:58px;
}
.res-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.res-btn b{font-weight:500;font-size:13px;line-height:1.25}
.res-btn kbd{font-family:inherit;font-size:11px;color:var(--text-3)}
.res-btn.pos b{color:var(--ok)} .res-btn.neg b{color:var(--c-red)}
.call-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:600;margin:0 0 10px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:2px 10px;align-items:center}
.kv > label{font-size:12.5px;color:var(--text-2)}
.divider{height:1px;background:var(--border);margin:18px 0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:-4px -18px 18px;padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--text-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.sticky-col{position:sticky;top:16px}

/* Script */
.step{border-left:2px solid var(--border);padding:2px 0 18px 18px;position:relative}
.step:last-child{padding-bottom:4px}
.step::before{content:attr(data-n);position:absolute;left:-12px;top:0;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--border-strong);font-size:11.5px;font-weight:600;display:grid;place-items:center;color:var(--text-2)}
.step.on{border-left-color:var(--accent)}
.step.on::before{background:var(--accent);border-color:var(--accent);color:#fff}
.step h3{margin-bottom:6px;cursor:pointer}
.step-text{white-space:pre-wrap;color:var(--text);font-size:14.5px;line-height:1.65}
.step-text .v{background:var(--accent-soft);color:var(--accent-text);border-radius:4px;padding:0 3px;font-weight:500}
.step-text .ph{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px}
.step-hint{font-size:12.5px;color:var(--text-3);margin-top:6px;white-space:pre-wrap}

/* Objections */
.obj{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface)}
.obj summary{list-style:none;padding:11px 14px;cursor:pointer;font-weight:500;display:flex;gap:10px;align-items:center}
.obj summary::-webkit-details-marker{display:none}
.obj summary::after{content:"+";margin-left:auto;color:var(--text-3);font-weight:400;font-size:16px}
.obj[open] summary::after{content:"–"}
.obj .obj-body{padding:0 14px 14px;white-space:pre-wrap;line-height:1.65;font-size:14px}

/* Calculator */
.calc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px}
.hero{background:var(--accent-soft);border-radius:var(--radius);padding:22px;text-align:left}
.hero-label{font-size:12.5px;color:var(--accent-text);font-weight:500}
.hero-value{font-size:44px;font-weight:650;letter-spacing:-.03em;line-height:1.05;margin:4px 0 2px;color:var(--text);font-variant-numeric:tabular-nums}
.hero-sub{color:var(--text-2);font-size:13.5px}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px}
.stat .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .l{font-size:12px;color:var(--text-2)}
details.hyp summary{cursor:pointer;color:var(--text-2);font-size:12.5px;margin-top:12px}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.kcol{background:var(--surface-2);border-radius:var(--radius);padding:10px;min-height:200px;transition:background .12s}
.kcol.over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}
.kcol-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px;font-weight:600;font-size:13px}
.kcol-head .n{color:var(--text-3);font-weight:500}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.kcard:hover{border-color:var(--border-strong)}
.kcard.dragging{opacity:.4}
.kcard .t{font-weight:500;font-size:13px;line-height:1.3}
.kcard .s{font-size:12px;color:var(--text-3);margin-top:2px}
.kcard .f{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px}
.kcard select{display:none}

/* Agenda */
.agenda-group{margin-bottom:22px}
.agenda-group h2{font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.agenda-group h2 .n{color:var(--text-3);font-weight:500}
.ag-item{display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px}
.ag-when{width:92px;flex:none;font-variant-numeric:tabular-nums}
.ag-when b{display:block;font-weight:600}
.ag-when span{font-size:12px;color:var(--text-3)}
.type-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--text-2)}
.type-ic svg{width:15px;height:15px}

.switch input:checked + span{background:var(--accent)}

<script>

const NOMS = ['Durand','Lefebvre','Moreau','Girard','Roux','Fournier','Bonnet','Dupont','Lambert','Fontaine','Rousseau','Vincent','Muller','Faure','André','Blanc','Guérin','Boyer','Chevalier','François','Legrand','Gauthier','Perrin','Robin','Clément','Morin','Henry','Roussel','Mathieu','Gautier','Masson','Marchand','Duval','Denis','Dumont','Lemaire','Barbier','Arnaud','Picard','Leroy'];

const NOTES_ADMIN = ['','','','Préfère être appelé le matin.','Joignable uniquement par SMS.','Vient souvent accompagné de sa fille.','Mutuelle à mettre à jour.','Demande des créneaux après 17 h.','Patient malentendant : privilégier les SMS.',''];
const TYPES_BY_MED = {m1:[['consult',55],['suivi',25],['premiere',8],['vaccin',7]], m2:[['pedia',60],['vaccin',25],['suivi',15]], m3:[['dermato',60],['suivi',20],['acte',20]]};

function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* Créneaux de 20 minutes ; pause déjeuner de 12 h 30 à 14 h */
const SLOT = 20;
const SLOTS = (() => { const out = []; for (let m = 8*60+30; m <= 12*60+10; m += SLOT) out.push(m); for (let m = 14*60; m <= 18*60+20; m += SLOT) out.push(m); return out; })();
const hm = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const minutesOf = t => { const [h, m] = t.split(':').map(Number); return h*60 + m; };
const sameBlock = (a, b) => (a < 13*60) === (b < 13*60);
const isWeekday = d => d.getDay() !== 0 && d.getDay() !== 6;

function buildSample(){
  const R = rng(20261019);
  const pick = a => a[Math.floor(R()*a.length)];
  const wpick = pairs => { let x = R() * pairs.reduce((s, p) => s + p[1], 0); for (const [v, w] of pairs){ if ((x -= w) < 0) return v; } return pairs[0][0]; };
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const T = ymd(today);
  const nowMin = now.getHours()*60 + now.getMinutes();
  const iso = (d, min) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(min/60), min%60, Math.floor(R()*60)).toISOString();
  const types = Object.fromEntries(DEFAULT_TYPES.map(t => [t.k, t]));
  const rappelsDepuis = ymd(addDays(today, -45));

  /* Absences de l’équipe */
  let thu = addDays(startOfWeek(), 3); if (ymd(thu) < T) thu = addDays(thu, 7);
  const nextMon = addDays(startOfWeek(), 7);
  const absences = [
    {id:'ab1', memberId:'m3', from:ymd(thu), to:ymd(thu), motif:'Formation'},
    {id:'ab2', memberId:'s2', from:ymd(nextMon), to:ymd(addDays(nextMon, 4)), motif:'Congés'},
  ];
  const absent = (m, date) => absences.some(a => a.memberId === m && date >= a.from && date <= a.to);

  /* Patients */
  const patients = [];
  const used = new Set(), usedTel = new Set();
  for (let i = 0; i < 60; i++){
    let prenom, nom, tel;
    do { prenom = pick(PRENOMS); nom = pick(NOMS); } while (used.has(prenom + nom));
    used.add(prenom + nom);
    do { tel = `02 61 91 ${pad(10 + Math.floor(R()*90))} ${pad(Math.floor(R()*100))}`; } while (usedTel.has(tel));
    usedTel.add(tel);
    const medecinId = i % 3 === 0 ? 'm1' : i % 3 === 1 ? 'm2' : 'm3';
    const naissance = medecinId === 'm2' ? 2011 + Math.floor(R()*15) : 1940 + Math.floor(R()*66);
    patients.push({id:'p' + (i+1), sample:true, prenom, nom, naissance, tel,
      email: R() < .8 ? `${norm(prenom)}.${norm(nom)}@patient.example`.replace(/[^a-z.@]/g, '') : '',
      ville: pick(VILLES), medecinId, notes: pick(NOTES_ADMIN), createdAt: addDays(today, -500).toISOString()});
  }
  const byMed = m => patients.filter(p => p.medecinId === m);
  const adults = patients.filter(p => p.medecinId !== 'm2');

  /* Rendez-vous : 3 mois d’historique, 2 semaines à venir */
  const rdv = [];
  for (let d = -92; d <= 14; d++){
    const day = addDays(today, d);
    if (!isWeekday(day)) continue;
    const date = ymd(day);
    for (const m of ['m1','m2','m3']){
      if (absent(m, date)) continue;
      const fill = d < 0 ? .8 + R()*.12 : d === 0 ? .9 : Math.max(.25, .88 - d*.045);
      for (let i = 0; i < SLOTS.length; i++){
        const s = SLOTS[i];
        if (R() > fill) continue;
        let type = wpick(TYPES_BY_MED[m]);
        const long = types[type].duree > SLOT;
        if (long && !(SLOTS[i+1] && sameBlock(s, SLOTS[i+1]))) type = m === 'm3' ? 'dermato' : TYPES_BY_MED[m][0][0];
        if (types[type].duree > SLOT) i++;
        const p = m === 'm2' ? pick(byMed('m2')) : R() < .75 ? pick(byMed(m)) : pick(adults);
        const past = d < 0 || (d === 0 && s + SLOT <= nowMin);
        let statut = 'prevu';
        if (past){ const x = R(), abs = date < rappelsDepuis ? .075 : .034; statut = x < abs ? 'absent' : x < abs + .03 ? 'annule' : 'honore'; }
        else if (R() < .022) statut = 'annule';
        const source = wpick([['ia',35],['en_ligne',40],['secretariat',25]]);
        const lead = source === 'secretariat' ? Math.floor(R()*16) : 1 + Math.floor(R()*11);
        const r = {id:'r' + rdv.length, patientId:p.id, medecinId:m, date, time:hm(s), type, statut, source, createdAt: ymd(addDays(day, -lead)), rp:null};
        if (date >= rappelsDepuis && d <= 1 && ymd(addDays(day, -1)) <= T){
          const c = p.email && R() < .35 ? 'email' : 'sms';
          r.rp = {c, s: statut === 'annule' ? 'annule' : R() < (d <= 0 ? .78 : .55) ? 'confirme' : 'envoye'};
        }
        rdv.push(r);
      }
    }
  }

  /* Journal du secrétariat IA : 3 mois, une trentaine d’appels aujourd’hui */
  const appels = [];
  const docName = m => SAMPLE_TEAM.find(t => t.id === m).nom;
  const resumeFor = (motif, action, p, m) => {
    const who = p ? `${p.prenom} ${p.nom}` : 'Un nouveau patient';
    const jour = pick(['lundi','mardi','mercredi','jeudi','vendredi']), h = pick(['9 h 10','10 h 30','11 h 50','14 h 20','16 h 40','17 h 20']);
    switch (motif){
      case 'rdv': return action === 'rdv_pris' ? `${who} souhaite un rendez-vous avec ${docName(m)}. Créneau proposé et accepté : ${jour} à ${h}. SMS de confirmation envoyé.` : `${who} souhaite un rendez-vous rapide avec ${docName(m)}. Aucun créneau adapté dans les 48 h : rappel demandé par le secrétariat.`;
      case 'deplacement': return `${who} ne peut pas venir à son rendez-vous. Rendez-vous déplacé à ${jour} ${h} avec ${docName(m)}. Ancien créneau libéré.`;
      case 'annulation': return `${who} annule son rendez-vous de demain. Créneau libéré et signalé pour la liste d’attente.`;
      case 'info': return pick([`${who} demande les horaires d’ouverture. Information donnée.`, `${who} demande les documents à apporter pour une première consultation. Consignes données et envoyées par SMS.`, `${who} demande si le cabinet est accessible en fauteuil roulant. Information donnée.`]);
      case 'ordonnance': return action === 'info' ? `${who} demande un renouvellement d’ordonnance. Demande enregistrée et transmise à ${docName(m)} pour décision.` : `${who} demande un renouvellement d’ordonnance et souhaite parler au secrétariat. À rappeler.`;
      case 'resultats': return action === 'transfere' ? `${who} appelle au sujet d’un courrier reçu. Aucune information médicale donnée par l’IA. Appel transféré au secrétariat.` : `${who} demande si ses résultats sont arrivés. Aucune information donnée par téléphone : à rappeler par l’équipe.`;
      case 'urgence': return `L’appelant décrit une situation qui pourrait être urgente. Consigne donnée d’appeler le 15 en cas d’aggravation. Appel transféré immédiatement au cabinet et signalé à l’équipe.`;
      default: return `${who} souhaite parler à une personne du cabinet pour une question administrative (facturation, mutuelle). À rappeler.`;
    }
  };
  for (let d = -90; d <= 0; d++){
    const day = addDays(today, d);
    const we = !isWeekday(day);
    let n, times = [];
    if (d === 0){
      n = 30;
      const start = nowMin > 9*60 ? 7*60 : Math.max(0, nowMin - 240), end = Math.max(start + 30, nowMin - 2);
      for (let k = 0; k < n; k++) times.push(start + Math.floor(R()*(end - start)));
    } else {
      n = we ? 2 + Math.floor(R()*4) : 24 + Math.floor(R()*12);
      for (let k = 0; k < n; k++){
        const [a, b] = we ? [9*60, 19*60] : wpick([[[7*60, 8*60+30],3],[[8*60+30, 10*60],10],[[10*60, 12*60],7],[[12*60, 14*60],5],[[14*60, 17*60],7],[[17*60, 19*60],5],[[19*60, 21*60],2]]);
        times.push(a + Math.floor(R()*(b - a)));
      }
    }
    for (const t of times){
      const motif = wpick([['rdv',38],['deplacement',12],['annulation',7],['info',18],['ordonnance',10],['resultats',7],['urgence',1.5],['autre',5]]);
      const p = R() < .88 ? pick(patients) : null;
      const m = p ? p.medecinId : pick(['m1','m2','m3']);
      let action;
      switch (motif){
        case 'rdv': action = R() < .86 ? 'rdv_pris' : 'a_rappeler'; break;
        case 'deplacement': action = 'deplace'; break;
        case 'annulation': action = 'annule'; break;
        case 'info': action = 'info'; break;
        case 'ordonnance': action = R() < .7 ? 'info' : 'a_rappeler'; break;
        case 'resultats': action = R() < .5 ? 'transfere' : 'a_rappeler'; break;
        case 'urgence': action = 'transfere'; break;
        default: action = 'a_rappeler';
      }
      const urgent = motif === 'urgence';
      const c = {id:'a' + appels.length, date: iso(day, t), patientId: p ? p.id : null,
        appelant: p ? '' : `${pick(PRENOMS)} ${pick(NOMS)}`, tel: p ? p.tel : `02 61 91 ${pad(10 + Math.floor(R()*90))} ${pad(Math.floor(R()*100))}`,
        medecinId:m, motif, action, urgent, duree: 40 + Math.floor(R()*170), resume: d >= -14 ? resumeFor(motif, action, p, m) : '', traitement:null};
      if ((action === 'a_rappeler' || urgent) && (d < 0 || urgent || R() < .45)){
        const res = urgent ? 'transfere' : wpick([['rappele',5],['rdv_pris',3],['messagerie',1],['cloture',2]]);
        c.traitement = {resultat: res, par: pick(['s1','s2','a1']), date: iso(day, Math.min(20*60, t + 10 + Math.floor(R()*90))), note: res === 'messagerie' ? 'Message laissé.' : ''};
      }
      appels.push(c);
    }
  }
  const urgentToday = appels.find(a => a.date.slice(0, 10) && ymd(new Date(a.date)) === T && a.motif === 'rdv' && a.action === 'rdv_pris');
  if (urgentToday){ Object.assign(urgentToday, {motif:'urgence', action:'transfere', urgent:true, resume: resumeFor('urgence'), traitement:null}); }
  appels.sort((x, y) => x.date.localeCompare(y.date));

  /* Demandes patients */
  const DEM_RESUMES = {
    ordonnance:['Demande le renouvellement de son traitement habituel. Dernière consultation il y a 3 mois.','Demande le renouvellement d’une ordonnance arrivée à échéance.'],

    administratif:['Signale un changement de mutuelle et d’adresse.','Demande une facture pour sa mutuelle.','Demande une attestation de présence pour son employeur.'],
    autre:['Demande si le cabinet accepte de nouveaux patients.','Question sur l’accès au cabinet pendant les travaux de la rue.'],
  };
  const demandes = [];
  for (let i = 0; i < 26; i++){
    const age = Math.floor(R()*12);
    const day = addDays(today, -age);
    const type = wpick([['ordonnance',8],['rdv',5],['resultats',4],['administratif',5],['autre',3]]);
    const p = pick(patients);
    let statut = age > 5 ? 'traitee' : age > 2 ? wpick([['traitee',4],['en_cours',2]]) : wpick([['nouvelle',5],['en_cours',2],['a_valider',2]]);
    if (DEM_MEDICAL.has(type) && statut === 'en_cours') statut = 'a_valider';
    const d = {id:'d' + i, date: iso(day, 7*60 + Math.floor(R()*12*60)), patientId:p.id, medecinId:p.medecinId,
      canal: wpick([['email',4],['formulaire',3],['telephone',3],['sms',1]]), type,
      priorite: type === 'rdv' && R() < .4 ? 'haute' : type === 'administratif' ? 'basse' : 'normale', statut,
      resume: pick(DEM_RESUMES[type]), assigneId: DEM_MEDICAL.has(type) && statut !== 'nouvelle' ? p.medecinId : pick(['s1','s2']),
      corrige: R() < .12, reponse:null};
    d.brouillon = draftFor(d, p);
    if (statut === 'traitee') d.reponse = {date: iso(day, 18*60), par: pick(['s1','s2']), texte: d.brouillon};
    demandes.push(d);
  }
  demandes.sort((x, y) => y.date.localeCompare(x.date));

  /* Comptes rendus préparés à partir des transcriptions */
  const crs = [];
  const prevWork = (() => { let x = addDays(today, -1); while (!isWeekday(x)) x = addDays(x, -1); return ymd(x); })();
  for (const r of rdv){
    if (r.statut !== 'honore' || r.date < ymd(addDays(today, -10)) || R() > .4) continue;
    const recent = r.date >= prevWork;
    const statut = recent && R() < .3 ? 'a_valider' : 'valide';
    const p = patients.find(x => x.id === r.patientId);
    crs.push({id:'cr' + crs.length, rdvId:r.id, patientId:r.patientId, medecinId:r.medecinId, date:r.date, time:r.time, type:r.type,
      duree: 8 + Math.floor(R()*14), statut, modifie: statut === 'valide' && R() < .35, delai: pick(['trois mois','six mois','un mois','un an']),
      texte: crTemplate(r, p, types)});
  }
  crs.forEach(c => { c.texte = c.texte.replace('{delai}', c.delai); });

  /* Documents */
  const DOC_TITLES = {
    'Courrier de confrère':['Courrier du Dr Roux (cardiologie)','Courrier du Dr Vidal (rhumatologie)','Courrier du service ORL du CHU'],
    'Résultats de laboratoire':['Résultats Biolab Tours Centre','Résultats laboratoire Loire Analyses'],
    'Compte rendu d’imagerie':['Compte rendu Imagerie des Halles','Compte rendu Centre d’imagerie Saint-Gatien'],
    'Compte rendu hospitalier':['Compte rendu de sortie, clinique de l’Alliance'],
    'Certificat à signer':['Certificat d’aptitude au sport (préparé)','Certificat de présence (préparé)'],
    'Courrier à signer':['Courrier d’adressage (préparé)','Réponse au Dr Roux (préparée)'],
    'Administratif':['Attestation de mutuelle','Formulaire de déclaration de médecin traitant'],
  };
  const documents = [];
  for (let i = 0; i < 30; i++){
    const age = Math.floor(R()*15);
    const type = pick(DOC_TYPES);
    const p = pick(patients);
    const sign = DOC_A_SIGNER.has(type);
    let statut = 'archive';
    if (!sign && age <= 1 && R() < .8) statut = 'a_traiter';
    else if (sign && age <= 4) statut = 'a_signer';
    documents.push({id:'f' + i, date: iso(addDays(today, -age), 7*60 + Math.floor(R()*11*60)), titre: pick(DOC_TITLES[type]),
      source: sign ? 'interne' : pick(DOC_SOURCES.slice(0, 3)).k, patientId:p.id, type, medecinId:p.medecinId,
      statut, confiance: 72 + Math.floor(R()*27), corrige: R() < .1, ia: !sign});
  }
  documents.sort((x, y) => y.date.localeCompare(x.date));

  /* Tâches de l’équipe */
  const dd = n => ymd(addDays(today, n));
  const call = appels.filter(a => ymd(new Date(a.date)) === T && a.action === 'a_rappeler' && !a.traitement)[0];
  const taches = [
    {titre:'Commander les vaccins pour la semaine prochaine', resp:'a1', ech:dd(1), prio:'haute', statut:'a_faire'},
    {titre:'Relancer le laboratoire pour des résultats manquants', resp:'s1', ech:dd(0), prio:'normale', statut:'en_cours'},
    {titre:'Mettre à jour les horaires sur la page du cabinet', resp:'s2', ech:dd(3), prio:'basse', statut:'a_faire'},
    {titre:'Préparer le planning des remplacements de novembre', resp:'g1', ech:dd(5), prio:'normale', statut:'en_cours'},
    {titre:'Vérifier le stock de fournitures de soins', resp:'a1', ech:dd(-1), prio:'normale', statut:'a_faire'},
    {titre:'Signer les certificats préparés', resp:'m1', ech:dd(0), prio:'haute', statut:'a_faire'},
    {titre:'Relire les modèles de réponses du secrétariat IA', resp:'g1', ech:dd(7), prio:'basse', statut:'attente'},
    {titre:'Contacter la mutuelle au sujet d’une facture rejetée', resp:'s2', ech:dd(-2), prio:'normale', statut:'attente'},
    {titre:'Rappeler les patients absents de la semaine dernière', resp:'s1', ech:dd(1), prio:'normale', statut:'a_faire', ia:true},
    {titre:'Valider les comptes rendus en attente', resp:'m3', ech:dd(0), prio:'haute', statut:'a_faire', ia:true},
    {titre:'Organiser la maintenance du réfrigérateur à vaccins', resp:'g1', ech:dd(-5), prio:'normale', statut:'termine'},
    {titre:'Former Laura au nouveau module de rappels', resp:'s1', ech:dd(-3), prio:'basse', statut:'termine'},
    {titre:'Mettre à jour la liste d’attente pédiatrie', resp:'m2', ech:dd(2), prio:'normale', statut:'en_cours'},
  ];
  if (call) taches.unshift({titre:`Rappeler ${call.patientId ? patients.find(p => p.id === call.patientId).prenom + ' ' + patients.find(p => p.id === call.patientId).nom : call.appelant} (appel du matin)`, resp:'s1', ech:dd(0), prio:'haute', statut:'a_faire', ia:true});
  const tachesF = taches.map((t, i) => ({id:'tk' + i, titre:t.titre, desc:'', responsableId:t.resp, echeance:t.ech, priorite:t.prio, statut:t.statut, ia:!!t.ia, createdAt:addDays(today, -3).toISOString()}));

  /* Liste d’attente */
  const attente = [];
  for (let i = 0; i < 7; i++){
    const p = pick(patients);
    if (attente.some(a => a.patientId === p.id)) continue;
    attente.push({id:'w' + i, patientId:p.id, medecinId:p.medecinId, souhait: pick(['Dès que possible','Plutôt le matin','Plutôt en fin de journée','N’importe quel jour']), ajouteLe: addDays(today, -Math.floor(R()*10)).toISOString(), statut:'en_attente'});
  }

  /* Journal d’accès */
  const journal = [];
  const acts = [['s1','Connexion au profil secrétaire'],['m1','Validation de 3 comptes rendus'],['s2','Connexion au profil secrétaire'],['g1','Export CSV des patients'],['m3','Signature de 2 documents'],['g1','Modification des horaires du secrétariat IA'],['a1','Connexion au profil secrétaire'],['m2','Connexion au profil médecin'],['s1','Traitement de 6 rappels patients']];
  for (let i = 0; i < 16; i++){ const [u, a] = acts[i % acts.length]; journal.push({date: iso(addDays(today, -Math.floor(i / 5)), 8*60 + Math.floor(R()*9*60)), userId:u, action:a}); }
  journal.sort((x, y) => y.date.localeCompare(x.date));

  return {team: structuredClone(SAMPLE_TEAM), absences, patients, rdv, appels, demandes, crs, documents, taches: tachesF, attente, journal, rappelsDepuis};
}

function draftFor(d, p){
  const tid = {ordonnance:'t11', resultats:'t12', administratif:'t13', rdv:'t5'}[d.type];
  const base = tid ? (DEFAULT_TEMPLATES.find(t => t.id === tid) || {}).texte : `Bonjour {patient}, merci pour votre message. [Réponse à compléter]. Le secrétariat reste à votre disposition au {telephone}.`;
  const v = {patient: p ? `${p.prenom} ${p.nom}` : '', medecin: (SAMPLE_TEAM.find(t => t.id === d.medecinId) || {nom:'le médecin'}).nom,
    cabinet: DEFAULT_SETTINGS.cabinet, telephone: DEFAULT_SETTINGS.telephone, date:'[date]', heure:'[heure]'};
  return (base || '').replace(/\{(\w+)\}/g, (m, k) => v[k] ?? m);
}
const OBJETS = {consult:'une consultation', suivi:'le suivi prévu', premiere:'une première consultation', pedia:'la consultation de mon enfant', vaccin:'le vaccin prévu', dermato:'un contrôle dermatologique', acte:'l’acte prévu'};
function crTemplate(r, p, types){
  const t = (types || {})[r.type] || {l: r.type};

Patient : ${p ? p.prenom + ' ' + p.nom : '—'}${p ? `, né(e) en ${p.naissance}` : ''}
Date : ${r.date.split('-').reverse().join('/')}

Motif : ${OBJETS[r.type] || 'consultation'}.
Échanges : [à compléter par le médecin à partir de la transcription]

let state;
function freshState(){
  return Object.assign({
    version:3, settings: structuredClone(DEFAULT_SETTINGS), types: structuredClone(DEFAULT_TYPES),
    templates: structuredClone(DEFAULT_TEMPLATES), automations: structuredClone(DEFAULT_AUTOMATIONS),
  }, buildSample());
}
function load(){
  // Premier chargement après la transformation : les anciennes données de prospection sont effacées.
  try { OLD_KEYS.forEach(k => localStorage.removeItem(k)); } catch (e) {}
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      s.settings = Object.assign(structuredClone(DEFAULT_SETTINGS), s.settings || {});
      s.settings.minutes = Object.assign(structuredClone(DEFAULT_SETTINGS.minutes), s.settings.minutes || {});
      s.settings.ia = Object.assign(structuredClone(DEFAULT_SETTINGS.ia), s.settings.ia || {});
      for (const k of ['team','absences','patients','rdv','appels','demandes','crs','documents','taches','attente','journal']) s[k] = s[k] || [];
      s.types = s.types || structuredClone(DEFAULT_TYPES);
      s.templates = s.templates || structuredClone(DEFAULT_TEMPLATES);
      s.automations = s.automations || structuredClone(DEFAULT_AUTOMATIONS);
      state = s; return;
    }
  } catch (e) { console.warn('Lecture impossible, données réinitialisées', e); }
  state = freshState(); persist();
}
let saveTimer = null;
function persist(){

}
function save(){ clearTimeout(saveTimer); setSaveState('Enregistrement…'); saveTimer = setTimeout(persist, 300); }

function logAccess(action){ state.journal.unshift({date:new Date().toISOString(), userId: currentUserId(), action}); state.journal.length = Math.min(state.journal.length, 300); }

const member = id => state.team.find(t => t.id === id);
const memberName = id => (member(id) || {nom:'—'}).nom;

const nowHM = () => { const n = new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; };
function nextRdv(id){ const t = todayStr(), n = nowHM(); return rdvOfPatient(id).find(r => r.statut === 'prevu' && (r.date > t || (r.date === t && r.time >= n))); }
function lastRdv(id){ return rdvOfPatient(id).filter(r => r.statut === 'honore').pop(); }
const callDay = a => ymd(new Date(a.date));

/* Créneaux occupés et libres (les rendez-vous de 40 minutes couvrent deux créneaux) */
function coveredSlots(date, m, exceptId){
  const out = new Map();
  for (const r of state.rdv){
    if (r.date !== date || r.medecinId !== m || r.statut === 'annule' || r.id === exceptId) continue;
    const st = minutesOf(r.time), d = ctype(r.type).duree || SLOT;
    for (let x = st; x < st + d; x += SLOT) out.set(x, r);
  }
  return out;
}
function freeSlots(date, m, duree=SLOT, exceptId){
  if (isAbsent(m, date) || !isWeekday(parseYmd(date))) return [];
  const cov = coveredSlots(date, m, exceptId), t = todayStr(), n = minutesOf(nowHM());
  return SLOTS.filter((s, i) => {
    if (date < t || (date === t && s <= n)) return false;
    for (let x = s, j = i; x < s + duree; x += SLOT, j++){ if (cov.has(x) || SLOTS[j] !== x || !sameBlock(s, x)) return false; }
    return true;
  }).map(hm);
}
function capacity(from, to, m){
  let n = 0;
  for (let d = parseYmd(from); ymd(d) <= to; d = addDays(d, 1)){
    if (!isWeekday(d)) continue;
    for (const doc of (m ? [member(m)] : medecins())) if (doc && !isAbsent(doc.id, ymd(d))) n += SLOTS.length;
  }
  return n;
}
function remplissage(from, to, m){
  const used = state.rdv.filter(r => r.date >= from && r.date <= to && r.statut !== 'annule' && (!m || r.medecinId === m)).reduce((s, r) => s + (ctype(r.type).duree || SLOT) / SLOT, 0);
  const cap = capacity(from, to, m);
  return cap ? Math.min(100, Math.round(used / cap * 100)) : 0;
}
function absenceRate(from, to, m){
  const past = state.rdv.filter(r => r.date >= from && r.date <= to && (r.statut === 'honore' || r.statut === 'absent') && (!m || r.medecinId === m));
  return past.length ? past.filter(r => r.statut === 'absent').length / past.length * 100 : 0;
}
function delaiMoyen(from, to, m){
  const list = state.rdv.filter(r => r.createdAt && r.createdAt >= from && r.createdAt <= to && r.statut !== 'annule' && (!m || r.medecinId === m));
  return list.length ? list.reduce((s, r) => s + Math.max(0, dayDiff(r.date, r.createdAt)), 0) / list.length : 0;
}
function chiffreAffaires(from, to, filter=() => true){
  return state.rdv.filter(r => r.date >= from && r.date <= to && r.statut === 'honore' && filter(r)).reduce((s, r) => s + (+ctype(r.type).tarif || 0), 0);
}

/* Temps et revenus gagnés grâce à l’IA, calculés sur les données réelles de la période */
function autoMetrics(from, to){
  const mn = state.settings.minutes;
  const inP = d => d >= from && d <= to;
  const appels = state.appels.filter(a => inP(callDay(a)));
  const resolus = appels.filter(a => RESOLU_IA.has(a.action) && !a.urgent);
  const rappels = state.rdv.filter(r => inP(r.date) && r.rp);
  const dem = state.demandes.filter(d => inP(ymd(new Date(d.date))));
  const crs = state.crs.filter(c => inP(c.date));
  const crsV = crs.filter(c => c.statut === 'valide');
  const docs = state.documents.filter(d => d.ia && inP(ymd(new Date(d.date))));
  const att = state.attente.filter(a => a.statut === 'planifie' && a.planifieLe && inP(ymd(new Date(a.planifieLe))));
  return {
    secretariat:{volume:appels.length, unite:'appels', reprise: pct(appels.length - resolus.length, appels.length), min: resolus.length * mn.appel},
    rappels:{volume:rappels.length, unite:'rappels', reprise: pct(rappels.filter(r => r.rp.s === 'annule').length, rappels.length), min: rappels.length * mn.rappel},
    attente:{volume:att.length, unite:'créneaux reproposés', reprise: att.length ? 100 : 0, min: att.length * 5},
    tri:{volume:dem.length, unite:'demandes', reprise: pct(dem.filter(d => d.corrige).length, dem.length), min: dem.length * mn.demande},
    transcription:{volume:crs.length, unite:'comptes rendus', reprise: pct(crsV.filter(c => c.modifie).length, crsV.length), min: crs.length * mn.cr},
    documents:{volume:docs.length, unite:'documents', reprise: pct(docs.filter(d => d.corrige).length, docs.length), min: docs.length * mn.document},
    _resolus: resolus.length, _appels: appels.length,
  };
}
function gainsIA(from, to){
  const s = state.settings, am = autoMetrics(from, to);
  const inP = d => d >= from && d <= to;
  const horsHoraires = state.appels.filter(a => inP(callDay(a)) && a.action === 'rdv_pris' && (() => { const d = new Date(a.date), m = d.getHours()*60 + d.getMinutes(); return d.getDay() === 0 || d.getDay() === 6 || m < 8*60+30 || (m >= 12*60+30 && m < 14*60) || m >= 19*60; })()).length;
  const parts = [
    {l:'Appels résolus par le secrétariat IA', n: am._resolus, min: am.secretariat.min},
    {l:'Rappels de rendez-vous envoyés', n: am.rappels.volume, min: am.rappels.min},
    {l:'Demandes triées, brouillons préparés', n: am.tri.volume, min: am.tri.min},
    {l:'Comptes rendus préparés', n: am.transcription.volume, min: am.transcription.min},
    {l:'Documents classés', n: am.documents.volume, min: am.documents.min},
    {l:'Créneaux libérés reproposés', n: am.attente.volume, min: am.attente.min},
  ];
  const heures = parts.reduce((x, p) => x + p.min, 0) / 60;
  const fromRp = from < state.rappelsDepuis ? state.rappelsDepuis : from;
  const passes = state.rdv.filter(r => r.date >= fromRp && r.date <= to && (r.statut === 'honore' || r.statut === 'absent')).length;
  const tauxActuel = absenceRate(fromRp, to);
  const absencesEvitees = Math.max(0, passes * (s.tauxAbsenceAvant - tauxActuel) / 100);
  const consultsRecup = absencesEvitees + horsHoraires + am.attente.volume;
  const valTemps = heures * s.coutHoraire;
  const valConsults = consultsRecup * s.valeurConsult;
  const prix = s.prixIA * (dayDiff(to, from) + 1) / 30.4;
  const total = valTemps + valConsults;
  return {parts, heures, valTemps, absencesEvitees, horsHoraires, consultsRecup, valConsults, total, tauxActuel, prix, multiple: prix ? total / prix : 0, appels: am._appels, resolus: am._resolus};
}

/* Variables des modèles de réponses */
function tplVars(ctx={}){

  let t = esc(text);
  t = t.replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? `<span class="v">${esc(vars[k])}</span>` : m);
  return t.replace(/\[([^\]]+)\]/g, '<span class="ph">[$1]</span>');
}
const plainVars = (text, vars) => String(text).replace(/\{(\w+)\}/g, (m, k) => vars[k] ?? m);

/* Créneaux libérés (annulations à venir non remplacées) */
function creneauxLiberes(){
  const t = todayStr(), n = nowHM();
  const seen = new Set();
  return state.rdv.filter(r => r.statut === 'annule' && (r.date > t || (r.date === t && r.time > n)))
    .filter(r => { const k = r.date + r.time + r.medecinId; if (seen.has(k)) return false; seen.add(k); return !coveredSlots(r.date, r.medecinId).has(minutesOf(r.time)) && !isAbsent(r.medecinId, r.date); })
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}
const suggestionAttente = r => state.attente.filter(a => a.statut === 'en_attente' && a.medecinId === r.medecinId).sort((a, b) => a.ajouteLe.localeCompare(b.ajouteLe))[0];

/* Alertes pour le gérant */
function alertes(){
  const out = [], t = todayStr();
  const urg = appelsATraiter().filter(a => a.urgent);
  if (urg.length) out.push({c:'red', t:`${urg.length} appel${urg.length > 1 ? 's' : ''} urgent${urg.length > 1 ? 's' : ''} à prendre en charge`, href:'#/secretariat'});
  const old = appelsATraiter().filter(a => !a.urgent && (Date.now() - new Date(a.date)) > 3*3600e3);
  if (old.length) out.push({c:'amber', t:`${old.length} rappel${old.length > 1 ? 's' : ''} patient en attente depuis plus de 3 h`, href:'#/secretariat'});
  const demH = state.demandes.filter(d => d.priorite === 'haute' && d.statut !== 'traitee');
  if (demH.length) out.push({c:'red', t:`${demH.length} demande${demH.length > 1 ? 's' : ''} prioritaire${demH.length > 1 ? 's' : ''} non traitée${demH.length > 1 ? 's' : ''}`, href:'#/demandes'});
  const crOld = state.crs.filter(c => c.statut === 'a_valider' && dayDiff(t, c.date) >= 1);
  if (crOld.length) out.push({c:'amber', t:`${crOld.length} compte${crOld.length > 1 ? 's' : ''} rendu${crOld.length > 1 ? 's' : ''} en attente de validation depuis la veille`, href:'#/parametres'});
  const lib = creneauxLiberes().filter(r => dayDiff(r.date, t) <= 2);
  if (lib.length) out.push({c:'blue', t:`${lib.length} créneau${lib.length > 1 ? 'x' : ''} libéré${lib.length > 1 ? 's' : ''} dans les 48 h, à reproposer`, href:'#/rappels'});
  const late = state.taches.filter(x => x.statut !== 'termine' && x.echeance < t);
  if (late.length) out.push({c:'amber', t:`${late.length} tâche${late.length > 1 ? 's' : ''} en retard`, href:'#/taches'});
  const ms = ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
  const abs = absenceRate(ms, t);
  if (abs > 5) out.push({c:'amber', t:`Taux de rendez-vous non honorés à ${fmtNum(abs, 1)} % ce mois`, href:'#/activite'});
  state.absences.filter(a => a.to >= t && dayDiff(a.from, t) <= 7).forEach(a => out.push({c:'gray', t:`${memberName(a.memberId)} absent${a.from === a.to ? ` le ${fmtDate(a.from)}` : ` du ${fmtDate(a.from)} au ${fmtDate(a.to)}`} (${a.motif.toLowerCase()})`, href:'#/parametres'}));
  state.automations.filter(a => !a.actif).forEach(a => out.push({c:'gray', t:`Automatisation désactivée : ${a.nom}`, href:'#/automatisations'}));
  return out;
}

/* Graphique : consultations et appels sur 7 jours */
function chartCard(){
  return `<div class="card">
      <div class="card-head"><h2>Consultations et appels sur 7 jours</h2>
        <div class="legend"><span><i style="background:var(--series-1)"></i>Consultations</span><span><i style="background:var(--series-2)"></i>Appels traités par l’IA</span></div></div>
      ${chart7days()}
    </div>`;
}
function chart7days(){
  const days = [];
  for (let i = 6; i >= 0; i--) days.push(ymd(addDays(new Date(), -i)));
  const data = days.map(d => ({d,
    a: state.rdv.filter(r => r.date === d && (r.statut === 'honore' || r.statut === 'prevu')).length,
    b: state.appels.filter(k => callDay(k) === d).length}));
  const max = Math.max(4, ...data.map(x => Math.max(x.a, x.b)));
  const step = max <= 10 ? 2 : max <= 25 ? 5 : max <= 60 ? 10 : 20;
  const top = Math.ceil(max / step) * step;
  const W = 720, H = 220, L = 30, B = 26, T = 10;
  const cw = (W - L) / 7, bw = Math.min(26, cw * .28);
  const y = v => T + (H - T - B) * (1 - v / top);
  let svg = '';
  for (let v = 0; v <= top; v += step) svg += `<line class="grid-l" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const bar = (x, v, color) => {
    if (!v) return '';
    const y0 = y(0), y1 = y(v), r = Math.min(4, (y0 - y1) / 2, bw / 2);
    return `<path d="M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 + r} V${y0} Z" fill="${color}"/>`;
  };
  data.forEach((p, i) => {
    const cx = L + cw * i + cw / 2;
    const dd = parseYmd(p.d);
    svg += `<g data-tip="${esc(`${fmtDate(p.d)} · ${plural(p.a, 'consultation')} · ${plural(p.b, 'appel')} traités par l’IA`)}">
      <rect x="${L + cw * i}" y="${T}" width="${cw}" height="${H - T - B}" fill="transparent"/>
      ${bar(cx - bw - 1, p.a, 'var(--series-1)')}${bar(cx + 1, p.b, 'var(--series-2)')}
      <text x="${cx}" y="${H - 8}" text-anchor="middle" style="${i === 6 ? 'fill:var(--text);font-weight:600' : ''}">${JOURS[dd.getDay()]} ${dd.getDate()}</text></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Consultations et appels sur 7 jours">${svg}</svg>`;
}

/* Barres horizontales */
function hbars(rows, opt={}){
  const max = Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `<div class="hbar" data-tip="${esc(r.tip || `${r.l} : ${r.v}`)}"><span class="lbl" title="${esc(r.l)}">${esc(r.l)}</span>
    <span class="track"><span class="fill" style="width:${Math.min(100, opt.scale100 ? r.v : r.v / max * 100)}%;${r.hi ? 'background:var(--series-2)' : ''}"></span></span>
    <span class="val">${r.display ?? r.v}</span></div>`).join('') || '<div class="empty">Pas encore de données.</div>';
}

function patientIndex(){
  const t = todayStr(), n = nowHM();
  const idx = {};
  for (const p of state.patients) idx[p.id] = {last:null, next:null, ech:0};
  for (const r of state.rdv){
    const x = idx[r.patientId]; if (!x) continue;
    if (r.statut === 'honore' && (!x.last || r.date + r.time > x.last.date + x.last.time)) x.last = r;
    if (r.statut === 'prevu' && (r.date > t || (r.date === t && r.time >= n)) && (!x.next || r.date + r.time < x.next.date + x.next.time)) x.next = r;
  }
  for (const a of state.appels) if (idx[a.patientId]) idx[a.patientId].ech++;
  for (const d of state.demandes) if (idx[d.patientId]) idx[d.patientId].ech++;
  for (const d of state.documents) if (idx[d.patientId]) idx[d.patientId].ech++;
  return idx;
}
function filteredPatients(idx){
  const f = ui.pf, q = norm(f.q);
  const sixMonths = ymd(addDays(new Date(), -182));
  let list = state.patients.filter(p =>
    (!q || norm([p.prenom, p.nom, p.tel, p.email, p.ville].join(' ')).includes(q)) &&
    (!f.medecin || p.medecinId === f.medecin) && (!f.ville || p.ville === f.ville) &&
    (!f.rdv || (f.rdv === 'avec' ? idx[p.id].next : !idx[p.id].next && (!idx[p.id].last || idx[p.id].last.date < sixMonths))));
  const {key, dir} = ui.sort;
  const val = p => key === 'medecin' ? memberName(p.medecinId) : key === 'last' ? (idx[p.id].last ? idx[p.id].last.date : '') :
    key === 'next' ? (idx[p.id].next ? idx[p.id].next.date + idx[p.id].next.time : '9999') : key === 'ech' ? idx[p.id].ech :
    key === 'naissance' ? +p.naissance : norm(p.nom + ' ' + p.prenom);
  list.sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
  return list;
}

const defaultType = m => ({m1:'consult', m2:'pedia', m3:'dermato'}[m] && state.types.some(t => t.k === {m1:'consult', m2:'pedia', m3:'dermato'}[m]) ? {m1:'consult', m2:'pedia', m3:'dermato'}[m] : (state.types[0] || {}).k);
function nextOpenDate(date, m, duree){
  let d = parseYmd(date);
  for (let i = 0; i < 30; i++){ if (freeSlots(ymd(d), m, duree).length) return ymd(d); d = addDays(d, 1); }

}

/* Création ou déplacement d’un rendez-vous */
function rdvForm(pre={}){

  $('#rdvForm').onsubmit = e => {
    e.preventDefault();

    if (ed){
      Object.assign(ed, {medecinId:$('#rf_m').value, date:$('#rf_d').value, time:$('#rf_t').value, rp:null});
      save(); closeModal(); toast(`Rendez-vous déplacé au ${fmtDate(ed.date)} à ${hFmt(ed.time)}`); render(); return;
    }
    const r = {id:uid(), patientId:$('#rf_p').value, medecinId:$('#rf_m').value, date:$('#rf_d').value, time:$('#rf_t').value, type:$('#rf_type').value, statut:'prevu', source: pre.source || 'secretariat', createdAt: todayStr(), rp:null};
    state.rdv.push(r);

    save(); closeModal(); toast(`Rendez-vous enregistré : ${fmtDate(r.date)} à ${hFmt(r.time)}`); render();
  };
}

<script>
/* ==========================================================================
   Agenda des rendez-vous : vue jour et semaine par praticien
   ========================================================================== */
function typeLegend(){
  return `<div class="type-legend">${state.types.map(t => `<span><i style="background:var(--c-${t.c})"></i>${esc(t.l)}</span>`).join('')}<span>${aiBadge('Rendez-vous pris par le secrétariat IA')} pris par l’IA</span></div>`;
}
function viewAgenda(){
  if (ui.agendaMed == null) ui.agendaMed = role() === 'medecin' ? state.settings.medecinId : '';
  if (ui.agendaView === 'semaine' && !ui.agendaMed) ui.agendaMed = (medecins()[0] || {}).id;
  const date = ui.agendaDate || todayStr();
  const t = todayStr();
  const week = ui.agendaView === 'semaine';
  const ws = startOfWeek(parseYmd(date));
  const title = week ? `Semaine du ${ws.getDate()} ${MOIS[ws.getMonth()]} au ${addDays(ws, 4).getDate()} ${MOIS[addDays(ws, 4).getMonth()]}` : fmtDate(date).replace(/^\w/, c => c.toUpperCase()) + (date === t ? ' · aujourd’hui' : '');
  const shown = medecins().filter(m => !ui.agendaMed || m.id === ui.agendaMed);
  const nb = week ? state.rdv.filter(r => r.medecinId === ui.agendaMed && r.date >= ymd(ws) && r.date <= ymd(addDays(ws, 4)) && r.statut !== 'annule').length
    : rdvDay(date).filter(r => shown.some(m => m.id === r.medecinId) && r.statut !== 'annule').length;
  return `<div class="page wide" style="max-width:1400px">
    <div class="page-head"><div><h1>Agenda</h1><p>${title} · ${plural(nb, 'rendez-vous', 'rendez-vous')}</p></div>
      <div class="btn-row">
        <div class="seg">${[['jour','Jour'],['semaine','Semaine']].map(([k, l]) => `<button class="${ui.agendaView === k ? 'on' : ''}" data-act="agendaView" data-k="${k}">${l}</button>`).join('')}</div>
        <div class="btn-row" style="gap:4px"><button class="btn icon" data-act="agendaDay" data-d="-1" aria-label="Précédent">${icon('arrowL')}</button>
          <button class="btn" data-act="agendaDay" data-d="0">Aujourd’hui</button>
          <button class="btn icon" data-act="agendaDay" data-d="1" aria-label="Suivant">${icon('arrowR')}</button></div>
        <input class="input" type="date" id="agendaPick" value="${date}" style="width:auto">
        <button class="btn primary" data-act="newRdv">${icon('plus')} Nouveau rendez-vous</button>
      </div></div>
    <div class="toolbar" style="justify-content:space-between">
      <div class="seg">${[...(week ? [] : [{id:'', nom:'Tous les praticiens'}]), ...medecins()].map(m => `<button class="${ui.agendaMed === m.id ? 'on' : ''}" data-act="agendaMed" data-k="${m.id}">${esc(m.id ? shortDoc(m.id) : m.nom)}</button>`).join('')}</div>
      ${typeLegend()}
    </div>
    ${week ? weekView(ws, ui.agendaMed) : `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${shown.map(m => dayColumn(date, m)).join('')}</div>`}
  </div>`;
}
function dayColumn(date, m){
  const t = todayStr(), n = minutesOf(nowHM());
  const abs = absenceOf(m.id, date);
  const list = rdvDay(date, m.id).filter(r => r.statut !== 'annule');
  const head = `<div class="card-head"><h2>${esc(m.nom)}</h2><span class="small faint">${list.length} RDV · ${remplissage(date, date, m.id)} %</span></div>`;
  if (!isWeekday(parseYmd(date))) return `<div class="card">${head}<div class="empty">Cabinet fermé.</div></div>`;
  if (abs) return `<div class="card">${head}<div class="empty">${icon('cal', 'style="width:18px;height:18px;display:block;margin:0 auto 6px"')}Absent : ${esc(abs.motif)}</div></div>`;
  const cov = coveredSlots(date, m.id);
  const cancelled = new Set(rdvDay(date, m.id).filter(r => r.statut === 'annule').map(r => r.time));
  let html = '', lunch = false;
  for (const s of SLOTS){
    if (!lunch && s >= 13*60){ lunch = true; html += `<div class="slot-row" style="justify-content:center"><span class="small faint">Pause déjeuner · 12 h 30 – 14 h</span></div>`; }
    const r = cov.get(s);
    const pastSlot = date < t || (date === t && s < n);
    if (r && r.time !== hm(s)) continue;
    if (!r){
      html += `<div class="slot-row ${pastSlot ? 'past' : ''}"><span class="bar" style="background:transparent"></span><span class="t">${hFmt(hm(s))}</span><div class="row-main faint">${cancelled.has(hm(s)) ? 'Libéré (annulation)' : 'Libre'}</div>
        ${pastSlot ? '' : `<button class="btn sm ghost" data-act="bookSlot" data-m="${m.id}" data-t="${hm(s)}" data-d="${date}">${icon('plus')} Réserver</button>`}</div>`;
      continue;
    }
    const p = patient(r.patientId), ty = ctype(r.type);
    html += `<div class="slot-row" style="cursor:pointer" data-act="openRdv" data-id="${r.id}">${typeBar(r.type)}<span class="t">${hFmt(r.time)}</span>
      <div class="row-main"><div class="row-title">${esc(pName(p))}</div><div class="row-sub">${esc(ty.l)}${ty.duree > SLOT ? ` · ${ty.duree} min` : ''}${r.rp ? ` · rappel ${lab(RAPPEL_STATUTS, r.rp.s).toLowerCase()}` : ''}</div></div>
      ${r.source === 'ia' || r.source === 'attente' ? aiBadge(r.source === 'ia' ? 'Rendez-vous pris par le secrétariat IA' : 'Créneau reproposé via la liste d’attente') : ''}
      ${r.statut === 'prevu' && pastSlot ? `<div class="btn-row" style="gap:4px"><button class="btn sm" data-act="rdvStatus" data-id="${r.id}" data-s="honore" title="Honoré">${icon('check')}</button><button class="btn sm" data-act="rdvStatus" data-id="${r.id}" data-s="absent" title="Non honoré">${icon('x')}</button></div>` : r.statut !== 'prevu' ? rdvPill(r) : ''}</div>`;
  }
  return `<div class="card">${head}${html}</div>`;
}
function weekView(ws, m){
  const t = todayStr(), n = minutesOf(nowHM());
  const days = [0, 1, 2, 3, 4].map(i => ymd(addDays(ws, i)));
  const covs = Object.fromEntries(days.map(d => [d, coveredSlots(d, m)]));
  let html = `<div class="wh"></div>` + days.map(d => { const dd = parseYmd(d); const abs = absenceOf(m, d);
    return `<div class="wh ${d === t ? 'today' : ''}">${JOURS[dd.getDay()]} ${dd.getDate()}${abs ? ` <span class="tag" style="font-weight:400">${esc(abs.motif)}</span>` : ''}</div>`; }).join('');
  let lunch = false;
  for (const s of SLOTS){
    if (!lunch && s >= 13*60){ lunch = true; html += `<div class="lunch">Pause déjeuner · 12 h 30 – 14 h</div>`; }
    html += `<div class="wt">${hFmt(hm(s))}</div>`;
    for (const d of days){
      if (isAbsent(m, d)){ html += `<div class="wc off"></div>`; continue; }
      const r = covs[d].get(s);
      const past = d < t || (d === t && s < n);
      if (!r){ html += past ? `<div class="wc"></div>` : `<div class="wc free" data-act="bookSlot" data-m="${m}" data-t="${hm(s)}" data-d="${d}" title="Réserver ${hFmt(hm(s))}"></div>`; continue; }
      const ty = ctype(r.type), first = r.time === hm(s);
      html += `<div class="wc"><div class="appt ${r.statut === 'absent' ? 'absent' : ''}" style="--ac:var(--c-${ty.c});--abg:var(--c-${ty.c}-bg)" data-act="openRdv" data-id="${r.id}" title="${esc(pName(patient(r.patientId)))} · ${esc(ty.l)}">
        ${first ? `<b>${esc(pName(patient(r.patientId)))}</b><span>${esc(ty.l.replace(/^Consultation (de |pédiatrique)?/, '') || ty.l)}${r.source === 'ia' ? ' ' + aiBadge() : ''}${r.statut === 'absent' ? ' · non honoré' : ''}</span>` : '<span>(suite)</span>'}</div></div>`;
    }
  }
  return `<div class="card week-wrap" style="padding:8px 12px 12px"><div class="week">${html}</div></div>`;
}

/* ==========================================================================
   Secrétariat IA : journal des appels et traitement humain des rappels
   ========================================================================== */
function secList(){
  const t = todayStr(), q = norm(ui.secQ);

  if (ui.secFilter === 'todo') list = appelsATraiter();
  else {
    const from = ui.secFilter === 'today' ? t : ymd(addDays(new Date(), -6));
    list = state.appels.filter(a => callDay(a) >= from).sort((a, b) => b.date.localeCompare(a.date));
  }
  if (q) list = list.filter(a => norm([callerName(a), a.tel, a.resume, lab(MOTIFS_APPEL, a.motif)].join(' ')).includes(q));
  return list;
}
function viewSecretariat(){
  const {arg} = route();

  return `<div class="page wide" style="max-width:1400px">
    <div class="call-head">
      <div class="call-id"><h1>Secrétariat IA ${on ? pill(state.settings.ia.horaires === '24h' ? 'Actif · décroche 24 h/24' : 'Actif · aux heures d’ouverture', 'green') : pill('Désactivé', 'gray')}</h1>
        <div class="call-meta">L’IA répond, prend les rendez-vous simples et rédige un résumé. Les rappels et les urgences sont traités par l’équipe.</div></div>
      <div class="kpi-mini">
        <div><div class="l">Appels aujourd’hui</div><div class="v">${today.length}</div></div>
        <div><div class="l">Résolus par l’IA</div><div class="v">${pct(today.filter(a => RESOLU_IA.has(a.action) && !a.urgent).length, today.length)} %</div></div>
        <div><div class="l">À traiter</div><div class="v">${todo.length}</div></div>
        <div><div class="l">Urgents</div><div class="v" style="${todo.some(a => a.urgent) ? 'color:var(--c-red)' : ''}">${todo.filter(a => a.urgent).length}</div></div>
      </div>
    </div>
    <div class="call-grid sec">
      <div class="card">
        <div class="toolbar" style="margin-bottom:10px">
          <div class="seg">${[['todo',`À traiter (${todo.length})`],['today','Aujourd’hui'],['week','7 jours']].map(([k, l]) => `<button class="${ui.secFilter === k ? 'on' : ''}" data-act="secFilter" data-k="${k}">${l}</button>`).join('')}</div>
          <div class="search" style="flex:1 1 160px">${icon('search')}<input class="input" id="secSearch" placeholder="Patient, motif, numéro…" value="${esc(ui.secQ)}"></div>
        </div>
        <div class="log-list" id="secList">${secListHtml(list)}</div>
      </div>
      <div class="card sticky-col" id="secDetail">${secDetail()}</div>
    </div>
    <div class="small faint" style="margin-top:14px">Raccourcis : 1 à 5 pour traiter l’appel sélectionné, Ctrl + Entrée pour enregistrer et passer au suivant.</div>
  </div>`;
}
function secListHtml(list){
  return list.slice(0, 200).map(a => `<div class="log-item ${a.id === ui.selCall ? 'sel' : ''} ${a.urgent ? 'urgent' : ''}" data-act="selCall" data-id="${a.id}">
      <div class="log-time">${fmtTimeAgo(a.date)}</div>
      <div class="row-main">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b style="font-weight:500">${esc(callerName(a))}</b>${a.urgent ? tagc('Urgent', 'red') : ''}${tagc(lab(ACTIONS_IA, a.action), col(ACTIONS_IA, a.action))}${a.traitement ? tagc('Traité', 'green') : ''}</div>
        <div class="row-sub">${esc(lab(MOTIFS_APPEL, a.motif))} · ${fmtDur(a.duree)}</div>
      </div></div>`).join('') || '<div class="empty">Aucun appel à afficher.</div>';
}
function secDetail(){
  const a = state.appels.find(x => x.id === ui.selCall);
  if (!a) return '<div class="empty">Sélectionnez un appel dans le journal.</div>';
  const p = patient(a.patientId);
  const tr = a.traitement;
  return `${a.urgent ? `<div class="urgent-banner">${icon('alert')}<div>Appel signalé comme potentiellement urgent. L’IA a donné la consigne d’appeler le 15 si besoin et a transféré l’appel. Une personne de l’équipe doit confirmer la prise en charge.</div></div>` : ''}
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <div><h2 style="font-size:17px">${p ? `<a href="#/patient/${p.id}" style="color:var(--text)">${esc(pName(p))}</a>` : esc(callerName(a)) + ' <span class="tag">Non identifié</span>'}</h2>
        <div class="muted small" style="margin-top:2px">${fmtDateTime(a.date)} · durée ${fmtDur(a.duree)}${p ? ` · ${esc(memberName(p.medecinId))}` : ''}</div></div>
      <a class="phone-big" style="font-size:18px" href="tel:${a.tel.replace(/\s/g, '')}">${icon('phone')}${esc(a.tel)}</a>
    </div>
    <div class="kv" style="margin-top:16px;row-gap:8px">
      <label>Motif détecté</label><div>${esc(lab(MOTIFS_APPEL, a.motif))} ${aiBadge('Motif détecté par l’IA')}</div>
      <label>Action de l’IA</label><div>${tagc(lab(ACTIONS_IA, a.action), col(ACTIONS_IA, a.action))}</div>
    </div>
    <div class="divider"></div>
    <p class="section-title">Résumé de l’appel ${aiBadge()}</p>
    <div class="tpl-text">${esc(a.resume || 'Résumé archivé : les résumés détaillés sont conservés 14 jours.')}</div>
    <div class="note-ia">${icon('shield')} Résumé rédigé par l’IA. À vérifier avant toute action.</div>
    <div class="divider"></div>
    ${tr ? `<p class="section-title">Traitement</p>
      <div class="row-item" style="padding-top:0"><span class="type-ic" style="background:var(--ok-soft);color:var(--ok)">${icon('check')}</span>
        <div class="row-main"><div class="row-title">${esc(lab(TRAITEMENTS, tr.resultat))}</div><div class="row-sub">${esc(memberName(tr.par))} · ${fmtDateTime(tr.date)}${tr.note ? ' · ' + esc(tr.note) : ''}</div></div>
        <button class="btn sm ghost" data-act="reopenCall" data-id="${a.id}">Rouvrir</button></div>`
    : `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><p class="section-title" style="margin:0">Traitement par l’équipe</p><button class="btn sm ghost" data-act="callTask" data-id="${a.id}">${icon('check2')} Créer une tâche</button></div>
      <div class="results" style="grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:0">${TRAITEMENTS.map(r => `<button class="res-btn ${r.cls || ''}" data-act="treat" data-res="${r.k}"><b>${r.l}</b><kbd>Touche ${r.key}</kbd></button>`).join('')}</div>`}`;
}
function openTreat(a, res){
  const p = patient(a.patientId);
  const needRdv = res === 'rdv_pris';
  const m = p ? p.medecinId : a.medecinId;
  const type = defaultType(m);
  const date = nextOpenDate(todayStr(), m, ctype(type).duree);
  openModal(`<form id="treatForm">
    <div class="modal-head"><div><h2>${esc(lab(TRAITEMENTS, res))}</h2><p>${esc(callerName(a))} · ${esc(lab(MOTIFS_APPEL, a.motif))}</p></div>
      <button type="button" class="btn ghost icon" data-act="closeModal" aria-label="Fermer">${icon('x')}</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="field full"><label for="tr_note">Note</label><textarea class="input" id="tr_note" rows="3" placeholder="Ce qui a été fait ou convenu (facultatif)"></textarea></div>
      <div class="field full"><label for="tr_par">Traité par</label><select class="input" id="tr_par">${teamOpts(role() === 'secretaire' ? state.settings.agentId : currentUserId())}</select></div>
      ${needRdv ? `
      <div class="field"><label for="tr_m">Praticien</label><select class="input" id="tr_m">${medOpts(m)}</select></div>
      <div class="field"><label for="tr_type">Type</label><select class="input" id="tr_type">${typeOpts(type)}</select></div>
      <div class="field"><label for="tr_d">Date</label><input class="input" type="date" id="tr_d" value="${date}" min="${todayStr()}"></div>
      <div class="field"><label for="tr_t">Créneau libre</label><select class="input" id="tr_t"></select></div>
      ${p ? '' : '<p class="small faint full" style="margin:0">Appelant non identifié : une fiche patient à compléter sera créée.</p>'}` : ''}
    </div></div>
    <div class="modal-foot"><span class="hint">Ctrl + Entrée : enregistrer et suivant</span>
      <button type="button" class="btn" data-act="saveTreat">Enregistrer</button>
      <button type="submit" class="btn primary">Enregistrer et passer au suivant ${icon('arrowR')}</button></div></form>`);
  if (needRdv){
    const fill = () => { const sl = freeSlots($('#tr_d').value, $('#tr_m').value, ctype($('#tr_type').value).duree); $('#tr_t').innerHTML = sl.length ? sl.map(s => `<option value="${s}">${hFmt(s)}</option>`).join('') : '<option value="">Aucun créneau libre</option>'; };
    $('#tr_d').onchange = fill; $('#tr_m').onchange = fill; $('#tr_type').onchange = fill; fill();
  }
  const f = $('#treatForm'); f.dataset.id = a.id; f.dataset.res = res;
  f.onsubmit = e => { e.preventDefault(); commitTreat(true); };
  $('#tr_note').focus();
}
function commitTreat(goNext){
  const f = $('#treatForm'); if (!f) return;
  const a = state.appels.find(x => x.id === f.dataset.id), res = f.dataset.res;
  const todoBefore = appelsATraiter().map(x => x.id);
  if (res === 'rdv_pris'){
    if (!$('#tr_t').value){ toast('Choisissez un créneau'); return; }
    let pid = a.patientId;
    if (!pid){
      const [prenom, ...rest] = (a.appelant || 'Patient Nouveau').split(' ');
      const np = Object.assign(newPatientObj(), {prenom, nom: rest.join(' ') || 'À compléter', tel:a.tel, medecinId:$('#tr_m').value, notes:'Fiche créée depuis le secrétariat IA, à compléter.'});
      state.patients.push(np); pid = np.id; a.patientId = pid;
    }
    state.rdv.push({id:uid(), patientId:pid, medecinId:$('#tr_m').value, date:$('#tr_d').value, time:$('#tr_t').value, type:$('#tr_type').value, statut:'prevu', source:'secretariat', createdAt:todayStr(), rp:null});
  }
  a.traitement = {resultat:res, par:$('#tr_par').value, date:new Date().toISOString(), note:$('#tr_note').value.trim()};
  save(); closeModal();
  if (goNext){
    const i = todoBefore.indexOf(a.id);
    const remaining = appelsATraiter();
    const nxt = remaining.find(x => todoBefore.indexOf(x.id) > i) || remaining[0];
    ui.secFilter = 'todo';
    ui.selCall = nxt ? nxt.id : null;
    toast(nxt ? `Enregistré · suivant : ${callerName(nxt)}` : 'Enregistré · plus aucun appel à traiter');
  } else toast('Traitement enregistré');
  if (route().arg) location.hash = '#/secretariat'; else render();
}

/* ==========================================================================
   Demandes patients : boîte de réception unifiée triée par l’IA
