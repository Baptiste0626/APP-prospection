function demList(){
  const m = myMedecin(), q = norm(ui.demQ);
  return state.demandes.filter(d =>
    (!m || d.medecinId === m) &&
    (ui.demFilter === 'all' || (m ? d.statut === 'a_valider' : d.statut !== 'traitee')) &&
    (!ui.demType || d.type === ui.demType) &&
    (!q || norm(pName(patient(d.patientId)) + ' ' + d.resume).includes(q)))
    .sort((a, b) => (a.priorite === 'haute' ? 0 : 1) - (b.priorite === 'haute' ? 0 : 1) || b.date.localeCompare(a.date));
}
function viewDemandes(){
  const {arg} = route();
  if (arg && state.demandes.some(d => d.id === arg)){ ui.selDem = arg; const d = state.demandes.find(x => x.id === arg); if (myMedecin() && d.statut !== 'a_valider') ui.demFilter = 'all'; }
  const list = demList();
  if (!ui.selDem || !state.demandes.some(d => d.id === ui.selDem)) ui.selDem = (list[0] || {}).id;
  const m = myMedecin();
  const nTodo = state.demandes.filter(d => (!m || d.medecinId === m) && (m ? d.statut === 'a_valider' : d.statut !== 'traitee')).length;
  return `<div class="page wide" style="max-width:1400px">
    <div class="page-head"><div><h1>Demandes patients</h1><p>Emails, formulaires, SMS et messages téléphoniques réunis, triés et résumés par l’IA ${aiBadge()}</p></div>
      <button class="btn" data-act="newDemande">${icon('plus')} Nouvelle demande</button></div>
    <div class="call-grid sec">
      <div class="card">
        <div class="toolbar" style="margin-bottom:10px">
          <div class="seg">${[['todo', `${m ? 'À valider' : 'À traiter'} (${nTodo})`],['all','Toutes']].map(([k, l]) => `<button class="${ui.demFilter === k ? 'on' : ''}" data-act="demFilter" data-k="${k}">${l}</button>`).join('')}</div>
          <div class="search" style="flex:1 1 160px">${icon('search')}<input class="input" id="demSearch" placeholder="Patient, contenu…" value="${esc(ui.demQ)}"></div>
        </div>
        <div class="chips" style="margin-bottom:10px">${[{k:'', l:'Tous types'}, ...DEM_TYPES].map(t => `<button class="chip ${ui.demType === t.k ? 'on' : ''}" data-act="demType" data-k="${t.k}">${t.l}</button>`).join('')}</div>
        <div class="log-list" id="demList">${demListHtml(list)}</div>
      </div>
      <div class="card sticky-col" id="demDetail">${demDetail()}</div>
    </div></div>`;
}
function demListHtml(list){
  return list.map(d => `<div class="log-item ${d.id === ui.selDem ? 'sel' : ''} ${d.priorite === 'haute' && d.statut !== 'traitee' ? 'urgent' : ''}" data-act="selDem" data-id="${d.id}">
      <div class="log-time" style="width:52px;font-weight:500">${fmtTimeAgo(d.date)}</div>
      <div class="row-main">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b style="font-weight:500">${esc(pName(patient(d.patientId)))}</b>${tagc(lab(DEM_TYPES, d.type), col(DEM_TYPES, d.type))}${d.statut !== 'nouvelle' ? tagc(lab(DEM_STATUTS, d.statut), col(DEM_STATUTS, d.statut)) : ''}</div>
        <div class="row-sub">${esc(d.resume)}</div>
      </div></div>`).join('') || '<div class="empty">Aucune demande à afficher.</div>';
}
function demDetail(){
  const d = state.demandes.find(x => x.id === ui.selDem);
  if (!d) return '<div class="empty">Sélectionnez une demande.</div>';
  const p = patient(d.patientId), medical = DEM_MEDICAL.has(d.type), isMed = role() === 'medecin';
  const done = d.statut === 'traitee';
  let actions = '';
  if (!done){
    if (medical && !isMed && d.statut !== 'a_valider') actions = `<button class="btn primary" data-act="demToDoctor">${icon('send')} Transmettre au médecin pour validation</button>`;
    else if (medical && !isMed) actions = `<span class="small muted">En attente de validation par ${esc(memberName(d.medecinId))}.</span>`;
    else actions = `<button class="btn primary" data-act="demSend">${icon('send')} ${isMed ? 'Valider et envoyer' : 'Envoyer la réponse'}</button>`;
    actions = `<button class="btn ghost" data-act="demClose">Clôturer sans réponse</button>` + actions;
  }
  return `<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
      <div><h2 style="font-size:17px"><a href="#/patient/${d.patientId}" style="color:var(--text)">${esc(pName(p))}</a></h2>
        <div class="muted small" style="margin-top:2px">${esc(lab(CANAUX, d.canal))} · reçue le ${fmtDateTime(d.date)}</div></div>
      ${pill(lab(DEM_STATUTS, d.statut), col(DEM_STATUTS, d.statut))}
    </div>
    <div class="divider"></div>
    <p class="section-title">Résumé de la demande ${aiBadge('Résumé et tri proposés par l’IA')}</p>
    <div class="tpl-text">${esc(d.resume)}</div>
    ${medical ? `<div class="note-ia">${icon('shield')} Demande médicale : la réponse doit être validée par le médecin.</div>` : ''}
    <div class="form-grid" style="margin-top:16px">
      <div class="field"><label>Type</label><select class="input" data-demf="type" ${done ? 'disabled' : ''}>${opts(DEM_TYPES, d.type)}</select></div>
      <div class="field"><label>Priorité</label><select class="input" data-demf="priorite" ${done ? 'disabled' : ''}>${opts(PRIORITES, d.priorite)}</select></div>
      <div class="field"><label>Assignée à</label><select class="input" data-demf="assigneId" ${done ? 'disabled' : ''}>${teamOpts(d.assigneId)}</select></div>
      <div class="field"><label>Statut</label><select class="input" data-demf="statut">${opts(DEM_STATUTS, d.statut)}</select></div>
    </div>
    <div class="divider"></div>
    ${done && d.reponse ? `<p class="section-title">Réponse envoyée</p><div class="draft">${esc(d.reponse.texte)}</div><div class="small faint" style="margin-top:6px">Envoyée par ${esc(memberName(d.reponse.par))} le ${fmtDateTime(d.reponse.date)} · ${esc(lab(CANAUX, d.canal === 'telephone' ? 'sms' : d.canal))}</div>`
    : done ? `<p class="small muted">Demande clôturée sans réponse écrite.</p>`
    : `<p class="section-title">Brouillon de réponse ${aiBadge('Brouillon proposé par l’IA, à relire avant envoi')}</p>
      <textarea class="input" id="demDraft" rows="7">${esc(d.brouillon || '')}</textarea>
      <div class="note-ia">${icon('shield')} Relisez et complétez le brouillon : rien n’est envoyé sans validation humaine.</div>
      <div class="btn-row" style="justify-content:flex-end;margin-top:14px">${actions}</div>`}`;
}

/* ==========================================================================
   Comptes rendus : transcription à gauche, compte rendu éditable à droite
   ========================================================================== */
function viewCR(){
  const m = state.settings.medecinId;
  const {arg} = route();
  const list = state.crs.filter(c => c.medecinId === m).sort((a, b) => (a.statut === 'a_valider' ? 0 : 1) - (b.statut === 'a_valider' ? 0 : 1) || (b.date + b.time).localeCompare(a.date + a.time)).slice(0, 60);
  if (arg && list.some(c => c.id === arg)) ui.selCr = arg;
  if (!ui.selCr || !list.some(c => c.id === ui.selCr)) ui.selCr = (list[0] || {}).id;
  const c = list.find(x => x.id === ui.selCr);
  const todo = list.filter(x => x.statut === 'a_valider');
  const i = list.indexOf(c);
  return `<div class="page wide" style="max-width:1400px">
    <div class="page-head"><div><h1>Comptes rendus</h1><p>${plural(todo.length, 'compte rendu', 'comptes rendus')} à valider · préparés à partir de la transcription de vos consultations ${aiBadge()}</p></div>
      ${c ? `<div class="btn-row">
        <button class="btn icon" data-act="crNav" data-d="-1" ${i <= 0 ? 'disabled' : ''} aria-label="Précédent">${icon('arrowL')}</button>
        <select class="input" id="crPick" style="width:auto;max-width:360px">${list.map(x => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''}>${x.statut === 'a_valider' ? '● ' : ''}${esc(pName(patient(x.patientId)))} · ${relDay(x.date)} ${hFmt(x.time)}${x.statut === 'valide' ? ' · validé' : ''}</option>`).join('')}</select>
        <button class="btn icon" data-act="crNav" data-d="1" ${i >= list.length - 1 ? 'disabled' : ''} aria-label="Suivant">${icon('arrowR')}</button></div>` : ''}
    </div>
    ${c ? `<div class="review">
      <div class="card">
        <div class="card-head"><h2>Transcription ${aiBadge('Transcription automatique de la consultation')}</h2><span class="small faint">${c.duree} min · ${fmtDate(c.date)} à ${hFmt(c.time)}</span></div>
        <div class="transcript">${transcriptOf(c)}</div>
        <p class="small faint" style="margin:10px 0 0">La transcription sert de support à la rédaction. Elle n’est pas conservée au dossier.</p>
      </div>
      <div class="card">
        <div class="card-head"><h2><a href="#/patient/${c.patientId}" style="color:var(--text)">${esc(pName(patient(c.patientId)))}</a> · ${esc(ctype(c.type).l)}</h2>${c.statut === 'a_valider' ? pill('À valider', 'amber') : pill('Validé', 'green')}</div>
        ${c.statut === 'a_valider' ? `<div class="urgent-banner" style="background:var(--warn-soft);color:var(--warn)">${icon('shield')}<div>Projet préparé par l’IA. Validation obligatoire : rien n’est enregistré au dossier sans votre relecture. Complétez les zones entre crochets.</div></div>` : `<p class="small muted" style="margin-top:-4px">Validé${c.valideLe ? ` le ${fmtDateTime(c.valideLe)}` : ''}${c.modifie ? ' · modifié par le médecin' : ''}.</p>`}
        <textarea class="input cr-text" id="crText" rows="16" ${c.statut === 'valide' ? 'readonly' : ''}>${esc(c.texte)}</textarea>
        <div class="btn-row" style="justify-content:flex-end;margin-top:14px">
          ${c.statut === 'a_valider' ? `<button class="btn" data-act="crSave">Enregistrer le brouillon</button><button class="btn primary" data-act="crValidate">${icon('check')} Valider le compte rendu</button>` : `<button class="btn" data-act="crReopen">Modifier</button>`}
        </div>
      </div>
    </div>` : '<div class="card empty">Aucun compte rendu pour le moment.</div>'}
  </div>`;
}

/* ==========================================================================
   Documents : classement par l’IA, correction, à signer, archivés
   ========================================================================== */
function viewDocuments(){
  const m = myMedecin();
  if (!ui.docFilter) ui.docFilter = m ? 'a_signer' : 'a_traiter';
  const base = state.documents.filter(d => !m || d.medecinId === m);
  const list = base.filter(d => ui.docFilter === 'tous' || d.statut === ui.docFilter).slice(0, 80);
  const count = k => base.filter(d => d.statut === k).length;
  return `<div class="page">
    <div class="page-head"><div><h1>Documents</h1><p>Courriers et résultats classés automatiquement ${aiBadge()} · le secrétariat vérifie, le médecin signe</p></div>
      <div class="seg">${[['a_traiter',`À traiter (${count('a_traiter')})`],['a_signer',`À signer (${count('a_signer')})`],['archive','Archivés'],['tous','Tous']].map(([k, l]) => `<button class="${ui.docFilter === k ? 'on' : ''}" data-act="docFilter" data-k="${k}">${l}</button>`).join('')}</div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Reçu</th><th>Document</th><th>Patient</th><th>Type</th><th>Statut</th><th></th></tr></thead>
      <tbody>${list.map(d => {
        const edit = d.statut === 'a_traiter';
        return `<tr style="cursor:default">
        <td class="small muted">${fmtTimeAgo(d.date)}</td>
        <td><div class="cab-name">${esc(d.titre)}</div><div class="cab-sub">${esc(lab(DOC_SOURCES, d.source))}${d.ia ? ` · ${aiBadge(`Classement proposé par l’IA (confiance ${d.confiance} %)`)} ${d.confiance} %` : ''}</div></td>
        <td>${edit ? `<select class="input" data-docf="patientId" data-id="${d.id}" style="min-width:170px">${patOpts(d.patientId)}</select>` : `<a href="#/patient/${d.patientId}">${esc(pName(patient(d.patientId)))}</a>`}</td>
        <td>${edit ? `<select class="input" data-docf="type" data-id="${d.id}" style="min-width:170px">${opts(DOC_TYPES, d.type)}</select>` : esc(d.type)}</td>
        <td>${tagc(lab(DOC_STATUTS, d.statut), col(DOC_STATUTS, d.statut))}</td>
        <td>${edit ? `<button class="btn sm primary" data-act="docValidate" data-id="${d.id}">${icon('check')} Valider</button>`
          : d.statut === 'a_signer' ? (m ? `<button class="btn sm primary" data-act="docSign" data-id="${d.id}">${icon('pen')} Signer</button>` : `<span class="small faint">${esc(shortDoc(d.medecinId))}</span>`) : ''}</td></tr>`;
      }).join('') || '<tr><td colspan="6"><div class="empty">Aucun document dans cette catégorie.</div></td></tr>'}</tbody>
    </table></div>
    <p class="small faint" style="margin-top:12px">Un document n’est rattaché au dossier qu’après vérification. En cas de doute sur le patient, corrigez la proposition avant de valider.</p>
  </div>`;
}
</script>
<script>
/* ==========================================================================
   Rappels et absences : rappels SMS / email, non honorés, liste d’attente
   ========================================================================== */
function viewRappels(){
  const tabs = [['rappels','Rappels'],['absents','Rendez-vous non honorés'],['attente','Liste d’attente']];
  const body = ui.rapTab === 'absents' ? rapAbsents() : ui.rapTab === 'attente' ? rapAttente() : rapRappels();
  return `<div class="page">
    <div class="page-head"><div><h1>Rappels et absences</h1><p>Rappels automatiques ${aiBadge('Envoyés automatiquement')} , suivi des rendez-vous non honorés et créneaux libérés reproposés.</p></div></div>
    <div class="card"><div class="tabs">${tabs.map(([k, l]) => `<button class="${ui.rapTab === k ? 'on' : ''}" data-act="rapTab" data-k="${k}">${l}</button>`).join('')}</div>${body}</div>
  </div>`;
}
function rapRappels(){
  const t = todayStr(), since = ymd(addDays(new Date(), -6));
  const sent = state.rdv.filter(r => r.rp && r.date >= since && r.date <= ymd(addDays(new Date(), 2)));
  const conf = sent.filter(r => r.rp.s === 'confirme').length, ann = sent.filter(r => r.rp.s === 'annule').length;
  let end = addDays(new Date(), 1); while (!isWeekday(end)) end = addDays(end, 1);
  const list = state.rdv.filter(r => r.date >= t && r.date <= ymd(end) && (r.statut === 'prevu' || (r.rp && r.rp.s === 'annule')) && !(r.date === t && r.time < nowHM()))
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  return `<div class="kpi-mini" style="margin-bottom:16px">
      <div><div class="l">Rappels envoyés (7 j)</div><div class="v">${sent.length}</div></div>
      <div><div class="l">Taux de confirmation</div><div class="v">${pct(conf, sent.length)} %</div></div>
      <div><div class="l">Annulations par rappel</div><div class="v">${ann}</div></div>

function bindKanban(){
  let dragId = null, moved = false;
  $$('.kcard').forEach(card => {
    card.addEventListener('dragstart', e => { dragId = card.dataset.id; moved = true; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
    card.addEventListener('dragend', () => { card.classList.remove('dragging'); setTimeout(() => moved = false, 50); });
    card.addEventListener('click', e => { if (moved || e.target.closest('select')) return; const t = state.taches.find(x => x.id === card.dataset.id); if (t) tacheForm(t, false); });
  });
  $$('.kcol').forEach(colEl => {
    colEl.addEventListener('dragover', e => { e.preventDefault(); colEl.classList.add('over'); });
    colEl.addEventListener('dragleave', e => { if (!colEl.contains(e.relatedTarget)) colEl.classList.remove('over'); });
    colEl.addEventListener('drop', e => {
      e.preventDefault(); colEl.classList.remove('over');
      const t = state.taches.find(x => x.id === (e.dataTransfer.getData('text/plain') || dragId));
      if (t && t.statut !== colEl.dataset.col){ t.statut = colEl.dataset.col; save(); toast(`Tâche → ${lab(TACHE_STATUTS, t.statut)}`); render(); }
    });
  });
}

const PERIODS = [['7','7 jours'],['30','30 jours'],['mois','Mois en cours'],['trimestre','Trimestre']];
function periodRange(){
  const t = todayStr(), n = new Date();
  if (ui.period === 'mois') return [ymd(new Date(n.getFullYear(), n.getMonth(), 1)), t];
  if (ui.period === 'trimestre') return [ymd(addDays(n, -89)), t];
  return [ymd(addDays(n, -(+ui.period - 1))), t];
}
function viewActivite(){
  const [from, to] = periodRange();
  const s = state.settings, g = gainsIA(from, to);
  const appels = state.appels.filter(a => callDay(a) >= from && callDay(a) <= to);
  const rdvP = state.rdv.filter(r => r.date >= from && r.date <= to && r.statut !== 'annule');
  const hon = rdvP.filter(r => r.statut === 'honore');
  const ca = chiffreAffaires(from, to);
  const funnel = [
    ['Appels reçus', appels.length],
    ['Résolus par l’IA', g.resolus],
    ['RDV pris ou déplacés par l’IA', appels.filter(a => a.action === 'rdv_pris' || a.action === 'deplace').length],
    ['Transférés à l’équipe', appels.filter(a => a.action === 'transfere').length],
    ['À rappeler par l’équipe', appels.filter(a => a.action === 'a_rappeler').length],
    ['Urgences signalées', appels.filter(a => a.urgent).length],
  ].map(([l, v], i) => ({l, v, display: i ? `${v} <small>${pct(v, appels.length)} %</small>` : String(v), hi: l === 'Urgences signalées'}));
  const motifs = MOTIFS_APPEL.map(m => { const v = appels.filter(a => a.motif === m.k).length; return {l:m.l, v, display:`${v} <small>${pct(v, appels.length)} %</small>`}; }).sort((a, b) => b.v - a.v);
  const parPrat = medecins().map(m => { const v = hon.filter(r => r.medecinId === m.id).length; return {l:m.nom, v, display:fmtNum(v), tip:`${m.nom} : ${v} consultations honorées`}; });
  const caPrat = medecins().map(m => { const v = chiffreAffaires(from, to, r => r.medecinId === m.id); return {l:m.nom, v, display:fmtEur(v)}; });
  const caType = state.types.map(t => { const v = chiffreAffaires(from, to, r => r.type === t.k); return {l:t.l, v, display: fmtEur(v), tip:`${t.l} : ${hon.filter(r => r.type === t.k).length} actes × ${fmtEur(t.tarif)}`}; }).filter(r => r.v).sort((a, b) => b.v - a.v);
  const fill = medecins().map(m => { const v = remplissage(from, to, m.id); return {l:m.nom, v, display:`${v} %`}; });
  const delais = medecins().map(m => { const v = delaiMoyen(from, to, m.id); return {l:m.nom, v, display:`${fmtNum(v, 1)} j`}; });
  const weeks = [];
  const nW = Math.min(13, Math.ceil((dayDiff(to, from) + 1) / 7) + 1);
  for (let k = nW - 1; k >= 0; k--){
    const ws = addDays(startOfWeek(), -7*k), we = addDays(ws, 6);

    const v = absenceRate(wFrom, wTo);
    weeks.push({l:`Semaine du ${ws.getDate()} ${MOIS[ws.getMonth()]}`, v, display:`${fmtNum(v, 1)} %`, tip:`${fmtNum(v, 1)} % de rendez-vous non honorés${wFrom >= state.rappelsDepuis ? '' : ' · avant les rappels automatiques'}`, hi: wFrom < state.rappelsDepuis});
  }
  const maxW = Math.max(10, ...weeks.map(w => w.v));
  const sources = RDV_SOURCES.map(x => { const v = rdvP.filter(r => r.source === x.k).length; return {l:x.l, v, display:`${v} <small>${pct(v, rdvP.length)} %</small>`}; }).filter(r => r.v);
  const hours = [];
  for (let h = 7; h <= 20; h++){ const v = appels.filter(a => new Date(a.date).getHours() === h).length; const off = h < 8 || h === 12 || h === 13 || h >= 19; if (v) hours.push({l:`${h} h – ${h + 1} h`, v, hi: off, tip:`${v} appels${off ? ' · hors horaires du secrétariat' : ''}`}); }
  const mn = s.minutes;
  return `<div class="page">

      <div class="seg">${PERIODS.map(([k, l]) => `<button class="${ui.period === k ? 'on' : ''}" data-act="period" data-k="${k}">${l}</button>`).join('')}</div></div>
    <div class="grid g-kpi" style="margin-bottom:16px">
      ${kpi('Consultations honorées', fmtNum(hon.length), `CA estimé ${fmtEur(ca)}`)}
      ${kpi('Taux de remplissage', `${remplissage(from, to)}<small> %</small>`, 'Tous praticiens', remplissage(from, to))}
      ${kpi('RDV non honorés', `${fmtNum(absenceRate(from, to), 1)}<small> %</small>`, `${rdvP.filter(r => r.statut === 'absent').length} rendez-vous`)}
      ${kpi('Délai moyen pour un RDV', `${fmtNum(delaiMoyen(from, to), 1)}<small> j</small>`, 'Entre la prise et la date du rendez-vous')}
      ${kpi(`Appels traités par l’IA ${aiBadge()}`, `${pct(g.resolus, g.appels)}<small> %</small>`, `${fmtNum(g.heures)} h de temps administratif gagné`)}
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-head"><h2>Temps et revenus gagnés grâce à l’IA ${aiBadge()}</h2><span class="small faint">calculé sur les données réelles de la période</span></div>
      <div class="calc-grid">
        <div>
          <div class="hero">

/* CSV */
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const sep = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep){ row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i+1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return {sep, rows: rows.filter(r => r.some(x => x.trim()))};
}
const CSV_ALIASES = {
  prenom:['prenom','first name','firstname'], nom:['nom','last name','lastname','nom de famille'], naissance:['naissance','annee de naissance','date de naissance','ne en','ne(e) en'],
  tel:['telephone','tel','phone','portable','mobile'], email:['email','mail','e-mail','courriel'], ville:['ville','city','commune'],
  medecin:['medecin','medecin traitant','docteur'], notes:['notes','note','commentaire'],
};
function importCSV(text){
  const {sep, rows} = parseCSV(text);
  if (rows.length < 2){ toast('Fichier vide ou illisible'); return; }
  const head = rows[0].map(h => norm(h));
  const idx = {};
  for (const [k, al] of Object.entries(CSV_ALIASES)){ const i = head.findIndex(h => al.includes(h)); if (i >= 0) idx[k] = i; }
  if (idx.nom == null){ toast('Colonne « nom » introuvable'); return; }
  let n = 0;
  for (const r of rows.slice(1)){
    const g = k => idx[k] != null ? (r[idx[k]] || '').trim() : '';
    if (!g('nom')) continue;
    const p = newPatientObj();
    Object.assign(p, {prenom:g('prenom'), nom:g('nom'), tel:g('tel'), email:g('email'), ville:g('ville'), notes:g('notes')});
    p.naissance = (g('naissance').match(/(19|20)\d\d/) || [''])[0];
    const med = medecins().find(m => g('medecin') && norm(m.nom).includes(norm(g('medecin')).replace(/^dr\.?\s*/, '')));
    if (med) p.medecinId = med.id;
    state.patients.push(p); n++;
  }
  logAccess(`Import CSV de ${plural(n, 'patient')}`);
  save(); toast(`${plural(n, 'patient')} importé${n > 1 ? 's' : ''} (séparateur « ${sep} »)`); render();
}
function exportCSV(){
  const cell = v => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [['Prénom','Nom','Année de naissance','Téléphone','Email','Ville','Médecin traitant','Dernier RDV','Prochain RDV','Notes'].join(';')];
  const idx = patientIndex();
  for (const p of state.patients){
    const x = idx[p.id];
    lines.push([p.prenom, p.nom, p.naissance, p.tel, p.email, p.ville, memberName(p.medecinId), x.last ? x.last.date : '', x.next ? `${x.next.date} ${x.next.time}` : '', p.notes].map(cell).join(';'));
  }
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `patients-${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  logAccess('Export CSV des patients'); save();
  toast('Export CSV téléchargé');
}

function openModal(html, size=''){
  $('#modal').innerHTML = `<div class="overlay" data-overlay><div class="modal ${size}" role="dialog" aria-modal="true">${html}</div></div>`;
}
function closeModal(){ $('#modal').innerHTML = ''; }
const isModalOpen = () => !!$('#modal .overlay');
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
function confirmBox(title, text, okLabel, onOk){
  openModal(`<div class="modal-head"><div><h2>${esc(title)}</h2><p>${esc(text)}</p></div></div>
    <div class="modal-foot"><button class="btn" data-act="closeModal">Annuler</button><button class="btn primary" id="confirmOk">${esc(okLabel)}</button></div>`);
  $('#confirmOk').onclick = () => { closeModal(); onOk(); };
  $('#confirmOk').focus();
}
function showTip(el, e){ const t = $('#tooltip'); t.textContent = el.dataset.tip; t.classList.add('show'); moveTip(e); }
function moveTip(e){ const t = $('#tooltip'); const w = t.offsetWidth; t.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, e.clientX - w / 2)) + 'px'; t.style.top = (e.clientY - 40) + 'px'; }
function hideTip(){ const t = $('#tooltip'); if (t) t.classList.remove('show'); }
function applyTheme(t){ if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
function toggleTheme(){
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  renderShell();
}

  if (e.target.closest('#drawer a')){ $('#drawer').innerHTML = ''; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const link = e.target.closest('a[href]');
  if (link && link !== el && el.contains(link)) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  e.stopPropagation();

  if (!keepDefault && el.tagName !== 'A') e.preventDefault();

  if (el.dataset.whosel && !isInput){ setRole(el.dataset.whosel, val); return; }

    ui.pf[el.dataset.pfilter] = val;

    else if (!isInput) render();

    const p = patient(route().arg); if (!p) return;
    if (el.tagName === 'SELECT' && isInput) return;
    p[el.dataset.pf] = val; save();
    if (!isInput && el.dataset.pf === 'medecinId') render();
    return;
  }
  if (el.id === 'agendaPick' && !isInput && val){ ui.agendaDate = val; render(); return; }
  if (el.id === 'secSearch'){ ui.secQ = val; $('#secList').innerHTML = secListHtml(secList()); return; }
  if (el.id === 'demSearch'){ ui.demQ = val; $('#demList').innerHTML = demListHtml(demList()); return; }
  if (el.id === 'tplSearch'){ ui.tplQ = val; $('#tplList').innerHTML = tplList(tplVars()); return; }
  if (el.id === 'crPick' && !isInput){ ui.selCr = val; render(); return; }
  if (el.id === 'tacheResp' && !isInput){ ui.tacheResp = val; render(); return; }
  // Demande : correction du tri proposé par l’IA, brouillon
  if (el.dataset.demf && !isInput){
    const d = curDem(); const k = el.dataset.demf;
    if (k !== 'statut' && d[k] !== val) d.corrige = true;
    d[k] = val;
    if (k === 'type') d.brouillon = plainVars(draftFor(d, patient(d.patientId)), tplVars());
    if (k === 'statut' && val === 'traitee' && !d.reponse) d.reponse = null;
    save(); $('#demDetail').innerHTML = demDetail(); $('#demList').innerHTML = demListHtml(demList()); renderShell(); return;
  }
  if (el.id === 'demDraft'){ const d = curDem(); if (d){ d.brouillon = val; save(); } return; }
  // Tâches sur mobile
  if (el.dataset.move && !isInput){ const t = state.taches.find(x => x.id === el.dataset.move); t.statut = val; save(); toast(`Tâche → ${lab(TACHE_STATUTS, val)}`); render(); return; }
  // Documents : correction de la proposition de l’IA
  if (el.dataset.docf && !isInput){ const d = state.documents.find(x => x.id === el.dataset.id); d[el.dataset.docf] = val; d.corrige = true; save(); return; }
  // Modèles et message d’accueil
  if (el.dataset.tf){ state.templates[+el.dataset.tpl][el.dataset.tf] = val; save(); return; }
  if (el.dataset.tplid){ const t = state.templates.find(x => x.id === el.dataset.tplid); if (t){ t.texte = val; save(); } return; }
  // Automatisations
  if (el.dataset.auto && !isInput){
    const a = state.automations.find(x => x.id === el.dataset.auto); a.actif = el.checked;
    logAccess(`${a.actif ? 'Activation' : 'Désactivation'} : ${a.nom}`); save();
    toast(`${a.nom} : ${a.actif ? 'activée' : 'désactivée'}`); render(); return;
  }
  // Équipe : horaires ; types de consultation
  if (el.dataset.memf){ const m = member(el.dataset.id); m[el.dataset.memf] = val; save(); return; }
  if (el.dataset.tyf){
    const t = state.types[+el.dataset.type]; const k = el.dataset.tyf;
    if (el.tagName === 'SELECT' && isInput) return;
    t[k] = k === 'duree' || k === 'tarif' ? Math.max(0, +val || 0) : val; save();
    if (k === 'c' && !isInput) render();
    return;
  }
  // Hypothèses et paramètres
  if (el.dataset.min){ state.settings.minutes[el.dataset.min] = Math.max(0, +val || 0); save(); if (!isInput) render(); return; }
  if (el.dataset.set){
    const k = el.dataset.set;
    const numeric = ['valeurConsult','coutHoraire','prixIA','tauxAbsenceAvant'].includes(k);
    state.settings[k] = numeric ? Math.max(0, +val || 0) : val;
    save();
    if (k === 'appName' || k === 'cabinet') renderShell();
    if (!isInput && (numeric || ['hebergeur','dpo','confidentialite'].includes(k))) render();
    return;
  }
  if (el.id === 'csvFile' && !isInput && el.files[0]){
    const reader = new FileReader();
    reader.onload = () => importCSV(String(reader.result));
    reader.readAsText(el.files[0], 'utf-8');
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (isModalOpen()) closeModal();
    else if ($('#drawer').innerHTML) $('#drawer').innerHTML = '';
    return;
  }
  if (isModalOpen()){
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && $('#treatForm')){ e.preventDefault(); commitTreat(true); }
    return;
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input','textarea','select'].includes(tag) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (route().name !== 'secretariat') return;
  const a = curCall(); if (!a || a.traitement) return;
  const r = TRAITEMENTS.find(x => x.key === e.key);
  if (r){ e.preventDefault(); openTreat(a, r.k); }
});

document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el, e); });
document.addEventListener('mousemove', e => { if (e.target.closest('[data-tip]')) moveTip(e); });
document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hideTip(); });

window.addEventListener('hashchange', () => { closeModal(); render(); });
window.addEventListener('storage', e => { if (e.key === STORE_KEY && e.newValue){ load(); render(); } });

/* ==========================================================================
   Démarrage
   ========================================================================== */
try { applyTheme(localStorage.getItem(THEME_KEY)); } catch (e) {}
load();
render();
</script>
</body>
</html>
